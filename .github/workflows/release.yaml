# Release pipeline: a thin caller for the org's reusable release workflow.
# release-please watches main and keeps a release PR current from the Conventional
# Commit history. When that PR merges, the workflow cuts the draft GitHub release +
# vX.Y.Z tag and GoReleaser adopts it. GoReleaser produces binary archives + checksums +
# SBOMs + keyless cosign signatures (linux/windows), Developer ID-signed + notarized
# darwin binaries, and a SLSA build-provenance attestation over
# everything in checksums.txt. Container images are published by goreleaser
# (dockers_v2 over the repo-root Dockerfile.*) to ghcr, and their digests
# (dist/digests.txt) get the same build-provenance attestation as the archives.
# The workstation CLI is the one binary that runs on a laptop rather than in the
# cluster. It also ships as a Homebrew cask pushed to
# bitwise-media-group/homebrew-tap.
# When a release was cut, the helm job then packages, cosign-signs, and pushes
# the chart to ghcr (helm.yaml, called at the release tag). It runs here rather
# than on `release: published` because goreleaser publishes the
# release with GITHUB_TOKEN, and GITHUB_TOKEN-driven events start no workflows.
#
# When a push cut no release, the edge jobs publish it instead, as an
# immutable edge build on ghcr next to the releases: the images
# v<next version>-edge.<UTC timestamp>.g<commit> (patchy.yaml), then both
# charts at the same version without the v. A cluster that burns patchy in
# before a release follows them with a pre-release range; a plain range
# never matches a pre-release, so nothing downstream moves.
#
# app-client-id/app-private-key author the release-please PR as the "FF Merge" App
# instead of the GITHUB_TOKEN. A GITHUB_TOKEN-authored push fires no workflow_run,
# so a release PR opened that way never triggers the auto-merge in merge.yaml;
# authoring it as the App makes the release PR auto-merge once approved and green,
# like any other.
#
# The reusable workflow is pinned to a full commit SHA (tag in the comment) so a
# moved tag can never change what runs; Renovate keeps the pin fresh.
name: Release

on:
    push:
        branches: [main]
    # allow cutting a release manually from the Actions tab
    workflow_dispatch:

permissions: {}

jobs:
    release:
        uses: bitwise-media-group/github-workflows/.github/workflows/release.yaml@8227860743622e23d8ed2bc059841bedac2e668f # v8.5.0
        # ceiling for the reusable workflow's release-please + goreleaser jobs.
        # GitHub resolves a reusable workflow's permissions as the union of every job
        # and ignores `if:`, so the caller must grant the goreleaser job's id-token /
        # attestations / artifact-metadata even on a release that skips them.
        permissions:
            # create the release/tag and upload assets
            contents: write
            # release-please creates pr labels via the issues api
            issues: write
            # release-please opens the release pull request
            pull-requests: write
            # cosign keyless signing (goreleaser)
            id-token: write
            # push the dockers_v2 container images to ghcr
            packages: write
            # github build-provenance attestation
            attestations: write
            # artifact storage record for the attestation
            artifact-metadata: write
            # granted for parity with the reusable workflow's docs job ceiling
            pages: write
        with:
            # author the release PR as the FF Merge App so it can auto-merge (a
            # GITHUB_TOKEN-authored push fires no workflow_run to trigger the merge)
            app-client-id: ${{ vars.FF_MERGE_CLIENT_ID }}
        secrets:
            # private key for the App that authors the release PR (same App as /merge)
            app-private-key: ${{ secrets.FF_MERGE_PRIVATE_KEY }}
            # Apple signing + notarization of the darwin binaries (notarize.macos in
            # .goreleaser.yaml). Org secrets scoped to the notarizing repos: the
            # shared open-source Developer ID Application certificate (+ its export
            # password) and the App Store Connect team API key. Setup is documented
            # in github-workflows README → "macOS notarization: org setup".
            macos-sign-p12: ${{ secrets.MACOS_SIGN_P12 }}
            macos-sign-password: ${{ secrets.MACOS_SIGN_PASSWORD }}
            macos-notary-issuer-id: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
            macos-notary-key-id: ${{ secrets.MACOS_NOTARY_KEY_ID }}
            macos-notary-key: ${{ secrets.MACOS_NOTARY_KEY }}

    # Package, sign, and push the helm chart to ghcr, but only when this run cut a
    # release (release_created is an empty string otherwise). This runs after the
    # reusable workflow finishes, so the container images the chart references are
    # already on ghcr; the checkout inside helm.yaml is at the release tag, whose
    # Chart.yaml release-please has already stamped.
    helm:
        needs: release
        if: needs.release.outputs.release_created
        uses: ./.github/workflows/helm.yaml # zizmor: ignore[self-repository] -- actionlint 1.7.12 (also in lint) rejects the $/ form
        # ceiling for helm.yaml's publish job
        permissions:
            contents: read
            # helm push to ghcr (also pushes the cosign signature artifact)
            packages: write
            # keyless signing: the cosign chart signature and the provenance attestation
            id-token: write
            # github build-provenance attestation
            attestations: write
            # artifact storage record for the attestation
            artifact-metadata: write
        with:
            ref: ${{ needs.release.outputs.tag_name }}

    # Freeze the docs' What's new page for the release just cut and start the
    # next one, as a pull request (whats-new.yaml). The docs job inside the
    # reusable workflow has already published the site from the release commit.
    whats-new:
        needs: release
        if: needs.release.outputs.release_created
        uses: ./.github/workflows/whats-new.yaml # zizmor: ignore[self-repository] -- actionlint 1.7.12 (also in lint) rejects the $/ form
        # the App token does the writing; the job token only reads the checkout
        permissions:
            contents: read
        with:
            version: ${{ needs.release.outputs.version }}
        secrets:
            FF_MERGE_PRIVATE_KEY: ${{ secrets.FF_MERGE_PRIVATE_KEY }}

    # Shoot the docs' screenshots into the release PR release-please has just
    # opened or updated (release-screenshots.yaml), so the reviewer sees them
    # before approving and the release publishes them. A run that cut a release
    # merged that PR, so there is nothing to shoot into.
    screenshots:
        needs: release
        if: ${{ !needs.release.outputs.release_created }}
        uses: ./.github/workflows/release-screenshots.yaml # zizmor: ignore[self-repository] -- actionlint 1.7.12 (also in lint) rejects the $/ form
        # the App token does the writing; the job token reads the checkout and
        # looks the release PR up
        permissions:
            contents: read
            pull-requests: read
        secrets:
            FF_MERGE_PRIVATE_KEY: ${{ secrets.FF_MERGE_PRIVATE_KEY }}

    # The edge build of a push that cut no release: patchy's images
    # (patchy.yaml), through the org's patchy-publish action, which resolves
    # the next version from the release PR, runs the images-context task to
    # cross-compile the binaries the Dockerfiles copy in, then builds, scans
    # (grype) and pushes them to ghcr and signs them. A composite action keeps
    # this job's identity, so they are signed as
    # .../patchy/.github/workflows/release.yaml@refs/heads/main, not as the
    # shared workflow that signs releases; a cluster following edge trusts
    # both (SIGNED_IDENTITY_PATCHY_IMAGES). Releases stay goreleaser's: they
    # are rebuilt, not promoted from edge.
    edge:
        needs: release
        if: ${{ !needs.release.outputs.release_created }}
        runs-on: ubuntu-latest
        # one edge build at a time, in push order, so a newer build never
        # lands before an older one
        concurrency:
            group: patchy-edge
            cancel-in-progress: false
        permissions:
            # check out the source to build
            contents: read
            # push the images to ghcr
            packages: write
            # keyless signing rides the job's OIDC token
            id-token: write
        outputs:
            version: ${{ steps.edge.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  submodules: true # the toolchain at .mise/ pins patchy, cosign and grype

            - id: publish
              uses: bitwise-media-group/github-workflows/.github/actions/patchy-publish@8227860743622e23d8ed2bc059841bedac2e668f # v8.5.0
              with:
                  mode: edge
                  github-registry: ghcr.io/${{ github.repository }}
                  prepare: mise run images-context

            - id: edge
              env:
                  VERSION: ${{ steps.publish.outputs.version }}
                  TIMESTAMP: ${{ steps.publish.outputs.timestamp }}
              run: echo "version=${VERSION}-edge.${TIMESTAMP}.g${GITHUB_SHA::7}" >>"${GITHUB_OUTPUT}"

    # Both charts at the edge build's version, once its images are on ghcr:
    # the chart's appVersion is the same version, so its default image tag
    # (v<appVersion>) names the images the edge job has just pushed.
    edge-charts:
        needs: edge
        uses: ./.github/workflows/helm.yaml # zizmor: ignore[self-repository] -- actionlint 1.7.12 (also in lint) rejects the $/ form
        # ceiling for helm.yaml's publish job
        permissions:
            contents: read
            # helm push to ghcr (also pushes the cosign signature artifact)
            packages: write
            # keyless signing: the cosign chart signature and the provenance attestation
            id-token: write
            # github build-provenance attestation
            attestations: write
            # artifact storage record for the attestation
            artifact-metadata: write
        with:
            version: ${{ needs.edge.outputs.version }}
