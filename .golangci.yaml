version: "2"
run:
    allow-parallel-runners: true
linters:
    default: none
    enable:
        - copyloopvar
        - dupl
        - errcheck
        - gocyclo
        - govet
        - ineffassign
        - lll
        - misspell
        - nakedret
        - prealloc
        - revive
        - staticcheck
        - unconvert
        - unparam
        - unused
    settings:
        gocyclo:
            min-complexity: 20
        revive:
            rules:
                - name: comment-spacings
                - name: import-shadowing
                - name: use-any
                - name: unreachable-code
                - name: struct-tag
                  arguments:
                      - "json,inline"
                - name: file-header
                  arguments:
                      - "SPDX-License-Identifier: MIT"
        staticcheck:
            checks:
                - all
    exclusions:
        generated: lax
        rules:
            # kubebuilder markers are single-line by grammar — they cannot be
            # wrapped to satisfy lll.
            - linters:
                  - lll
              source: '^\s*// \+kubebuilder:'
            # controller-runtime deprecates Result.Requeue in favour of
            # RequeueAfter, but the write-conflict paths want exactly what
            # Requeue gives: an immediate, rate-limited retry with no fixed
            # delay and no error log. golangci-lint 2.13+ reports it.
            - linters:
                  - staticcheck
              text: 'SA1019: \(sigs\.k8s\.io/controller-runtime\.Result\)\.Requeue is deprecated'
        paths:
            - third_party$
            - builtin$
            - examples$
            - node_modules
formatters:
    enable:
        - gofmt
        - goimports
    exclusions:
        generated: lax
        paths:
            - third_party$
            - builtin$
            - examples$
            - node_modules
