# GoReleaser config. Releases are cut by release-please: when its release PR merges,
# the reusable release workflow (.github/workflows/release.yaml) pushes the vX.Y.Z
# tag, leaves a draft GitHub release, and runs `goreleaser release` — which adopts
# that draft (use_existing_draft + mode: replace below). Build locally without
# publishing via `make snapshot`.
#
# Produces cross-platform binary archives + checksums + SBOMs, keyless cosign
# signatures (linux/windows) and Developer ID-signed, notarized darwin
# binaries, the container images (multi-arch manifests built by buildx from
# the repo-root Dockerfile.* — dockers_v2 below — and pushed to ghcr on
# release), and a Homebrew cask for the workstation CLI pushed to
# bitwise-media-group/homebrew-tap.
version: 2

# ^ref: https://goreleaser.com/errors/multiple-tokens/
force_token: github

project_name: patchy

before:
    hooks:
        - go mod download
        # The status page SPA must exist before the status-server build
        # compiles with -tags withui (internal/web/embed_ui.go).
        - npm --prefix internal/web/ui ci --no-fund --no-audit
        - npm --prefix internal/web/ui run build

env:
    - CGO_ENABLED=0

builds:
    - id: source-controller
      main: ./cmd/source-controller
      binary: source-controller
      flags:
          - -trimpath
      ldflags:
          - -s -w
          - -X github.com/bitwise-media-group/patchy/internal/version.Version={{ .Version }}
          - -X github.com/bitwise-media-group/patchy/internal/version.Commit={{ .ShortCommit }}
          - -X github.com/bitwise-media-group/patchy/internal/version.BuildDate={{ .Date }}
      goos:
          - linux
      goarch:
          - amd64
          - arm64
    - id: context-controller
      main: ./cmd/context-controller
      binary: context-controller
      flags:
          - -trimpath
      ldflags:
          - -s -w
          - -X github.com/bitwise-media-group/patchy/internal/version.Version={{ .Version }}
          - -X github.com/bitwise-media-group/patchy/internal/version.Commit={{ .ShortCommit }}
          - -X github.com/bitwise-media-group/patchy/internal/version.BuildDate={{ .Date }}
      goos:
          - linux
      goarch:
          - amd64
          - arm64
    - id: evaluation-controller
      main: ./cmd/evaluation-controller
      binary: evaluation-controller
      flags:
          - -trimpath
      ldflags:
          - -s -w
          - -X github.com/bitwise-media-group/patchy/internal/version.Version={{ .Version }}
          - -X github.com/bitwise-media-group/patchy/internal/version.Commit={{ .ShortCommit }}
          - -X github.com/bitwise-media-group/patchy/internal/version.BuildDate={{ .Date }}
      goos:
          - linux
      goarch:
          - amd64
          - arm64
    - id: remediation-controller
      main: ./cmd/remediation-controller
      binary: remediation-controller
      flags:
          - -trimpath
      ldflags:
          - -s -w
          - -X github.com/bitwise-media-group/patchy/internal/version.Version={{ .Version }}
          - -X github.com/bitwise-media-group/patchy/internal/version.Commit={{ .ShortCommit }}
          - -X github.com/bitwise-media-group/patchy/internal/version.BuildDate={{ .Date }}
      goos:
          - linux
      goarch:
          - amd64
          - arm64
    - id: integration-controller
      main: ./cmd/integration-controller
      binary: integration-controller
      flags:
          - -trimpath
      ldflags:
          - -s -w
          - -X github.com/bitwise-media-group/patchy/internal/version.Version={{ .Version }}
          - -X github.com/bitwise-media-group/patchy/internal/version.Commit={{ .ShortCommit }}
          - -X github.com/bitwise-media-group/patchy/internal/version.BuildDate={{ .Date }}
      goos:
          - linux
      goarch:
          - amd64
          - arm64
    - id: investigation-controller
      main: ./cmd/investigation-controller
      binary: investigation-controller
      flags:
          - -trimpath
      ldflags:
          - -s -w
          - -X github.com/bitwise-media-group/patchy/internal/version.Version={{ .Version }}
          - -X github.com/bitwise-media-group/patchy/internal/version.Commit={{ .ShortCommit }}
          - -X github.com/bitwise-media-group/patchy/internal/version.BuildDate={{ .Date }}
      goos:
          - linux
      goarch:
          - amd64
          - arm64
    - id: egress-broker
      main: ./cmd/egress-broker
      binary: egress-broker
      flags:
          - -trimpath
      ldflags:
          - -s -w
          - -X github.com/bitwise-media-group/patchy/internal/version.Version={{ .Version }}
          - -X github.com/bitwise-media-group/patchy/internal/version.Commit={{ .ShortCommit }}
          - -X github.com/bitwise-media-group/patchy/internal/version.BuildDate={{ .Date }}
      goos:
          - linux
      goarch:
          - amd64
          - arm64
    - id: agent-runner
      main: ./cmd/agent-runner
      binary: agent-runner
      flags:
          - -trimpath
      ldflags:
          - -s -w
          - -X github.com/bitwise-media-group/patchy/internal/version.Version={{ .Version }}
          - -X github.com/bitwise-media-group/patchy/internal/version.Commit={{ .ShortCommit }}
          - -X github.com/bitwise-media-group/patchy/internal/version.BuildDate={{ .Date }}
      goos:
          - linux
      goarch:
          - amd64
          - arm64
    - id: status-server
      main: ./cmd/status-server
      binary: status-server
      flags:
          - -trimpath
      # withui embeds the status page SPA (built by the npm before-hooks).
      tags:
          - withui
      ldflags:
          - -s -w
          - -X github.com/bitwise-media-group/patchy/internal/version.Version={{ .Version }}
          - -X github.com/bitwise-media-group/patchy/internal/version.Commit={{ .ShortCommit }}
          - -X github.com/bitwise-media-group/patchy/internal/version.BuildDate={{ .Date }}
      goos:
          - linux
      goarch:
          - amd64
          - arm64
    # The CLI is the one binary here that runs on a workstation rather than in
    # the cluster, which is why it alone builds for windows and has no container
    # image: nothing would ever run it in a pod.
    #
    # Its darwin build (and kubectl-patchy's) is a separate build id purely so
    # binary_signs (cosign) can exclude it by id: goreleaser runs binary_signs
    # BEFORE notarize, and notarization rewrites the Mach-O in place, so a
    # cosign bundle over the pre-notarized bytes would never verify against
    # the shipped binary. The OSS binary_signs has no per-artifact `if`, so the
    # build id is the only handle. Archive names are unchanged (the template
    # keys on ProjectName/Os/Arch, not the id).
    - id: patchy
      main: ./cmd/patchy
      binary: patchy
      flags:
          - -trimpath
      # shared with the darwin build below (same binary, split only by goos)
      ldflags: &patchy_ldflags
          - -s -w
          - -X github.com/bitwise-media-group/patchy/internal/version.Version={{ .Version }}
          - -X github.com/bitwise-media-group/patchy/internal/version.Commit={{ .ShortCommit }}
          - -X github.com/bitwise-media-group/patchy/internal/version.BuildDate={{ .Date }}
      goos:
          - linux
          - windows
      goarch:
          - amd64
          - arm64
    - id: patchy-darwin
      main: ./cmd/patchy
      binary: patchy
      flags:
          - -trimpath
      ldflags: *patchy_ldflags
      goos:
          - darwin
      goarch:
          - amd64
          - arm64
    # The name kubectl looks for on PATH, so `kubectl patchy get findings`
    # works for anyone who would rather not learn a second binary. A tiny exec
    # shim around the real patchy binary rather than a second full build (which
    # would double the archive), and a real file rather than a symlink because
    # the archives have to stay extractable on windows, where symlinks need a
    # privilege most users do not have.
    - id: kubectl-patchy
      main: ./cmd/kubectl-patchy
      binary: kubectl-patchy
      flags:
          - -trimpath
      # shared with the darwin build below (same binary, split only by goos)
      ldflags: &kubectl_patchy_ldflags
          - -s -w
          - -X github.com/bitwise-media-group/patchy/internal/version.Version={{ .Version }}
          - -X github.com/bitwise-media-group/patchy/internal/version.Commit={{ .ShortCommit }}
          - -X github.com/bitwise-media-group/patchy/internal/version.BuildDate={{ .Date }}
      goos:
          - linux
          - windows
      goarch:
          - amd64
          - arm64
    # darwin split out for the same notarize-vs-cosign reason as patchy-darwin.
    - id: kubectl-patchy-darwin
      main: ./cmd/kubectl-patchy
      binary: kubectl-patchy
      flags:
          - -trimpath
      ldflags: *kubectl_patchy_ldflags
      goos:
          - darwin
      goarch:
          - amd64
          - arm64

# Two archives, split by where the binary runs: the cluster components in one,
# the workstation CLI in the other. The split is what keeps the Homebrew cask
# below honest — `brew install patchy` puts the CLI (and its kubectl-plugin
# alias) on a laptop without also unpacking seven binaries that only ever run
# in a pod — and the CLI archive is the only one carrying darwin and windows:
# the cluster binaries build linux-only, since they only ever run in a pod
# (they are pure API clients and would run anywhere, but nobody deploys a
# released server binary on a workstation — local dev builds from source).
archives:
    - id: patchy
      ids:
          - source-controller
          - context-controller
          - remediation-controller
          - evaluation-controller
          - integration-controller
          - investigation-controller
          - egress-broker
          - agent-runner
          - status-server
      formats: [tar.gz]
      name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
      files:
          - LICENSE
    - id: patchy-cli
      ids: [patchy, patchy-darwin, kubectl-patchy, kubectl-patchy-darwin]
      formats: [tar.gz]
      name_template: "{{ .ProjectName }}-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
      files:
          - LICENSE
          # Pre-generated shell completions (committed by `mise run docs`), so
          # the cask installs them as static files instead of executing the
          # binary at install time (see homebrew_casks.completions below).
          # kubectl_complete-patchy is in there too — it is not a shell
          # completion script but the executable kubectl runs to complete
          # `kubectl patchy …`, so it ships as a cask binary rather than a
          # completion.
          - completions/*

checksum:
    name_template: checksums.txt

# ^ref: https://goreleaser.com/customization/package/dockers_v2/
# Container images — one per binary, each a linux/amd64 + linux/arm64 manifest.
# buildx assembles them from the binaries built above: nothing is compiled
# inside Docker; the Dockerfiles only COPY $TARGETPLATFORM/<binary> out of the
# generated build context. Image names match deploy/kustomize. `goreleaser
# release` pushes (the release workflow logs in to ghcr and sets up
# buildx/QEMU); `make snapshot` builds per-arch local images without pushing —
# it needs a running docker with buildx.
dockers_v2:
    - id: source-controller
      ids: [source-controller]
      dockerfile: Dockerfile.controller
      images:
          - ghcr.io/bitwise-media-group/patchy/source-controller
      tags:
          - v{{ .Version }}
          - latest
      platforms:
          - linux/amd64
          - linux/arm64
      build_args:
          TARGET: source-controller
      labels:
          # the source label is what links the ghcr package to this repository
          org.opencontainers.image.source: https://github.com/bitwise-media-group/patchy
          org.opencontainers.image.licenses: MIT
          org.opencontainers.image.revision: "{{ .FullCommit }}"
          org.opencontainers.image.version: "{{ .Version }}"
    - id: context-controller
      ids: [context-controller]
      dockerfile: Dockerfile.controller
