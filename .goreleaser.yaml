# ^ref: https://goreleaser.com/customization/package/docker_digests/
# Writes dist/digests.txt — one `<hex digest>  <image:tag>` line per published
# image/manifest, sha256sum format — which the release workflow feeds to
# actions/attest so the images get the same GitHub build-provenance
# attestation as every file in checksums.txt. Verify with:
#   gh attestation verify --owner bitwise-media-group \
#     oci://ghcr.io/bitwise-media-group/patchy/<name>:vX.Y.Z
docker_digest:
    name_template: digests.txt

# ^ref: https://goreleaser.com/customization/sign/docker/
# Keyless cosign signatures over the pushed container images. The empty
# `artifacts` default selects exactly the dockers_v2 image artifacts above, and
# signing targets the immutable digest, not the tag. Signatures are pushed to
# ghcr as OCI artifacts next to each image: cosign v3 stores each signature as
# a sigstore bundle attached via the OCI referrers API, the format the
# platform's kyverno verification reads (type: SigstoreBundle rules).
# --use-signing-config=false only pins the v2 trust services (Fulcio + public
# Rekor v1) — it does not change the storage format, so do not mistake it for
# a legacy-format (.sig tag) pin.
# Runs only on publish; `make snapshot` additionally skips it via --skip=sign.
# Verify with:
#   cosign verify ghcr.io/bitwise-media-group/patchy/<name>:vX.Y.Z \
#     --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp='^https://github.com/bitwise-media-group/github-workflows/'
docker_signs:
    - cmd: cosign
      args:
          - sign
          - ${artifact}@${digest}
          - --yes
          - --use-signing-config=false
      output: true

# ^ref: https://goreleaser.com/customization/sign/sign/
# Keyless cosign signatures over the linux/windows binaries; the reusable
# release workflow supplies the GitHub Actions OIDC token. The darwin CLI
# binaries are excluded by build id and carry the Apple signature +
# notarization below instead (cosign runs before notarize and would sign the
# wrong bytes); the SLSA attestation over checksums.txt still covers their
# archives. `make snapshot` skips this (--skip=sign).
binary_signs:
    - cmd: cosign
      # every build id except the two *-darwin ones
      ids:
          - source-controller
          - context-controller
          - evaluation-controller
          - remediation-controller
          - integration-controller
          - investigation-controller
          - egress-broker
          - agent-runner
          - status-server
          - patchy
          - kubectl-patchy
      signature: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}.sigstore.json"
      args:
          - sign-blob
          - --bundle=${signature}
          - ${artifact}
          - --yes
      output: true

# ^ref: https://goreleaser.com/customization/sign/notarize/
# Developer ID signing + Apple notarization of the darwin binaries, done
# cross-platform by goreleaser's embedded quill (no macOS runner). Certificate
# and API key arrive as env from the reusable release workflow, from the org
# secrets shared by every open-source repo that notarizes.
# enabled: every real release notarizes and fails if the secrets are missing
# (a published release is never un-notarized, which is what lets the cask
# skip the quarantine workaround for the binaries); a snapshot only does when
# MACOS_SIGN_P12 is exported, so `make snapshot` stays offline and a local
# end-to-end test is one env export away.
notarize:
    macos:
        - enabled: '{{ or (not .IsSnapshot) (isEnvSet "MACOS_SIGN_P12") }}'
          ids: [patchy-darwin, kubectl-patchy-darwin]
          sign:
              certificate: "{{ .Env.MACOS_SIGN_P12 }}"
              password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
          notarize:
              issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
              key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
              key: "{{ .Env.MACOS_NOTARY_KEY }}"
              wait: true
              timeout: 15m

# One SBOM per BINARY, not per archive.
#
# The archive is a tarball of every binary, so an archive-scoped SBOM lists the
# union of all seven dependency trees and cannot answer "does this CVE affect
# source-controller?". A binary-scoped SBOM can: syft reads the module list Go
# embeds at link time, which contains only what that binary actually links.
# The CLI's rendering stack (glamour, chroma, bluemonday) therefore appears in
# patchy's SBOM and in none of the controllers' — the dependency boundary as
# evidence attached to the shipped artifact, rather than as an assertion about
# how the Go linker behaves. Verify by hand with:
#   go version -m bin/source-controller | grep charmbracelet
sboms:
    - artifacts: binary
      # syft is pinned by the toolchain submodule's mise config and on PATH for
      # whoever runs goreleaser (make snapshot locally, the release workflow in CI).
      cmd: syft
      args:
          - $artifact
          - --output
          - spdx-json=$document

snapshot:
    version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
    sort: asc
    use: github
    format: "{{ .SHA }}: {{ .Message }}{{ if and (not .IsNightly) .Logins }} ({{ .Logins | englishJoin }}){{ end }}"
    filters:
        exclude:
            - "^test"
            - "^chore"
            - "^build"
    groups:
        - title: "New Features"
          regexp: '^.*?feat(\(.+\))??!?:.+$'
          order: 100
        - title: "Security Updates"
          regexp: '^.*?sec(\(.+\))??!?:.+$'
          order: 150
        - title: "Bug Fixes"
          regexp: '^.*?(fix|refactor)(\(.+\))??!?:.+$'
          order: 200
        - title: "Documentation Updates"
          regexp: ^.*?docs?(\(.+\))??!?:.+$
          order: 400
        - title: Other Work
          order: 9999

release:
    github:
        owner: bitwise-media-group
        name: patchy
    # The release-please job in release.yaml leaves a draft release named after
    # the tag it pushes. Adopt that draft instead of creating a second release,
    # swap its release-please notes for the grouped changelog above, and
    # undraft it only once every asset has been uploaded.
    use_existing_draft: true
    mode: replace

# ^ref: https://goreleaser.com/customization/homebrew_casks/
# The workstation CLI as a Homebrew cask — the cluster components are installed
# by helm/kustomize from the ghcr images above and have no business in a tap.
# `ids` sources the cask from the CLI-only archive, so the cask ships exactly
# the two binaries it declares.
homebrew_casks:
    - name: patchy
      ids: [patchy-cli]
      # kubectl-patchy is the same program under the name kubectl looks for on
      # PATH; installing both is what makes `kubectl patchy get findings` work
      # for anyone who would rather not learn a second binary.
      #
      # kubectl_complete-patchy is what makes that second form *complete*:
      # kubectl ignores a plugin's own completion script and instead executes
      # kubectl_complete-<plugin> from PATH, so the hook has to be linked into
      # bin like a binary — a bash_completion/zsh_completion stanza would put
      # it somewhere kubectl never looks.
      binaries: [patchy, kubectl-patchy, completions/kubectl_complete-patchy]
      # Static completion stanzas, NOT generate_completions_from_executable:
      # the committed completions/* are deterministic output of `mise run docs`
      # and install as plain files, so the cask never executes the binary at
      # install time and the install is reproducible from the archive alone.
      # (Static bash_completion / zsh_completion / fish_completion artifacts are
      # also ordered deterministically by Homebrew, which GeneratedCompletion —
      # missing from brew's artifact sort table as of 6.0 — is not.)
      completions:
          bash: completions/patchy.bash
          zsh: completions/patchy.zsh
          fish: completions/patchy.fish
      homepage: https://github.com/bitwise-media-group/patchy
      description: Triage and remediate security findings from the terminal, over your own kubeconfig
      # `patchy mirror` shells out to these at runtime: cosign for sign/verify,
      # osv-scanner for the osv image scanner (grype/kubescape stay optional).
      dependencies:
          - formula: cosign
          - formula: osv-scanner
      # skip the tap push for snapshots and prereleases; publish on real tags
      skip_upload: auto
      repository:
          owner: bitwise-media-group
          name: homebrew-tap
          branch: main
          token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      # patchy and kubectl-patchy are Developer ID-signed and notarized
      # (notarize.macos above), so Gatekeeper lets them run straight from the
      # quarantined download. kubectl_complete-patchy cannot be: it is a POSIX
      # sh script, and codesign/notarization only cover Mach-O binaries and
      # bundles, so its quarantine flag is stripped here instead. Only that one
      # file; the binaries keep their quarantine flag and are cleared by the
      # notarization ticket on first run.
      hooks:
          pre:
              install: |
                  if OS.mac?
                    system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/completions/kubectl_complete-patchy"]

                  end

