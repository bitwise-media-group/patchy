#
# The Forge custom resources, rendered from the `forges` values array. This is
# one half of switching the pipeline on (integrations.yaml is the other). A
# Forge says how repositories are cloned and pushed. The controllers stay idle
# until one exists. Each entry's `spec` is rendered as written.
# values.schema.json embeds the CRD spec schema, so the client validates the
# spec at install and the CRD validates it again on the server. You create the
# referenced Secrets separately. See deploy/kustomize/base/secrets.example.yaml.
#
# These CRs live in their own chart because Helm validates every manifest
# against the API server before it applies anything. A first install that
# carried both the CRDs and these CRs would fail validation before the CRDs
# exist. Install the patchy chart first, then this one, into the same
# namespace.
{{- range .Values.forges }}
---
apiVersion: patchy.bitwisemedia.uk/v1alpha1
kind: Forge
metadata:
    name: {{ required "forges[].name is required" .name }}
    namespace: {{ $.Release.Namespace }}
    labels:
        {{- include "patchy-config.labels" (dict "root" $ "name" "source-controller") | nindent 8 }}
    {{- with include "patchy-config.annotations" (dict "root" $) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    {{- required (printf "forges[%s].spec is required" .name) .spec | toYaml | nindent 4 }}
{{- end }}
