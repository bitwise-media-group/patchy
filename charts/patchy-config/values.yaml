#
# The pipeline switch-on, split out of the patchy chart on purpose: Helm
# validates every manifest in a release against the API server before applying
# anything, so a chart cannot install a CRD and a custom resource of that CRD
# in the same first release — the CR fails validation before the CRD exists.
# Install the patchy chart (the CRDs and controllers) first, then this chart.
# The referenced Secrets are created out of band — see the chart README and
# deploy/kustomize/base/secrets.example.yaml.

nameOverride: ""
fullnameOverride: ""

# Extra labels stamped on every object the chart renders.
commonLabels: {}

# Extra annotations stamped on every object the chart renders.
commonAnnotations: {}

# The controllers idle until an Integration (where findings come from, where
# the tracking issues go) and a Forge (how repositories are cloned and pushed)
# exist. Each entry below renders one CR in the release namespace — install
# this chart into the SAME namespace as the patchy release so the controllers
# see them. `spec` is rendered verbatim and validated CLIENT-side too:
# values.schema.json embeds the CRD spec schemas (generated by `mise run
# codegen`), so a typo'd or mistyped field fails the install instead of
# surfacing at the API server. The referenced Secrets are created out of band
# (see deploy/kustomize/base/secrets.example.yaml — keys: appID + privateKey,
# or token, plus webhookSecret for Integrations).
integrations: []
# - name: github
#   spec:
#       provider: github
#       secretRef:
#           name: patchy-github     # appID+privateKey (or token) + webhookSecret
#       interval: 10m               # credential revalidation
#       github:
#           # baseURL: https://ghes.example.com/api/v3   # GHES only
#           issues:
#               enabled: true       # tracking projection + human signals
#               approveComment: /approve
#               # fallbackRepository: acme/security      # where cloud findings
#               # with no resolvable repository get their tracking issue
#           codeScanningAlerts:
#               enabled: true       # scanner ingestion + alert dismissal
#
# Security Command Center has no webhook: a Pub/Sub push subscription forwards
# each notification to /google-cloud/webhooks, authenticated by the OIDC token
# Pub/Sub signs rather than an HMAC. So a google-cloud Integration carries NO
# secretRef — it holds no credential and calls no Google API — and validates
# the push against the two required fields below instead. Findings ingested
# this way still need a github Integration for their tracking issues. See
# docs/configuration/google-cloud-scc.md for the Terraform submodule that
# provisions the topic, notification config and subscription.
# - name: google-cloud
#   spec:
#       provider: google-cloud
#       googleCloud:
#           securityCommandCenter:
#               enabled: true       # SCC notification ingestion
#               # audience and serviceAccount must match the push
#               # subscription exactly or the receiver fails closed: any
#               # Google account can mint a Google-signed token, so it is the
#               # identity and the audience that make one meaningful.
#               audience: https://patchy.example.com/google-cloud/webhooks
#               serviceAccount: patchy-scc-push@my-project.iam.gserviceaccount.com
#               # The rest are optional. organization is the numeric org id,
#               # used to compose Console links for findings carrying no
#               # externalUri; minSeverity (low|medium|high|critical, default
#               # low) is the backstop under the notification config's own
#               # filter; mute writes an ignore verdict back to SCC and is
#               # accepted and validated but not yet honoured.
#               # organization: "123456789012"
#               # minSeverity: high
#               # mute:
#               #     enabled: true

forges: []
# - name: github
#   spec:
#       provider: github
#       # baseURL: https://ghes.example.com/api/v3       # GHES only
#       secretRef:
#           name: patchy-github     # appID+privateKey or token
#       # orgs: [acme]              # optional org allowlist
#       # repositories: ["^acme/payments-.*$"]           # optional regexes
#       interval: 10m
