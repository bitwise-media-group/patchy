#
# The pipeline switch-on, split out of the patchy chart on purpose: Helm
# validates every manifest in a release against the API server before applying
# anything, so a chart cannot install a CRD and a custom resource of that CRD
# in the same first release — the CR fails validation before the CRD exists.
# Install the patchy chart (the CRDs and controllers) first, then this chart.
# The referenced Secrets are created out of band — see the chart README and
# deploy/kustomize/base/secrets.example.yaml.

nameOverride: ""
fullnameOverride: ""

# Extra labels stamped on every object the chart renders.
commonLabels: {}

# Extra annotations stamped on every object the chart renders.
commonAnnotations: {}

# The controllers idle until an Integration (where findings come from, where
# the tracking issues go) and a Forge (how repositories are cloned and pushed)
# exist. Each entry below renders one CR in the release namespace — install
# this chart into the SAME namespace as the patchy release so the controllers
# see them. `spec` is rendered verbatim and validated CLIENT-side too:
# values.schema.json embeds the CRD spec schemas (generated by `mise run
# codegen`), so a typo'd or mistyped field fails the install instead of
# surfacing at the API server. The referenced Secrets are created out of band
# (see deploy/kustomize/base/secrets.example.yaml — keys: appID + privateKey,
# or token, plus webhookSecret for Integrations).
integrations: []
# - name: github
#   spec:
#       provider: github
#       secretRef:
#           name: patchy-github     # appID+privateKey (or token) + webhookSecret
#       interval: 10m               # credential revalidation
#       github:
#           # baseURL: https://ghes.example.com/api/v3   # GHES only
#           # proxy:                  # forward proxy for THIS integration's
#           #     url: http://proxy.corp.example:3128    # GitHub traffic (the
#           # GHEC IP-allowlist pattern); overrides the process proxy env.
#           # Basic-auth credentials go in the credential Secret under
#           # proxyUsername + proxyPassword, never in the url.
#           issues:
#               enabled: true       # tracking projection + human signals
#               approveComment: /approve
#               # fallbackRepository: acme/security      # where cloud findings
#               # with no resolvable repository get their tracking issue
#           codeScanningAlerts:
#               enabled: true       # scanner ingestion + alert dismissal
#
# Security Command Center has no webhook: a Pub/Sub push subscription forwards
# each notification to /google-cloud/webhooks, authenticated by the OIDC token
# Pub/Sub signs rather than an HMAC. So a google-cloud Integration carries NO
# secretRef — it holds no credential and calls no Google API — and validates
# the push against the two required fields below instead. Findings ingested
# this way still need a github Integration for their tracking issues. See
# docs/configuration/google-cloud-scc.md for the Terraform submodule that
# provisions the topic, notification config and subscription.
# - name: google-cloud
#   spec:
#       provider: google-cloud
#       googleCloud:
#           securityCommandCenter:
#               enabled: true       # SCC notification ingestion
#               # audience and serviceAccount must match the push
#               # subscription exactly or the receiver fails closed: any
#               # Google account can mint a Google-signed token, so it is the
#               # identity and the audience that make one meaningful.
#               audience: https://patchy.example.com/google-cloud/webhooks
#               serviceAccount: patchy-scc-push@my-project.iam.gserviceaccount.com
#               # The rest are optional. organization is the numeric org id,
#               # used to compose Console links for findings carrying no
#               # externalUri; minSeverity (low|medium|high|critical, default
#               # low) is the backstop under the notification config's own
#               # filter; mute writes an ignore verdict back to SCC and is
#               # accepted and validated but not yet honoured.
#               # organization: "123456789012"
#               # minSeverity: high
#               # mute:
#               #     enabled: true
#           # cloudAssetInventory is the context enhancer, independent of SCC:
#           # it resolves ownership labels (and possibly a repository) for ANY
#           # finding on a Google Cloud resource, whichever source ingested it
#           # — including Wiz. Read-only; the context-controller authenticates
#           # by workload identity (roles/cloudasset.viewer), no Secret.
#           cloudAssetInventory:
#               enabled: true
#               scope: organizations/123456789012        # or folders/<id>, projects/<id>
#               # repositoryHost: github.example.com     # default github.com
#               # labels:                                # override the label names read
#               #     org: scm-repository-org
#               #     name: scm-repository-name
#               #     provider: scm-repository-provider
#               #     url: scm-repository-url
#
# Wiz delivers both feeds through automation-rule webhooks aimed at
# /wiz/webhooks, authenticated by the shared bearer token under the
# credential Secret's webhookToken key (a Wiz automation action cannot
# compute an HMAC). The action's body template MUST follow
# docs/integrations/wiz.md — that template is the payload contract. Wiz
# findings are cloud findings: pair this with a google-cloud Integration
# carrying cloudAssetInventory (and/or an aws/azure Integration carrying
# resourceTags) to resolve their repositories, and a github Integration for
# their tracking issues.
# - name: wiz
#   spec:
#       provider: wiz
#       secretRef:
#           name: patchy-wiz        # webhookToken (+ clientId/clientSecret for api)
#       wiz:
#           issues:
#               enabled: true       # Wiz Issues (misconfigurations, toxic combinations)
#               # minSeverity: high # low|medium|high|critical, default low;
#               #                   # INFORMATIONAL is always below the floor
#           defend:
#               enabled: true       # Wiz Defend threat detections
#               # minSeverity: high
#           # api enables write-back: a dismissed finding rejects the Wiz
#           # issue (status REJECTED + note) through the GraphQL API, using
#           # the service-account keys clientId + clientSecret in the Secret.
#           # Omit it and ingestion is one-way, exactly like SCC.
#           # api:
#           #     endpoint: https://api.eu1.app.wiz.io/graphql
#           #     # tokenURL: https://auth.app.wiz.io/oauth/token
#
# The aws Integration is the AWS sibling of cloudAssetInventory: resourceTags
# resolves ownership tags (and possibly a repository) for ANY finding on an
# AWS resource, whichever source ingested it. Read-only and credential-less —
# the context-controller authenticates by the SDK default chain (EKS Pod
# Identity, IRSA, or web-identity federation), so there is NO secretRef. Exactly one inventory
# backend must be set: configAggregator (an AWS Config organization
# aggregator — needs Config recording estate-wide) or resourceExplorer (an
# organization-wide Resource Explorer view — free, but the view must include
# the tags property or the enhancer refuses it).
# - name: aws
#   spec:
#       provider: aws
#       aws:
#           resourceTags:
#               enabled: true
#               configAggregator:
#                   name: org-aggregator
#                   region: eu-west-2
#               # ... OR ...
#               # resourceExplorer:
#               #     viewARN: arn:aws:resource-explorer-2:eu-west-2:123456789012:view/org-view/11111111-2222-3333-4444-555555555555
#               # repositoryHost: github.example.com     # default github.com
#               # tags:                                  # override the tag names read
#               #     org: scm-repository-org
#               #     name: scm-repository-name
#               #     provider: scm-repository-provider
#               #     url: scm-repository-url
#
# The azure Integration is the Azure sibling of the same idea: resourceTags
# resolves ownership tags (and possibly a repository) for ANY finding on an
# Azure resource, whichever source ingested it, by looking the ARM resource
# ID up in Azure Resource Graph. Read-only and credential-less — the
# context-controller authenticates by the Azure default chain (Microsoft
# Entra Workload ID or workload identity federation), so there is NO
# secretRef. Resource Graph is always on and tenant-wide, so there is no
# backend to choose; managementGroup optionally narrows the scope.
# - name: azure
#   spec:
#       provider: azure
#       azure:
#           resourceTags:
#               enabled: true
#               # managementGroup: platform-mg           # default: the whole tenant
#               # repositoryHost: github.example.com     # default github.com
#               # tags:                                  # override the tag names read
#               #     org: scm-repository-org
#               #     name: scm-repository-name
#               #     provider: scm-repository-provider
#               #     url: scm-repository-url
#
# The generic Integration registers ANY external HTTP process — a scheduled
# job querying a warehouse store, an internal CMDB — as a finding source, a
# context enhancer, or both. All three exchanges are JSON bodies HMAC-signed
# (X-Patchy-Signature-256) with the shared secret under the credential
# Secret's webhookSecret key; docs/integrations/generic.md is the payload
# contract. Unlike every other provider, generic is NOT a singleton: each
# entry is its own identity — its NAME is the finding source id, the
# enrichment attribution, and the webhook path segment
# (/generic/<name>/webhooks, advertised on status.webhookPath) — so define as
# many as you have processes. Pair a source with a github Integration for its
# findings' tracking issues.
# - name: warehouse
#   spec:
#       provider: generic
#       secretRef:
#           name: patchy-warehouse  # webhookSecret (the shared HMAC secret)
#       generic:
#           source:
#               enabled: true       # inbound findings at /generic/warehouse/webhooks
#               # minSeverity: high # low|medium|high|critical, default low
#               # resolver enables verdict write-back: a dismissed finding
#               # POSTs {alerts, verdict} to the url, signed the same way.
#               # resolver:
#               #     enabled: true
#               #     url: https://warehouse.internal/patchy/resolve
#               #     timeout: 60s
#           # enhance makes patchy POST each opened finding's issue view to
#           # the url; the response body is the enrichment (204 = nothing).
#           # enhance:
#           #     enabled: true
#           #     url: https://warehouse.internal/patchy/enhance
#           #     timeout: 60s

forges: []
# - name: github
#   spec:
#       provider: github
#       # baseURL: https://ghes.example.com/api/v3       # GHES only
#       # proxy:                    # forward proxy for this forge's traffic
#       #     url: http://proxy.corp.example:3128        # (GHEC IP allowlist);
#       # overrides the process proxy env. Basic-auth credentials go in the
#       # credential Secret under proxyUsername + proxyPassword, never in url.
#       secretRef:
#           name: patchy-github     # appID+privateKey or token
#       # orgs: [acme]              # optional org allowlist
#       # repositories: ["^acme/payments-.*$"]           # optional regexes
#       interval: 10m
