#
# Field-level authorization for human actions on Findings. This is the Helm
# version of deploy/kustomize/base/admission-policy.yaml. Keep the two in
# step. The validation expressions are the security control, and the envtest
# suite in internal/action runs against the kustomize copy.
#
# WHY THIS EXISTS
#
# The custom verbs (approve, retry, expedite, suspend, resume) let a grant say
# "this developer may approve findings, and nothing else". The status server
# can enforce that by itself, because it writes as its own ServiceAccount and
# asks SubjectAccessReview first. Anything that writes as the *user* (the
# patchy CLI, kubectl, curl) is authorized by the API server. RBAC has no
# concept of a field: `update` on findings grants the entire object.
# Admission control is the only server-side mechanism that can express the
# difference. It runs in the API server, so it applies to every client
# equally.
#
# Unlike the kustomize copy, the exempt subjects are computed from the
# release's actual ServiceAccount names. Otherwise a renamed release or an
# overridden serviceAccount.name would silently drop a controller out of the
# exemption and stall the pipeline.
{{- if .Values.admissionPolicy.enabled }}
{{/*
Check KubeVersion and not Capabilities.APIVersions. An offline `helm template`
reports only a minimal built-in API list, so an APIVersions check would fail
every render that is not against a live cluster. KubeVersion is defined in
both cases, and you can override it with --kube-version.

This check FAILS the render instead of skipping the policy. If the policy
were silently left out, nobody would notice: the chart would install, the
verbs would look granted, and none of them would be enforced.

Chart.yaml's own kubeVersion is currently stricter than this, so in practice
helm rejects an old cluster first. The check stays because it states the
reason. And if someone relaxes that constraint one day, this check stops the
custom verbs from quietly losing all effect.
*/}}
{{- if not (semverCompare ">=1.30.0-0" .Capabilities.KubeVersion.Version) }}
{{- fail (printf "admissionPolicy.enabled is true but this cluster is %s; ValidatingAdmissionPolicy needs Kubernetes 1.30+. Upgrade, or set admissionPolicy.enabled=false and accept that the custom finding verbs become advisory: anyone holding `update` on findings could then change any field, including forging an approval." .Capabilities.KubeVersion.Version) }}
{{- end }}
{{- $ns := .Release.Namespace }}
{{- $subjects := list }}
{{- range $c := list
    (dict "name" "integration-controller" "vals" .Values.integrationController)
    (dict "name" "source-controller" "vals" .Values.sourceController)
    (dict "name" "context-controller" "vals" .Values.contextController)
    (dict "name" "investigation-controller" "vals" .Values.investigationController)
    (dict "name" "remediation-controller" "vals" .Values.remediationController)
    (dict "name" "status-server" "vals" $.Values.statusServer)
}}
{{- $sa := include "patchy.serviceAccountName" (dict "root" $ "name" $c.name "vals" $c.vals) }}
{{- $subjects = append $subjects (printf "system:serviceaccount:%s:%s" $ns $sa) }}
{{- end }}
{{- range $extra := .Values.admissionPolicy.extraExemptSubjects }}
{{- $subjects = append $subjects $extra }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: {{ include "patchy.fullname" . }}-finding-actions
    labels: {{- include "patchy.labels" (dict "root" $ "name" "admission-policy") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" $) }}
    annotations: {{- . | nindent 8 }}
    {{- end }}
spec:
    # Fail closed: a policy that cannot compile or evaluate must not let
    # every request through.
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            # CREATE is matched alongside UPDATE. Without it, a
            # user holding create+delete could delete a finding and recreate it
            # with spec.approval already set. That would give them an approval
            # they were never granted.
            - apiGroups: [patchy.bitwisemedia.uk]
              apiVersions: [v1alpha1]
              operations: [CREATE, UPDATE]
              resources: [findings]
    matchConditions:
        # The patchy controllers own spec: ingest writes it, accumulation folds
        # alerts into it, and the status server does its own SubjectAccessReview
        # before writing. They are exempt. Every other client is evaluated.
        - name: not-a-patchy-controller
          expression: >-
              !(request.userInfo.username in [{{ range $i, $s := $subjects }}{{ if $i }}, {{ end }}'{{ $s }}'{{ end }}])
    variables:
        - name: auth
          expression: >-
              authorizer.group('patchy.bitwisemedia.uk').resource('findings')
                .namespace(request.namespace)
        # oldObject is null on CREATE, and every rule below reads "unchanged
        # from old, OR authorized". On a create there is nothing to be
        # unchanged from. So setting a field at create time counts as
        # changing it.
        - name: old
          expression: "oldObject"
    validations:
        # --- the human-writable fields, each gated by its own verb ------------
        - expression: >-
              (variables.old != null && variables.old.spec.?suspend.orValue(false) == object.spec.?suspend.orValue(false))
              || (object.spec.?suspend.orValue(false)
                    ? variables.auth.check('suspend').allowed()
                    : variables.auth.check('resume').allowed())
          messageExpression: >-
              "changing spec.suspend on finding " + object.metadata.name +
              " requires the 'suspend' or 'resume' verb on findings.patchy.bitwisemedia.uk"
          reason: Forbidden

        - expression: >-
              (variables.old != null && variables.old.spec.?approval == object.spec.?approval)
              || variables.auth.check('approve').allowed()
          messageExpression: >-
              "changing spec.approval on finding " + object.metadata.name +
              " requires the 'approve' verb on findings.patchy.bitwisemedia.uk"
          reason: Forbidden

        - expression: >-
              (variables.old != null && variables.old.spec.?retry == object.spec.?retry)
              || variables.auth.check('retry').allowed()
          messageExpression: >-
              "changing spec.retry on finding " + object.metadata.name +
              " requires the 'retry' verb on findings.patchy.bitwisemedia.uk"
          reason: Forbidden

        - expression: >-
              (variables.old != null && variables.old.spec.?expedite == object.spec.?expedite)
              || variables.auth.check('expedite').allowed()
          messageExpression: >-
              "changing spec.expedite on finding " + object.metadata.name +
              " requires the 'expedite' verb on findings.patchy.bitwisemedia.uk"
          reason: Forbidden

        # --- everything else in spec belongs to the pipeline -----------------
        #
        # Listed field by field because CEL cannot subtract keys from a
        # struct. A field added to FindingSpec must be added here too. The test
        # TestAdmissionPolicyCoversEveryFindingSpecField checks this against
        # the kustomize copy, so keep this list identical to it.
        #
        # spec.related is not listed, because relationship edges are
        # documented as human-writable (api/v1alpha1/finding_types.go) and
        # carry no authority.
        - expression: >-
              variables.old == null || (
                variables.old.spec.integrationRef == object.spec.integrationRef
                && variables.old.spec.?trackingRef == object.spec.?trackingRef
                && variables.old.spec.source == object.spec.source
                && variables.old.spec.?category == object.spec.?category
                && variables.old.spec.?repository == object.spec.?repository
                && variables.old.spec.?cloudResource == object.spec.?cloudResource
                && variables.old.spec.advisories == object.spec.advisories
                && variables.old.spec.?ruleID == object.spec.?ruleID
                && variables.old.spec.?title == object.spec.?title
                && variables.old.spec.?description == object.spec.?description
                && variables.old.spec.?severity == object.spec.?severity
                && variables.old.spec.?alerts == object.spec.?alerts
                && variables.old.spec.?overflowAlerts == object.spec.?overflowAlerts
              )
          messageExpression: >-
              "finding " + object.metadata.name + " is written by the patchy pipeline; " +
              "only spec.suspend, spec.approval, spec.retry, spec.expedite and spec.related " +
              "may be changed by a user, and each needs its own verb"
          reason: Forbidden

        # --- metadata that carries meaning -----------------------------------
        #
        # The rollup finalizers make sure a finding's spend is added to the
        # rollup before deletion. Accumulation and child lookup select on the
        # selector labels. Without these rules, `update` would let a user
        # break either one.
        - expression: >-
              variables.old == null || (
                variables.old.metadata.?finalizers == object.metadata.?finalizers
                && variables.old.metadata.?ownerReferences == object.metadata.?ownerReferences
                && variables.old.metadata.?labels == object.metadata.?labels
              )
          messageExpression: >-
              "finding " + object.metadata.name +
              " has pipeline-owned finalizers, ownerReferences and labels; they may not be edited by hand"
          reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: {{ include "patchy.fullname" . }}-finding-actions
    labels: {{- include "patchy.labels" (dict "root" $ "name" "admission-policy") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" $) }}
    annotations: {{- . | nindent 8 }}
    {{- end }}
spec:
    policyName: {{ include "patchy.fullname" . }}-finding-actions
    validationActions: [Deny]
    matchResources:
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: {{ .Release.Namespace }}
---
# Field-level authorization for the request fields on Integrations: the
# backfill, replay and reset triggers each need their own custom verb on
# integrations.patchy.bitwisemedia.uk. This policy differs from the findings
# policy above in two intended ways:
#
#   * No frozen-fields rule. IntegrationSpec is operator configuration, and
#     plain `update` keeps working for the GitOps flow.
#   * Clearing a request field needs no verb. A GitOps apply that prunes a
#     set request must not be denied, and cancelling carries no authority.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: {{ include "patchy.fullname" . }}-integration-actions
    labels: {{- include "patchy.labels" (dict "root" $ "name" "admission-policy") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" $) }}
    annotations: {{- . | nindent 8 }}
    {{- end }}
spec:
    # Fail closed: a policy that cannot compile or evaluate must not let
    # every request through.
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            # CREATE is matched alongside UPDATE for the same reason as for
            # findings. Recreating an Integration with a request field already
            # set must not get the action past the verb check.
            - apiGroups: [patchy.bitwisemedia.uk]
              apiVersions: [v1alpha1]
              operations: [CREATE, UPDATE]
              resources: [integrations]
    matchConditions:
        # Same exemption as the findings policy: the status server does its
        # own SubjectAccessReview before setting a request, and the
        # controllers never write Integration spec at all.
        - name: not-a-patchy-controller
          expression: >-
              !(request.userInfo.username in [{{ range $i, $s := $subjects }}{{ if $i }}, {{ end }}'{{ $s }}'{{ end }}])
    variables:
        - name: auth
          expression: >-
              authorizer.group('patchy.bitwisemedia.uk').resource('integrations')
                .namespace(request.namespace)
        # oldObject is null on CREATE, and each rule reads "absent, OR
        # unchanged from old, OR authorized". So a request already present
        # on a new object counts as setting it, and leaving it out needs no
        # verb.
        - name: old
          expression: "oldObject"
    validations:
        - expression: >-
              !has(object.spec.backfill)
              || (variables.old != null && variables.old.spec.?backfill == object.spec.?backfill)
              || variables.auth.check('backfill').allowed()
          messageExpression: >-
              "setting spec.backfill on integration " + object.metadata.name +
              " requires the 'backfill' verb on integrations.patchy.bitwisemedia.uk"
          reason: Forbidden

        - expression: >-
              !has(object.spec.replay)
              || (variables.old != null && variables.old.spec.?replay == object.spec.?replay)
              || variables.auth.check('replay').allowed()
          messageExpression: >-
              "setting spec.replay on integration " + object.metadata.name +
              " requires the 'replay' verb on integrations.patchy.bitwisemedia.uk"
          reason: Forbidden

        - expression: >-
              !has(object.spec.reset)
              || (variables.old != null && variables.old.spec.?reset == object.spec.?reset)
              || variables.auth.check('reset').allowed()
          messageExpression: >-
              "setting spec.reset on integration " + object.metadata.name +
              " requires the 'reset' verb on integrations.patchy.bitwisemedia.uk"
          reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: {{ include "patchy.fullname" . }}-integration-actions
    labels: {{- include "patchy.labels" (dict "root" $ "name" "admission-policy") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" $) }}
    annotations: {{- . | nindent 8 }}
    {{- end }}
spec:
    policyName: {{ include "patchy.fullname" . }}-integration-actions
    validationActions: [Deny]
    matchResources:
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: {{ .Release.Namespace }}
{{- end }}
