{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.21.0
  name: integrations.patchy.bitwisemedia.uk
spec:
  group: patchy.bitwisemedia.uk
  names:
    categories:
    - patchy
    kind: Integration
    listKind: IntegrationList
    plural: integrations
    singular: integration
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.webhookPath
      name: Webhook
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Integration configures one external system patchy exchanges finding state
          with: scanners in (code-scanning alerts, Security Command Center, Wiz, or
          any process speaking the generic HTTP contract), context enhancers (Cloud
          Asset Inventory, AWS resource tags, Azure resource tags, generic HTTP),
          tracking out (GitHub issues), and the human signals flowing back.

          A generic Integration's name doubles as its finding source id and label
          value, so it must not shadow a built-in source id and must fit a label.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              IntegrationSpec configures one external system. Exactly the provider block
              matching spec.provider must be set (CEL-enforced) — integrations are
              strongly typed; the generic provider is the deliberate escape hatch, typed
              around patchy's own HTTP contract rather than a vendor's.
            properties:
              aws:
                description: AWS is the aws provider block.
                properties:
                  resourceTags:
                    description: ResourceTags enables the tag-inventory enhancer.
                    properties:
                      configAggregator:
                        description: |-
                          ConfigAggregator queries an AWS Config aggregator (SQL over recorded
                          configuration items).
                        properties:
                          name:
                            description: Name of the configuration aggregator.
                            minLength: 1
                            type: string
                          region:
                            description: Region the aggregator lives in.
                            minLength: 1
                            type: string
                        required:
                        - name
                        - region
                        type: object
                      enabled:
                        description: Enabled turns the enhancer capability on.
                        type: boolean
                      repositoryHost:
                        description: |-
                          RepositoryHost is the forge host repositories named by tags live on;
                          empty means github.com.
                        type: string
                      resourceExplorer:
                        description: ResourceExplorer searches an AWS Resource Explorer
                          view.
                        properties:
                          viewARN:
                            description: |-
                              ViewARN is the Resource Explorer view, e.g.
                              arn:aws:resource-explorer-2:eu-west-2:123456789012:view/org-view/<uuid>.
                              The region the view lives in is read from the ARN.
                            pattern: ^arn:[a-z-]+:resource-explorer-2:[a-z0-9-]+:[0-9]{12}:view/.+$
                            type: string
                        required:
                        - viewARN
                        type: object
                      tags:
                        description: Tags overrides the resource tag names the enhancer
                          reads.
                        properties:
                          name:
                            description: Name label carries the repository name.
                            type: string
                          org:
                            description: Org label carries the repository owner/organization.
                            type: string
                          provider:
                            description: Provider label carries the forge kind (e.g.
                              github).
                            type: string
                          url:
                            description: URL label carries a full repository URL,
                              overriding the parts.
                            type: string
                        type: object
                    required:
                    - enabled
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of configAggregator or resourceExplorer
                        must be set
                      rule: has(self.configAggregator) != has(self.resourceExplorer)
                type: object
              azure:
                description: Azure is the azure provider block.
                properties:
                  resourceTags:
                    description: ResourceTags enables the tag-inventory enhancer.
                    properties:
                      enabled:
                        description: Enabled turns the enhancer capability on.
                        type: boolean
                      managementGroup:
                        description: |-
                          ManagementGroup narrows the query scope to one management group; empty
                          means every subscription the ambient identity can read (the tenant, in
                          practice).
                        type: string
                      repositoryHost:
                        description: |-
                          RepositoryHost is the forge host repositories named by tags live on;
                          empty means github.com.
                        type: string
                      tags:
                        description: Tags overrides the resource tag names the enhancer
                          reads.
                        properties:
                          name:
                            description: Name label carries the repository name.
                            type: string
                          org:
                            description: Org label carries the repository owner/organization.
                            type: string
                          provider:
                            description: Provider label carries the forge kind (e.g.
                              github).
                            type: string
                          url:
                            description: URL label carries a full repository URL,
                              overriding the parts.
                            type: string
                        type: object
                    required:
                    - enabled
                    type: object
                type: object
              backfill:
                description: |-
                  Backfill requests one bounded list-alerts walk of the provider's open
                  alerts, ingesting the ones that predate webhook coverage — alerts
                  raised before the App was installed on (or associated with) their
                  repository, which no replay of the delivery log can ever surface.
                  Ingestion is idempotent, so re-listing alerts that already have
                  findings is safe. Freshness against status.backfill.backfilledAt
                  decides whether the request is still actionable — the controller
                  never clears spec.
                properties:
                  at:
                    description: At is when the request was received.
                    format: date-time
                    type: string
                  by:
                    description: By is the requesting login.
                    type: string
                  repositories:
                    description: |-
                      Repositories narrows the walk to repositories matching any entry: an
                      exact "owner/name", or an "owner/" prefix covering the whole owner.
                      Empty means the credential's full scope. A truncated backfill re-runs
                      with a narrower prefix rather than paging on.
                    items:
                      maxLength: 200
                      minLength: 1
                      type: string
                    maxItems: 50
                    type: array
                required:
                - at
                - by
                type: object
              generic:
                description: Generic is the generic provider block.
                properties:
                  enhance:
                    description: Enhance enables the outbound context enhancer.
                    properties:
                      enabled:
                        description: Enabled turns the enhancer capability on.
                        type: boolean
                      timeout:
                        default: 60s
                        description: Timeout bounds each call.
                        type: string
                      url:
                        description: URL patchy POSTs enhancement requests to.
                        minLength: 1
                        pattern: ^https?://.+$
                        type: string
                    required:
                    - enabled
                    - url
                    type: object
                  source:
                    description: Source enables the inbound findings webhook.
                    properties:
                      enabled:
                        description: Enabled turns the inbound receiver on for this
                          integration.
                        type: boolean
                      minSeverity:
                        default: low
                        description: MinSeverity drops findings below this severity
                          at ingestion.
                        enum:
                        - low
                        - medium
                        - high
                        - critical
                        type: string
                      resolver:
                        description: Resolver enables verdict write-back to the external
                          process.
                        properties:
                          enabled:
                            description: Enabled turns the write-back on.
                            type: boolean
                          timeout:
                            default: 60s
                            description: Timeout bounds each call.
                            type: string
                          url:
                            description: URL patchy POSTs verdicts to.
                            minLength: 1
                            pattern: ^https?://.+$
                            type: string
                        required:
                        - enabled
                        - url
                        type: object
                    required:
                    - enabled
                    type: object
                type: object
              github:
                description: GitHub is the github provider block.
                properties:
                  baseURL:
                    description: |-
                      BaseURL points at a GitHub Enterprise Server host; empty means
                      github.com.
                    type: string
                  codeScanningAlerts:
                    description: CodeScanningAlerts enables scanner ingestion.
                    properties:
                      enabled:
                        description: Enabled turns the code-scanning capability on.
                        type: boolean
                    required:
                    - enabled
                    type: object
                  issues:
                    description: Issues enables the tracking projection.
                    properties:
                      approveComment:
                        default: /approve
                        description: ApproveComment is the comment command that approves
                          a held remediation.
                        type: string
                      enabled:
                        description: Enabled turns the issues capability on.
                        type: boolean
                      fallbackRepository:
                        description: |-
                          FallbackRepository ("owner/repo") receives the tracking issues of
                          findings that have no repository of their own — cloud findings whose
                          resource carries no ownership labels. Without it those findings are
                          visible only through kubectl and the status page. They still cannot be
                          remediated: the issue is a human surface, not a work tree.
                        type: string
                    required:
                    - enabled
                    type: object
                  proxy:
                    description: |-
                      Proxy routes this integration's GitHub traffic through an HTTP/HTTPS
                      forward proxy, overriding the process proxy environment for this
                      integration.
                    properties:
                      url:
                        description: |-
                          URL of the proxy, e.g. "http://proxy.corp.example:3128". Schemes http
                          and https. Credentials must not be embedded in the URL — put them in
                          the credential Secret under "proxyUsername" + "proxyPassword".
                        minLength: 1
                        pattern: ^https?://[^@\s]+$
                        type: string
                    required:
                    - url
                    type: object
                  redelivery:
                    description: Redelivery enables the failed-delivery sweep.
                    properties:
                      enabled:
                        description: |-
                          Enabled turns the sweep on. Requires App credentials — the delivery
                          log is App-scoped, so a PAT integration cannot sweep.
                        type: boolean
                      lookback:
                        default: 24h
                        description: |-
                          Lookback bounds how far back each sweep scans the delivery log.
                          GitHub retains deliveries for 30 days.
                        type: string
                    required:
                    - enabled
                    type: object
                type: object
              googleCloud:
                description: GoogleCloud is the google-cloud provider block.
                properties:
                  cloudAssetInventory:
                    description: CloudAssetInventory enables the ownership-label enhancer.
                    properties:
                      enabled:
                        description: Enabled turns the enhancer capability on.
                        type: boolean
                      labels:
                        description: Labels overrides the resource label names the
                          enhancer reads.
                        properties:
                          name:
                            description: Name label carries the repository name.
                            type: string
                          org:
                            description: Org label carries the repository owner/organization.
                            type: string
                          provider:
                            description: Provider label carries the forge kind (e.g.
                              github).
                            type: string
                          url:
                            description: URL label carries a full repository URL,
                              overriding the parts.
                            type: string
                        type: object
                      repositoryHost:
                        description: |-
                          RepositoryHost is the forge host repositories named by labels live on;
                          empty means github.com.
                        type: string
                      scope:
                        description: 'Scope bounds the asset search: an organization,
                          folder, or project.'
                        pattern: ^(organizations|folders|projects)/.+$
                        type: string
                    required:
                    - enabled
                    - scope
                    type: object
                  securityCommandCenter:
                    description: SecurityCommandCenter enables SCC finding ingestion.
                    properties:
                      audience:
                        description: |-
                          Audience the push subscription's OIDC token must carry, as configured
                          on the subscription's oidcToken.audience.
                        minLength: 1
                        type: string
                      enabled:
                        description: Enabled turns the SCC ingestion capability on.
                        type: boolean
                      minSeverity:
                        default: low
                        description: |-
                          MinSeverity drops notifications below this severity before they become
                          findings. The notification filter should do most of this work; this is
                          the backstop.
                        enum:
                        - low
                        - medium
                        - high
                        - critical
                        type: string
                      mute:
                        description: Mute configures the ignore-verdict write-back
                          (reserved).
                        properties:
                          enabled:
                            description: Enabled turns the mute-on-ignore write-back
                              on.
                            type: boolean
                        required:
                        - enabled
                        type: object
                      organization:
                        description: |-
                          Organization is the numeric Google Cloud organization id, used to
                          compose Console links for findings that carry no externalUri.
                        type: string
                      serviceAccount:
                        description: |-
                          ServiceAccount is the email address the push token must be issued for;
                          a token from any other identity is rejected.
                        minLength: 1
                        type: string
                    required:
                    - audience
                    - enabled
                    - serviceAccount
                    type: object
                type: object
              interval:
                default: 10m
                description: Interval between credential revalidations.
                type: string
              provider:
                description: Provider is the external system type.
                enum:
                - github
                - google-cloud
                - wiz
                - aws
                - azure
                - generic
                type: string
              replay:
                description: |-
                  Replay requests one full redelivery of every webhook delivery in the
                  lookback window, including deliveries that already succeeded (the
                  receiver dedups; ingestion is idempotent). Freshness against
                  status.redelivery.replayedAt decides whether the request is still
                  actionable — the controller never clears spec.
                properties:
                  at:
                    description: At is when the request was received.
                    format: date-time
                    type: string
                  by:
                    description: By is the requesting login.
                    type: string
                required:
                - at
                - by
                type: object
              reset:
                description: |-
                  Reset requests the demo reset (stamped by the status page): the
                  controller permanently deletes every finding's tracking issue,
                  reopens the dismissed findings' code-scanning alerts, deletes every
                  pipeline resource, and drops the receiver's delivery dedup window so
                  redeliveries of already-handled GUIDs are ingested again. Issue
                  deletion requires admin-level repository permission on the
                  credential. Freshness against status.resetAt decides whether the
                  request is still actionable — the controller never clears spec.
                properties:
                  at:
                    description: At is when the request was received.
                    format: date-time
                    type: string
                  by:
                    description: By is the requesting login.
                    type: string
                required:
                - at
                - by
                type: object
              secretRef:
                description: |-
                  SecretRef names the credential Secret. For github: either key "token"
                  (PAT, dev) or keys "appID" + "privateKey" (GitHub App), plus
                  "webhookSecret" for receiver HMAC validation, plus optional keys
                  "proxyUsername" + "proxyPassword" when spec.github.proxy needs basic
                  auth. For wiz: key
                  "webhookToken" (the shared bearer token deliveries carry), plus keys
                  "clientId" + "clientSecret" when spec.wiz.api enables write-back. For
                  generic: key "webhookSecret", the shared HMAC secret signing both
                  inbound deliveries and patchy's outbound resolver/enhancer calls.
                  Required for github, wiz, and generic, optional otherwise — a
                  google-cloud integration holds no credential, since Pub/Sub
                  authenticates itself with a signed OIDC token. It stays permitted for
                  every provider so a future capability that does need one (SCC
                  mute-on-ignore) needs no schema change.
                properties:
                  name:
                    description: Name of the Secret.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              suspend:
                description: Suspend pauses reconciliation of this integration.
                type: boolean
              wiz:
                description: Wiz is the wiz provider block.
                properties:
                  api:
                    description: API enables write-back through the Wiz GraphQL API.
                    properties:
                      endpoint:
                        description: |-
                          Endpoint is the tenant GraphQL endpoint, e.g.
                          https://api.eu1.app.wiz.io/graphql.
                        minLength: 1
                        type: string
                      tokenURL:
                        description: |-
                          TokenURL is the OAuth2 client-credentials token endpoint; empty means
                          https://auth.app.wiz.io/oauth/token.
                        type: string
                    required:
                    - endpoint
                    type: object
                  defend:
                    description: Defend enables Wiz Defend threat-detection ingestion.
                    properties:
                      enabled:
                        description: Enabled turns the Wiz Defend ingestion capability
                          on.
                        type: boolean
                      minSeverity:
                        default: low
                        description: |-
                          MinSeverity drops detections below this severity before they become
                          findings.
                        enum:
                        - low
                        - medium
                        - high
                        - critical
                        type: string
                    required:
                    - enabled
                    type: object
                  issues:
                    description: Issues enables Wiz Issues ingestion.
                    properties:
                      enabled:
                        description: Enabled turns the Wiz Issues ingestion capability
                          on.
                        type: boolean
                      minSeverity:
                        default: low
                        description: |-
                          MinSeverity drops issues below this severity before they become
                          findings. Wiz INFORMATIONAL ranks below low, so the default floor
                          drops it.
                        enum:
                        - low
                        - medium
                        - high
                        - critical
                        type: string
                    required:
                    - enabled
                    type: object
                type: object
            required:
            - provider
            type: object
            x-kubernetes-validations:
            - message: exactly the provider block matching spec.provider must be set
              rule: (self.provider == 'github') == has(self.github) && (self.provider
                == 'google-cloud') == has(self.googleCloud) && (self.provider == 'wiz')
                == has(self.wiz) && (self.provider == 'aws') == has(self.aws) && (self.provider
                == 'azure') == has(self.azure) && (self.provider == 'generic') ==
                has(self.generic)
            - message: spec.secretRef is required for the github, wiz, and generic
                providers
              rule: '!(self.provider in [''github'', ''wiz'', ''generic'']) || has(self.secretRef)'
          status:
            description: IntegrationStatus is the integration's observed state.
            properties:
              backfill:
                description: Backfill reports the last manual alert backfill.
                properties:
                  attemptedAt:
                    description: |-
                      AttemptedAt echoes spec.backfill.at once the controller has attempted
                      that request, whether or not the walk succeeded. Unlike backfilledAt it
                      never gates a retry — it lets observers distinguish a request the
                      controller has not seen yet from one that failed and is being retried.
                    format: date-time
                    type: string
                  backfilledAt:
                    description: |-
                      BackfilledAt echoes spec.backfill.at once that backfill has run; a
                      spec.backfill newer than this triggers another walk.
                    format: date-time
                    type: string
                  error:
                    description: |-
                      Error carries the last backfill failure; empty when the walk
                      succeeded.
                    type: string
                  ingested:
                    description: |-
                      Ingested counts the alerts folded into findings; the rest were
                      filtered out by the repository prefixes or failed individually (see
                      error).
                    format: int32
                    type: integer
                  lastRunAt:
                    description: LastRunAt is when the last backfill walk ran.
                    format: date-time
                    type: string
                  listed:
                    description: Listed counts the open alerts the last walk saw.
                    format: int32
                    type: integer
                  truncated:
                    description: |-
                      Truncated marks a walk that hit the page budget before exhausting the
                      estate; re-request with a narrower repository prefix to cover the
                      rest.
                    type: boolean
                type: object
              conditions:
                description: |-
                  Conditions of the integration (Ready: credential valid, system
                  reachable).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              installations:
                description: Installations summarizes the App installations.
                items:
                  description: |-
                    InstallationSummary counts one GitHub App installation — counts and
                    accounts only, never a repository list (the estate is ~15K repositories).
                  properties:
                    account:
                      description: Account the App is installed on.
                      type: string
                    id:
                      description: ID of the installation.
                      format: int64
                      type: integer
                    repositories:
                      description: Repositories the installation covers.
                      format: int32
                      type: integer
                  required:
                  - account
                  - id
                  type: object
                type: array
              lastEventAt:
                description: LastEventAt is when the receiver last accepted a delivery.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the last spec generation acted
                  on.
                format: int64
                type: integer
              rateLimit:
                description: RateLimit is the last observed API quota.
                properties:
                  remaining:
                    description: Remaining requests in the current window.
                    format: int32
                    type: integer
                  resetAt:
                    description: ResetAt is when the window resets.
                    format: date-time
                    type: string
                required:
                - remaining
                type: object
              redelivery:
                description: Redelivery reports the last failed-delivery sweep.
                properties:
                  error:
                    description: Error carries the last sweep failure; empty when
                      the sweep succeeded.
                    type: string
                  lastSweepAt:
                    description: LastSweepAt is when the last sweep ran.
                    format: date-time
                    type: string
                  redelivered:
                    description: Redelivered counts the redeliveries the last sweep
                      requested.
                    format: int32
                    type: integer
                  replayedAt:
                    description: |-
                      ReplayedAt echoes spec.replay.at once that replay has run; a
                      spec.replay newer than this triggers another full replay.
                    format: date-time
                    type: string
                  scanned:
                    description: Scanned counts the delivery attempts the last sweep
                      inspected.
                    format: int32
                    type: integer
                  truncated:
                    description: |-
                      Truncated marks a sweep that hit the page cap before reaching the
                      lookback horizon; the oldest part of the window went unscanned.
                    type: boolean
                type: object
              resetAt:
                description: |-
                  ResetAt echoes spec.reset.at once the receiver's dedup window has
                  been dropped; a spec.reset newer than this triggers another drop.
                format: date-time
                type: string
              webhookPath:
                description: |-
                  WebhookPath is the receiver path deliveries must target
                  (e.g. /github/webhooks).
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: a generic integration may not use a reserved source id as its name
          rule: self.spec.provider != 'generic' || !has(self.metadata.name) || !(self.metadata.name
            in ['ghas', 'gcp-scc', 'wiz-issues', 'wiz-defend'])
        - message: a generic integration's name must be at most 63 characters
          rule: self.spec.provider != 'generic' || !has(self.metadata.name) || size(self.metadata.name)
            <= 63
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
