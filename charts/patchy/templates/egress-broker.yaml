#
# The egress credential broker, in one file (modeled on status-server.yaml).
# It is the reverse proxy that all claude and codex model traffic goes
# through. It deploys when, and only when, a claude or codex runner is
# enabled. Brokered is the only mode either runner has, so claude or codex ⇒
# broker, and a fake-only dev/e2e render has none of this. Each enabled
# harness adds its provider's route (agent.runners.<harness>.provider).
#
# Agent pods authenticate with an audience-bound projected ServiceAccount
# token. The broker validates it through TokenReview, which is its ONLY
# Kubernetes access (no Secret API reads, no leases, no reconcilers). It then
# injects or signs the model credential on the outbound request. So the model
# credentials live HERE, in the release namespace, and never in the agent
# sandbox.
{{- if include "patchy.brokerEnabled" . }}
{{- $vals := .Values.egressBroker }}
{{- $name := "egress-broker" }}
{{- $claudeOn := include "patchy.harnessEnabled" (dict "root" . "id" "claude") }}
{{- $codexOn := include "patchy.harnessEnabled" (dict "root" . "id" "codex") }}
{{- $provider := .Values.agent.runners.claude.provider | default dict }}
{{- $providerName := "" }}
{{- if $claudeOn }}
{{- $providerName = $provider.name | default "anthropic" }}
{{- if not (has $providerName (list "anthropic" "bedrock" "vertex" "foundry")) }}
{{- fail (printf "agent.runners.claude.provider.name: %q is not one of anthropic, bedrock, vertex, foundry" $providerName) }}
{{- end }}
{{- end }}
{{- $codexProvider := .Values.agent.runners.codex.provider | default dict }}
{{- $codexProviderName := "" }}
{{- if $codexOn }}
{{- $codexProviderName = $codexProvider.name | default "openai" }}
{{- if not (has $codexProviderName (list "openai" "azure")) }}
{{- fail (printf "agent.runners.codex.provider.name: %q is not one of openai, azure" $codexProviderName) }}
{{- end }}
{{- end }}
{{- if $vals.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: {{ include "patchy.serviceAccountName" (dict "root" . "name" $name "vals" $vals) }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" . "extra" $vals.serviceAccount.annotations) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
{{- end }}
---
{{- $data := dict
    "PATCHY_HEALTH_ADDR" ":8081"
    "PATCHY_LISTEN_ADDR" ":8080"
    "PATCHY_LOG_LEVEL" .Values.config.logLevel
    "PATCHY_AGENT_NAMESPACE" .Values.agent.namespace
    "PATCHY_AGENT_SERVICE_ACCOUNT" .Values.agent.serviceAccount
    "PATCHY_TOKEN_AUDIENCE" "patchy-egress-broker"
    "PATCHY_SSE_PING_INTERVAL" $vals.ssePingInterval
}}
{{- if eq $providerName "anthropic" }}
{{- if not (has $vals.anthropicAuth (list "key" "token")) }}
{{- fail (printf "egressBroker.anthropicAuth: %q is not key or token" $vals.anthropicAuth) }}
{{- end }}
{{- $_ := set $data "PATCHY_ANTHROPIC_API_KEY_FILE" "/etc/patchy/anthropic/api-key" }}
{{- $_ := set $data "PATCHY_ANTHROPIC_AUTH" $vals.anthropicAuth }}
{{- else if eq $providerName "bedrock" }}
{{- $_ := set $data "PATCHY_BEDROCK_REGION" (required "agent.runners.claude.provider.region is required for bedrock" $provider.region) }}
{{- else if eq $providerName "vertex" }}
{{- $_ := set $data "PATCHY_VERTEX_REGION" (required "agent.runners.claude.provider.region is required for vertex" $provider.region) }}
{{- else if eq $providerName "foundry" }}
{{- $_ := set $data "PATCHY_FOUNDRY_RESOURCE" (required "agent.runners.claude.provider.resource is required for foundry" $provider.resource) }}
{{- if $vals.foundrySecret }}
{{- $_ := set $data "PATCHY_FOUNDRY_AUTH" "key" }}
{{- $_ := set $data "PATCHY_FOUNDRY_API_KEY_FILE" "/etc/patchy/foundry/api-key" }}
{{- else }}
{{- $_ := set $data "PATCHY_FOUNDRY_AUTH" "entra" }}
{{- end }}
{{- end }}
{{- if eq $codexProviderName "openai" }}
{{- $_ := set $data "PATCHY_OPENAI_API_KEY_FILE" "/etc/patchy/openai/api-key" }}
{{- else if eq $codexProviderName "azure" }}
{{- $_ := set $data "PATCHY_AZURE_RESOURCE" (required "agent.runners.codex.provider.resource is required for azure" $codexProvider.resource) }}
{{- if $vals.azureSecret }}
{{- $_ := set $data "PATCHY_AZURE_AUTH" "key" }}
{{- $_ := set $data "PATCHY_AZURE_API_KEY_FILE" "/etc/patchy/azure/api-key" }}
{{- else }}
{{- $_ := set $data "PATCHY_AZURE_AUTH" "entra" }}
{{- end }}
{{- end }}
{{- range $k, $v := .Values.config.extra }}
{{- $_ := set $data $k $v }}
{{- end }}
{{- range $k, $v := $vals.config.extra }}
{{- $_ := set $data $k $v }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ include "patchy.configMapName" (dict "root" . "name" $name) }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" .) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
data:
    {{- range $k, $v := $data }}
    {{ $k }}: {{ $v | toString | quote }}
    {{- end }}
---
# TokenReview is cluster-scoped, so the one grant needs a ClusterRole.
# Review-only: the broker may ask "whose token is this?" and nothing else. It
# has no Secret access, no writes, and no other resource of any kind.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: {{ include "patchy.fullname" . }}-{{ $name }}-authn
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
rules:
    - apiGroups: [authentication.k8s.io]
      resources: [tokenreviews]
      verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: {{ include "patchy.fullname" . }}-{{ $name }}-authn
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: {{ include "patchy.fullname" . }}-{{ $name }}-authn
subjects:
    - kind: ServiceAccount
      name: {{ include "patchy.serviceAccountName" (dict "root" . "name" $name "vals" $vals) }}
      namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ include "patchy.fullname" . }}-{{ $name }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name "component" "broker") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" .) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            {{- include "patchy.selectorLabels" (dict "root" . "name" $name) | nindent 12 }}
    template:
        metadata:
            labels:
                {{- include "patchy.labels" (dict "root" . "name" $name "component" "broker") | nindent 16 }}
                {{- with $vals.podLabels }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
            {{- with include "patchy.annotations" (dict "root" . "extra" $vals.podAnnotations) }}
            annotations:
                {{- . | nindent 16 }}
            {{- end }}
        spec:
            serviceAccountName: {{ include "patchy.serviceAccountName" (dict "root" . "name" $name "vals" $vals) }}
            {{- with .Values.image.pullSecrets }}
            imagePullSecrets:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                fsGroup: 65532
                fsGroupChangePolicy: Always
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: broker
                  image: {{ include "patchy.image" (dict "root" . "binary" $name "image" $vals.image) }}
                  imagePullPolicy: {{ .Values.image.pullPolicy }}
                  args: ["serve"]
                  envFrom:
                      - configMapRef:
                            name: {{ include "patchy.configMapName" (dict "root" . "name" $name) }}
                  ports:
                      - name: http
                        containerPort: 8080
                        protocol: TCP
                      - name: health
                        containerPort: 8081
                        protocol: TCP
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: health
                      initialDelaySeconds: 5
                      periodSeconds: 20
                  # readyz fails while a configured route's credential source
                  # is unusable. This replaced the job controllers' old
                  # claude-Secret probing.
                  readinessProbe:
                      httpGet:
                          path: /readyz
                          port: health
                      initialDelaySeconds: 2
                      periodSeconds: 10
                  {{- with $vals.resources }}
                  resources:
                      {{- toYaml . | nindent 22 }}
                  {{- end }}
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: ["ALL"]
                      seccompProfile:
                          type: RuntimeDefault
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
                      {{- if eq $providerName "anthropic" }}
                      - name: anthropic
                        mountPath: /etc/patchy/anthropic
                        readOnly: true
                      {{- end }}
                      {{- if and (eq $providerName "foundry") $vals.foundrySecret }}
                      - name: foundry
                        mountPath: /etc/patchy/foundry
                        readOnly: true
                      {{- end }}
                      {{- if eq $codexProviderName "openai" }}
                      - name: openai
                        mountPath: /etc/patchy/openai
                        readOnly: true
                      {{- end }}
                      {{- if and (eq $codexProviderName "azure") $vals.azureSecret }}
                      - name: azure
                        mountPath: /etc/patchy/azure
                        readOnly: true
                      {{- end }}
            {{- with $vals.nodeSelector }}
            nodeSelector:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with $vals.tolerations }}
            tolerations:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with $vals.affinity }}
            affinity:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            volumes:
                - name: tmp
                  emptyDir: {}
                # The model credentials, mounted as files so a rotated Secret
                # takes effect without a restart (the broker reads them on
                # every request).
                {{- if eq $providerName "anthropic" }}
                - name: anthropic
                  secret:
                      secretName: {{ $vals.anthropicSecret }}
                {{- end }}
                {{- if and (eq $providerName "foundry") $vals.foundrySecret }}
                - name: foundry
                  secret:
                      secretName: {{ $vals.foundrySecret }}
                {{- end }}
                {{- if eq $codexProviderName "openai" }}
                - name: openai
                  secret:
                      secretName: {{ $vals.openaiSecret }}
                {{- end }}
                {{- if and (eq $codexProviderName "azure") $vals.azureSecret }}
                - name: azure
                  secret:
                      secretName: {{ $vals.azureSecret }}
                {{- end }}
---
apiVersion: v1
kind: Service
metadata:
    name: {{ include "patchy.fullname" . }}-{{ $name }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" . "extra" $vals.service.annotations) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    type: {{ $vals.service.type }}
    selector:
        {{- include "patchy.selectorLabels" (dict "root" . "name" $name) | nindent 8 }}
    ports:
        - name: http
          port: {{ $vals.service.port }}
          targetPort: http
          protocol: TCP
{{- if $vals.networkPolicy.create }}
---
# Ingress:
#
#   * The proxy port, from the agent namespace only. The broker answers to
#     agent pods and nobody else. (The job controllers' advisory startup
#     probe uses the unauthenticated /readyz on the same port, so they are
#     allowed it too.)
#   * 8081 probes from anywhere (kubelet probes arrive from the node IP).
#
# Egress: DNS, then TCP 443/6443 for the model APIs and the Kubernetes API
# server (TokenReview). extraEgress covers the cloud-identity side channels
# (EKS Pod Identity 169.254.170.23:80, GKE metadata 169.254.169.254:80).
# That works only on CNIs whose ipBlock can reach the node. Under mode
# cilium, the CiliumNetworkPolicy below grants them instead.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: {{ include "patchy.fullname" . }}-{{ $name }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
spec:
    podSelector:
        matchLabels:
            {{- include "patchy.selectorLabels" (dict "root" . "name" $name) | nindent 12 }}
    policyTypes: [Ingress, Egress]
    ingress:
        - from:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: {{ .Values.agent.namespace }}
              - podSelector: {}
          ports:
              - protocol: TCP
                port: 8080
        - ports:
              - protocol: TCP
                port: 8081
    egress:
        - to:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: kube-system
          ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
        - ports:
              - protocol: TCP
                port: 443
              - protocol: TCP
                port: 6443
        {{- with $vals.networkPolicy.extraEgress }}
        # Operator-supplied additions (egressBroker.networkPolicy.extraEgress).
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- if and (eq (include "patchy.egressMode" .) "cilium") (has $providerName (list "bedrock" "vertex")) }}
---
# The broker's SDK calls a cloud-identity credential endpoint: the EKS Pod
# Identity agent (bedrock, 169.254.170.23:80) or the GKE metadata server
# (vertex, 169.254.169.254:80). That endpoint is a hostNetwork process on the
# pod's own node. Cilium classifies traffic to any node-local address as the
# reserved `host` entity. Its CIDR selectors (an ipBlock in the base policy
# above, extraEgress included) never match reserved identities. So under
# Cilium, an ipBlock allow for that address silently matches nothing, and
# the base policy, which enforces egress, drops the credential call.
#
# The host entity is the only way to express this destination. Policies are
# additive, so this policy sits beside the base NetworkPolicy and does not
# replace it. It uses the same egressMode choice as the agent sandbox policy
# (networkpolicy-cilium.yaml). The gke mode needs no equivalent, because
# Dataplane V2 always allows metadata-server traffic.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
    name: {{ include "patchy.fullname" . }}-{{ $name }}-cloud-credentials
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" .) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    endpointSelector:
        matchLabels:
            {{- include "patchy.selectorLabels" (dict "root" . "name" $name) | nindent 12 }}
    egress:
        - toEntities: [host]
          toPorts:
              - ports:
                    - port: "80"
                      protocol: TCP
{{- end }}
{{- end }}
{{- end }}
