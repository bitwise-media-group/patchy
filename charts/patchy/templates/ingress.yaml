#
# The webhook entry point, plain-Ingress flavour (webhook.ingress): one
# Ingress on one hostname, in front of the integration-controller — the only
# component that faces the internet.
#
# One path per provider, because each authenticates differently and nothing
# else is exposed: /github/webhooks validates an HMAC over the raw body
# against the matching Integration's webhookSecret, /google-cloud/webhooks
# validates the OIDC token a Pub/Sub push subscription signs (a push cannot
# compute an HMAC — Pub/Sub composes the message, not the sender), and
# /wiz/webhooks validates the shared bearer token a Wiz automation action
# carries. /generic/ is the one prefix covering many paths — each generic
# Integration listens at /generic/<name>/webhooks, validating an HMAC against
# that Integration's own secret, so the list here stays static however many
# there are. The probes stay off the internet. See docs/deployment/webhook.md.
{{- if .Values.webhook.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: {{ include "patchy.fullname" . }}-webhook
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "integration-controller") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" . "extra" .Values.webhook.ingress.annotations) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    {{- with .Values.webhook.ingress.className }}
    ingressClassName: {{ . }}
    {{- end }}
    {{- with .Values.webhook.ingress.tls }}
    tls:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    rules:
        - host: {{ required "webhook.host is required when webhook.ingress is enabled" .Values.webhook.host | quote }}
          http:
              paths:
                  {{- range $path := list "/github/webhooks" "/google-cloud/webhooks" "/wiz/webhooks" "/generic/" }}
                  - path: {{ $path }}
                    pathType: Prefix
                    backend:
                        service:
                            name: {{ include "patchy.fullname" $ }}-integration-controller
                            port:
                                name: http
                  {{- end }}
{{- end }}
