#
# The webhook entry point, plain Ingress version (webhook.ingress): one
# Ingress on one hostname, in front of the integration-controller. That is the
# only component that faces the internet.
#
# There is one path per provider, because each one authenticates differently
# and nothing else is exposed:
#
#   * /github/webhooks checks an HMAC over the raw body against the matching
#     Integration's webhookSecret.
#   * /google-cloud/webhooks checks the OIDC token a Pub/Sub push
#     subscription signs. A push cannot compute an HMAC, because Pub/Sub
#     composes the message and the sender does not.
#   * /wiz/webhooks checks the shared bearer token a Wiz automation action
#     carries.
#   * /generic/ is the one prefix that covers many paths. Each generic
#     Integration listens at /generic/<name>/webhooks and checks an HMAC
#     against its own secret, so this list stays the same however many
#     there are.
#
# The probes stay off the internet. See docs/deployment/webhook.md.
{{- if .Values.webhook.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: {{ include "patchy.fullname" . }}-webhook
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "integration-controller") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" . "extra" .Values.webhook.ingress.annotations) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    {{- with .Values.webhook.ingress.className }}
    ingressClassName: {{ . }}
    {{- end }}
    {{- with .Values.webhook.ingress.tls }}
    tls:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    rules:
        - host: {{ required "webhook.host is required when webhook.ingress is enabled" .Values.webhook.host | quote }}
          http:
              paths:
                  {{- range $path := list "/github/webhooks" "/google-cloud/webhooks" "/wiz/webhooks" "/generic/" }}
                  - path: {{ $path }}
                    pathType: Prefix
                    backend:
                        service:
                            name: {{ include "patchy.fullname" $ }}-integration-controller
                            port:
                                name: http
                  {{- end }}
{{- end }}
