#
# Defence in depth for the agent sandbox on Istio meshes. This is the same
# egress allowlist as the Cilium component, enforced by the sidecar
# (REGISTRY_ONLY + a ServiceEntry; the proxy matches the client-hello SNI and
# does not terminate TLS). The chart renders one ServiceEntry + Sidecar per
# enabled runner. Each Sidecar's workloadSelector limits it to that harness's
# pods (by the harness label), and its egress lists only that runner's model
# hosts. The brokered runners (claude, codex) get no hosts, because their only
# destination is the egress broker in the release namespace. When this is
# enabled, the chart adds a namespace label that turns on sidecar injection
# (agent.networkPolicy.istio.injectionLabel).
#
# REQUIREMENTS (both are hard requirements):
#
#   * Native sidecars (istiod with ENABLE_NATIVE_SIDECARS=true). Without
#     them, the Job never completes and the init container's artifact fetch
#     is blackholed.
#   * The Istio CNI node agent. The classic istio-init container needs
#     NET_ADMIN, and the restricted PSS rejects it.
#
# Unlike Cilium, the sidecar does not limit which names the pod may RESOLVE.
# See deploy/kustomize/components/istio.
{{- if and .Values.agent.networkPolicy.create (eq (include "patchy.egressMode" .) "istio") }}
{{- $root := . }}
{{- range $id, $r := .Values.agent.runners }}
{{- if $r.enabled }}
{{- if $r.hosts }}
---
# One runner's model API. exportTo: "." keeps the entry private to the agent
# namespace. There is NO forge (GitHub) entry, because the repository arrives
# as a tarball from source-controller's in-cluster artifact server (a
# mesh-registry Service that the Sidecar below already exposes), and the pod
# holds no forge credential.
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
    name: {{ include "patchy.fullname" $root }}-agent-{{ $id }}
    namespace: {{ $root.Values.agent.namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" $root "name" "patchy-agents") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" $root) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    exportTo: ["."]
    hosts:
        {{- range $r.hosts | default list }}
        - {{ . | quote }}
        {{- end }}
    location: MESH_EXTERNAL
    resolution: DNS
    ports:
        - number: 443
          name: tls
          protocol: TLS
{{- end }}
---
# Drop anything outside this harness's part of the registry. The harness can
# see:
#
#   * this runner's model ServiceEntry above (by explicit host). The brokered
#     runners have none, so their egress set has no external hosts at all.
#   * the release namespace's Services. That is how the init container
#     reaches source-controller's artifact server, and how a brokered pod
#     reaches the egress broker.
#
# The workloadSelector limits the Sidecar to this harness's pods, so the
# other runner's ServiceEntry is not reachable.
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
    name: {{ include "patchy.fullname" $root }}-agent-egress-{{ $id }}
    namespace: {{ $root.Values.agent.namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" $root "name" "patchy-agents") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" $root) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    workloadSelector:
        labels:
            {{- include "patchy.agentPodSelector" $root | nindent 12 }}
            patchy.bitwisemedia.uk/harness: {{ $id | quote }}
    outboundTrafficPolicy:
        mode: REGISTRY_ONLY
    egress:
        - hosts:
              {{- range $r.hosts | default list }}
              - ./{{ . }}
              {{- end }}
              - {{ $root.Release.Namespace }}/*
{{- end }}
{{- end }}
---
# The mesh's own traffic, allowed again through the default-deny (one policy
# for all agent pods): egress 15012 to istiod (XDS + workload certs) and
# ingress 15021 (the kubelet probes the proxy's readiness endpoint; probes
# arrive from the node IP, which no pod selector can match).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: {{ include "patchy.fullname" . }}-agents-istio
    namespace: {{ .Values.agent.namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "patchy-agents") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" .) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    podSelector:
        matchLabels:
            {{- include "patchy.agentPodSelector" . | nindent 12 }}
    policyTypes: [Ingress, Egress]
    ingress:
        - ports:
              - protocol: TCP
                port: 15021
    egress:
        - to:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: {{ .Values.agent.networkPolicy.istio.istiodNamespace }}
          ports:
              - protocol: TCP
                port: 15012
{{- end }}
