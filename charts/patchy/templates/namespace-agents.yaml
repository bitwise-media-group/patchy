#
# The agent sandbox. The investigation and remediation controllers (and the
# evaluation controller, when enabled) create short-lived Jobs here at
# runtime (internal/jobs). Nothing here holds a forge credential.
# The per-Job Secret carries only handoff markdown and is garbage-collected
# with its Job. The repository arrives as a tarball from source-controller's
# artifact server, fetched without any credential.
#
# NOTE: helm uninstall deletes this namespace, and with it any agent Job that
# is still running. The controllers run in the release namespace, which the
# chart never manages.
{{- if .Values.agent.createNamespace }}
apiVersion: v1
kind: Namespace
metadata:
    name: {{ .Values.agent.namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "patchy-agents") | nindent 8 }}
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
        {{- if eq (include "patchy.egressMode" .) "istio" }}
        {{ .Values.agent.networkPolicy.istio.injectionLabel }}: {{ .Values.agent.networkPolicy.istio.injectionValue }}
        {{- end }}
    {{- with include "patchy.annotations" (dict "root" .) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
{{- end }}
