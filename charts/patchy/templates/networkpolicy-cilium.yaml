#
# Defence in depth for the agent sandbox on Cilium CNIs: FQDN matching in
# place of the base agent-egress NetworkPolicy and its broad 443 rule. This needs Cilium with
# DNS-based policy enabled (the DNS proxy). The chart renders one policy per
# enabled runner, which selects that harness's pods by their harness label.
# The brokered runners (claude, codex) reach no external host at all, only
# the egress broker. A non-brokered runner reaches only its own model API.
#
# Each runner's pods need two destinations and no others:
#
#   * source-controller's artifact server (in-cluster, port 9790): the init
#     container's tarball fetch, which uses no credential and verifies the
#     digest. No forge host appears in this policy at all, because the pod
#     never talks to GitHub.
#   * the egress broker (brokered runners) or the runner's own model API
#     (agent.runners.<harness>.hosts): used by the agent container's harness
#     CLI.
#
# If your CNI is not Cilium, leave this disabled. The base NetworkPolicy
# still applies as the baseline. See deploy/kustomize/components/cilium.
#
# NOT FOR GKE. Dataplane V2 runs Cilium, but it ignores this CRD and rejects
# every L7 rule. A policy rendered there enforces nothing while it appears to
# work. Use mode `gke` (networkpolicy-gke.yaml) instead. This is why
# `mode: auto` never picks cilium on a GKE cluster. Setting `mode: cilium`
# explicitly is trusted, for a self-managed Cilium on GKE without
# Dataplane V2.
#
# Under this mode the base agent-egress NetworkPolicy is not rendered (see
# networkpolicy.yaml), unless agent.networkPolicy.broadEgress=always keeps it
# while a new mode is soaked. Policies are additive, so its DNS and 443 rules
# would combine with this policy and undo what it restricts. Everything the
# pod needs is below. The namespace default-deny is still the baseline, so a
# missing CRD fails closed.
{{- if and .Values.agent.networkPolicy.create (eq (include "patchy.egressMode" .) "cilium") }}
{{- $root := . }}
{{- $clusterDNS := .Values.agent.networkPolicy.clusterDNSPatterns | default list }}
{{- $brokered := splitList " " (include "patchy.brokeredHarnesses" .) }}
{{- range $id, $r := .Values.agent.runners }}
{{- if $r.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
    name: {{ include "patchy.fullname" $root }}-agent-egress-{{ $id }}
    namespace: {{ $root.Values.agent.namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" $root "name" "patchy-agents") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" $root) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    endpointSelector:
        matchLabels:
            {{- include "patchy.agentPodSelector" $root | nindent 12 }}
            patchy.bitwisemedia.uk/harness: {{ $id | quote }}
    egress:
        # DNS through Cilium's proxy. This is what makes toFQDNs work at all:
        # the proxy watches the answers and programs the resolved IPs into
        # the policy. Only this runner's model host and the cluster-local
        # names (for the artifact fetch) may be resolved.
        - toEndpoints:
              - matchLabels:
                    io.kubernetes.pod.namespace: kube-system
                    k8s-app: kube-dns
          toPorts:
              - ports:
                    - port: "53"
                      protocol: ANY
                rules:
                    dns:
                        {{- range concat ($r.dnsPatterns | default list) $clusterDNS }}
                        - matchPattern: {{ . | quote }}
                        {{- end }}

        # The INIT container's artifact fetch: source-controller's tarball
        # server, in-cluster. The fetch uses no credential and verifies the
        # digest.
        - toEndpoints:
              - matchLabels:
                    io.kubernetes.pod.namespace: {{ $root.Release.Namespace }}
                    app.kubernetes.io/name: source-controller
          toPorts:
              - ports:
                    - port: "9790"
                      protocol: TCP

        {{- if has $id $brokered }}
        # Brokered (claude, codex): the agent container's ONLY destination is
        # the egress credential broker. That is a cluster-local endpoint, so
        # this policy has no toFQDNs at all. The DNS rule above resolves only
        # the cluster-local names (clusterDNSPatterns). No external name
        # resolves from a brokered pod.
        - toEndpoints:
              - matchLabels:
                    io.kubernetes.pod.namespace: {{ $root.Release.Namespace }}
                    app.kubernetes.io/name: egress-broker
          toPorts:
              - ports:
                    - port: "8080"
                      protocol: TCP
        {{- else }}
        # The agent container: this runner's model API and nothing else.
        - toFQDNs:
              {{- range $r.hosts | default list }}
              - matchName: {{ . | quote }}
              {{- end }}
          toPorts:
              - ports:
                    - port: "443"
                      protocol: TCP
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
