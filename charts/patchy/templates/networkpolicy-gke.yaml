#
# Defence in depth for the agent sandbox on GKE Dataplane V2. This is the
# same per-runner hostname allowlist the Cilium component renders, in the
# form GKE enforces. Dataplane V2 runs Cilium underneath. But it has not
# honoured the CiliumNetworkPolicy CRD since 1.21.5-gke.1300 and rejects
# every L7 rule. So `toFQDNs` is not available, and networkpolicy-cilium.yaml
# has no effect there. FQDNNetworkPolicy (networking.gke.io/v1alpha1) does
# the same job: anetd watches the pod's DNS answers and programs the resolved
# addresses, the same trick Cilium's DNS proxy uses.
#
# REQUIREMENTS: the cluster must be created or updated with
# `--enable-fqdn-network-policy` (Dataplane V2 plus kube-dns or Cloud DNS; on
# Standard clusters, restart the anetd DaemonSet afterwards). The CRD exists
# only once that flag is on. That is why `mode: auto` detection is reliable
# here and not a guess.
#
# Two structural differences from the Cilium policy:
#
#   * There is no DNS rule here. FQDNNetworkPolicy is egress-only and cannot
#     name a resolver. The base NetworkPolicy's kube-system DNS rule is what
#     lets the pod resolve names at all, and Dataplane V2 reads those same
#     answers. So agent.networkPolicy.clusterDNSPatterns applies to Cilium
#     only.
#   * There is no artifact-server rule. FQDN policies cannot select a
#     ClusterIP or headless Service, so the base NetworkPolicy grants the
#     init container's tarball fetch. That is why the base policy still
#     renders under this mode (without its broad 443 rule).
#
# Only `hosts` feeds this policy, never dnsPatterns. A `pattern:` match would
# widen the allowlist beyond the model API host itself, and the wildcard only
# matches one label anyway. See deploy/kustomize/components/gke-fqdn.
{{- if and .Values.agent.networkPolicy.create (eq (include "patchy.egressMode" .) "gke") }}
{{- $root := . }}
{{- $brokered := splitList " " (include "patchy.brokeredHarnesses" .) }}
{{- range $id, $r := .Values.agent.runners }}
{{/*
Brokered runners (claude, codex) get NO FQDNNetworkPolicy, because their pods
reach no external hosts at all. The base agents-egress NetworkPolicy (which
still renders under this mode) grants DNS, the artifact server, and the
broker. That is all the egress they have.
*/}}
{{- if and $r.enabled (not (has $id $brokered)) }}
---
apiVersion: networking.gke.io/v1alpha1
kind: FQDNNetworkPolicy
metadata:
    name: {{ include "patchy.fullname" $root }}-agent-egress-{{ $id }}
    namespace: {{ $root.Values.agent.namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" $root "name" "patchy-agents") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" $root) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    podSelector:
        matchLabels:
            {{- include "patchy.agentPodSelector" $root | nindent 12 }}
            patchy.bitwisemedia.uk/harness: {{ $id | quote }}
    egress:
        # This runner's model API and nothing else. No forge host appears in
        # any runner's list, because the pod never talks to GitHub.
        - matches:
              {{- range $r.hosts | default list }}
              - name: {{ . | quote }}
              {{- end }}
          ports:
              - protocol: TCP
                port: 443
{{- end }}
{{- end }}
{{- end }}
