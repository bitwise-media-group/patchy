#
# The base L3/L4 policies. A plain NetworkPolicy cannot match hostnames, so
# the agent egress rule reads "TCP 443 to anywhere outside the cluster". That
# permits api.anthropic.com, and also every other host on 443. Two things
# provide the isolation, in this order:
#
#   1. CREDENTIAL ABSENCE (the main control): the agent pod holds no forge
#      credential AT ALL, not even in the init container. The repository
#      arrives as a digest-verified tarball fetched from source-controller's
#      artifact server over the cluster network.
#   2. Hostname policy (defence in depth): agent.networkPolicy.mode picks the
#      policy type the cluster enforces (cilium, gke for Dataplane V2's
#      FQDNNetworkPolicy, or istio). By default it detects the right one.
#
# When a hostname mode IS active, the chart drops the broad rule below,
# because network policies are additive. Leaving "443 to anywhere" in place
# would combine with the allowlist and make it useless. See
# patchy.broadEgress.
#
# See deploy/kustomize/base/networkpolicy.yaml for the full discussion.
{{- if and .Values.agent.networkPolicy.cilium.enabled .Values.agent.networkPolicy.istio.enabled }}
{{- fail "agent.networkPolicy.cilium and agent.networkPolicy.istio are mutually exclusive: enable at most one" }}
{{- end }}
{{- $mode := include "patchy.egressMode" . }}
{{- $broadEgress := include "patchy.broadEgress" . }}
{{- range $c := list
    (dict "name" "integration-controller" "vals" .Values.integrationController)
    (dict "name" "source-controller" "vals" .Values.sourceController)
    (dict "name" "context-controller" "vals" .Values.contextController)
    (dict "name" "investigation-controller" "vals" .Values.investigationController)
    (dict "name" "remediation-controller" "vals" .Values.remediationController)
}}
{{- if $c.vals.networkPolicy.create }}
---
# ---- {{ $c.name }} ----------------------------------------------------------
# Ingress: 8081 from anywhere (kubelet probes arrive from the node IP, which
# no pod selector can match){{ if eq $c.name "integration-controller" }}, plus 8080 for the provider webhook
# receivers. The ingress controller in front may live in any namespace, and
# the per-Integration HMAC signature check is the authentication. Tighten the
# from: to your ingress namespace if you want L3 on top of the HMAC{{ end }}{{ if eq $c.name "source-controller" }}, plus
# 9790 (the artifact server) from the agent namespace only{{ end }}.
#
# Egress: DNS, then TCP 443/6443 for the Kubernetes API server (every
# controller is a CR controller), the forge API where the controller uses
# one, and any OTLP collector. 6443 covers kind/kubeadm API servers; managed
# clusters usually use 443.{{ if eq $c.name "context-controller" }} The link-local rule is for EKS Pod Identity.
# The SDK's other in-cluster credential path fetches from the node-local
# agent at 169.254.170.23:80 over HTTP (fd00:ec2::23 on IPv6 clusters). The
# rule is harmless elsewhere, because nothing else answers on that address.{{ end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: {{ include "patchy.fullname" $ }}-{{ $c.name }}
    namespace: {{ $.Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" $ "name" $c.name) | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" $) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    podSelector:
        matchLabels:
            {{- include "patchy.selectorLabels" (dict "root" $ "name" $c.name) | nindent 12 }}
    policyTypes: [Ingress, Egress]
    ingress:
        - ports:
              {{- if eq $c.name "integration-controller" }}
              - protocol: TCP
                port: 8080
              {{- end }}
              - protocol: TCP
                port: 8081
        {{- if eq $c.name "source-controller" }}
        - from:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: {{ $.Values.agent.namespace }}
          ports:
              - protocol: TCP
                port: 9790
        {{- if $.Values.evaluationController.enabled }}
        # The internal blob-upload endpoint: only the evaluation controller
        # streams workspace bundles to it.
        - from:
              - podSelector:
                    matchLabels:
                        {{- include "patchy.selectorLabels" (dict "root" $ "name" "evaluation-controller") | nindent 24 }}
          ports:
              - protocol: TCP
                port: 9791
        {{- end }}
        {{- end }}
    egress:
        # DNS.
        - to:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: kube-system
          ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
        # The Kubernetes API server, the forge, an OTLP collector.
        - ports:
              - protocol: TCP
                port: 443
              - protocol: TCP
                port: 6443
        {{- if eq $c.name "context-controller" }}
        # The EKS Pod Identity agent (see the header comment).
        - to:
              - ipBlock:
                    cidr: 169.254.170.23/32
              - ipBlock:
                    cidr: fd00:ec2::23/128
          ports:
              - protocol: TCP
                port: 80
        {{- end }}
        {{- with $c.vals.networkPolicy.extraEgress }}
        # Operator-supplied additions (<controller>.networkPolicy.extraEgress),
        # for example a generic Integration's resolver or enhancer endpoint on
        # a port other than 443, or an egress proxy (.Values.proxy /
        # spec.proxy) listening on 3128/8080. Rendered as written.
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
{{- end }}
{{- if .Values.agent.networkPolicy.create }}
---
# ---- agent namespace: default deny, both directions ------------------------
# Nothing may reach an agent pod. (The job controllers read its output from
# the pod log through the API server and never connect to the pod.) An agent
# pod may reach nothing except what the egress rule below allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: {{ include "patchy.fullname" . }}-agents-default-deny
    namespace: {{ .Values.agent.namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "patchy-agents") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" .) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    podSelector: {}
    policyTypes: [Ingress, Egress]
{{- if or $broadEgress (ne $mode "cilium") }}
---
# This policy allows:
#
#   * DNS;
#   * source-controller's artifact server. This is the init container's
#     tarball fetch, which uses no credential and verifies the digest;
#   * the egress broker, when a brokered runner (claude, codex) is enabled.
#     All of those pods' model traffic goes there;
#   * TCP 443 to external hosts, only while the broad rule applies (see
#     agent.networkPolicy.broadEgress). No runner patchy ships needs it.
#
# Nothing else is allowed. The except: blocks keep an agent away from the API
# server, kubelet, and other workloads. Adjust agent.networkPolicy.clusterCIDRs
# to your cluster's pod/service/node ranges.
#
# Under mode `cilium` this policy is skipped unless broadEgress=always keeps
# it while a new mode is soaked. The CiliumNetworkPolicy already
# grants DNS (through the proxy, which is what makes toFQDNs resolve at all),
# the artifact server, and the model API. A second additive policy that
# granted unproxied DNS beside it would only widen that. Under mode `gke` it
# still renders, because an FQDNNetworkPolicy is egress-only and cannot name a
# resolver or a ClusterIP Service. So DNS and the artifact server must come
# from here. But it renders without the 443 rule, which leaves the
# FQDNNetworkPolicy as the only route out to the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: {{ include "patchy.fullname" . }}-agents-egress
    namespace: {{ .Values.agent.namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "patchy-agents") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" .) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    podSelector:
        matchLabels:
            {{- include "patchy.agentPodSelector" . | nindent 12 }}
    policyTypes: [Egress]
    egress:
        # DNS, so the names below resolve at all.
        - to:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: kube-system
          ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
        # The artifact server.
        - to:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: {{ .Release.Namespace }}
                podSelector:
                    matchLabels:
                        app.kubernetes.io/name: source-controller
          ports:
              - protocol: TCP
                port: 9790
        {{- if include "patchy.brokerEnabled" . }}
        # The egress credential broker: ALL of a claude or codex pod's model
        # traffic goes here. Brokered pods need no other egress at all, not
        # even api.anthropic.com or api.openai.com.
        - to:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: {{ .Release.Namespace }}
                podSelector:
                    matchLabels:
                        app.kubernetes.io/name: egress-broker
          ports:
              - protocol: TCP
                port: 8080
        {{- end }}
        {{- if $broadEgress }}
        # TCP 443 out, cluster-internal ranges excluded.
        - to:
              - ipBlock:
                    cidr: 0.0.0.0/0
                    except:
                        {{- range .Values.agent.networkPolicy.clusterCIDRs }}
                        - {{ . }}
                        {{- end }}
          ports:
              - protocol: TCP
                port: 443
        {{- end }}
{{- end }}
{{- end }}
