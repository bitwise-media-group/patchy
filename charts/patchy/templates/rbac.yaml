#
# All of the chart's RBAC:
#
#   * one Role (+ RoleBinding) per controller in the release namespace,
#     granting the verbs its reconcilers use and no others (this matches
#     deploy/kustomize/base/rbac.yaml);
#   * one shared Role in the agent namespace for the two job controllers.
#
# The rules follow these conventions:
#
#   * The CRs are the state machine. Each field has only one writer. The
#     transition table in DESIGN.md says which controller writes which edge.
#     The verbs here enforce that split at the API layer as far as RBAC can.
#     (RBAC works per resource and cannot restrict single fields.)
#   * secrets get (never list/watch): controllers read provider/forge
#     credentials by name through the API reader when they need them, so no
#     controller can list Secrets.
#   * leases + events: controller-runtime leader election. Deployments stay
#     replicas:1 + Recreate. The lease is insurance against two replicas
#     racing during a bad rollout.
#   * The agent pods have NO role at all. See serviceaccounts.yaml.
{{- define "patchy.roleRules" -}}
{{- if eq . "integration-controller" }}
{{- /*
Turns scanner webhooks into Findings (create/fold/duplicate-merge; it is the
only controller that deletes duplicate Findings). It also projects Findings
to tracking issues (reading the children's reports), and applies human
signals (approve/close/PR-merge) to Finding spec + status.
*/ -}}
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [findings]
  verbs: [create, get, list, watch, update, patch, delete, deletecollection]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [findings/status]
  verbs: [get, update, patch]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [integrations]
  verbs: [get, list, watch]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [integrations/status]
  verbs: [get, update, patch]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [investigations, remediations]
  verbs: [get, list, watch, deletecollection]
{{- /* read-only: the repository-access check reports Forge coverage */}}
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [forges]
  verbs: [get, list, watch]
{{- /* the demo reset (Integration spec.reset) wipes every pipeline resource */}}
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [repositories, findingrollups]
  verbs: [deletecollection]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get]
{{- else if eq . "source-controller" }}
{{- /*
Validates Forge credentials, resolves and pins Repositories, and serves the
artifact tarballs. Writes only Forge/Repository status.
*/ -}}
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [forges, repositories]
  verbs: [get, list, watch]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [forges/status, repositories/status]
  verbs: [get, update, patch]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get]
{{- else if eq . "context-controller" }}
{{- /*
The enhancer chain. It reads Opened findings and writes enrichments/owners
and the Opened -> Enhanced edge to status. For a cloud finding that arrived
without spec.repository, it sets that field once (resolved from the
resource's ownership labels). That is why it holds update on findings as
well as on status. Integrations are read-only: the dynamic enhancers take
their configuration from their Integrations. secrets get (by name, through
the API reader): the generic enhancer signs its outbound calls with its
Integration's webhook secret. The cloud enhancers use workload identity and
hold no secret.
*/ -}}
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [findings]
  verbs: [get, list, watch, update, patch]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [findings/status]
  verbs: [get, update, patch]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [integrations]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get]
{{- else if eq . "investigation-controller" }}
{{- /*
The gate (creates Repository + Investigation, and holds findings that have
no repository) and the analysis scheduler (launches agent Jobs, records
results, and sets the verdict edges on Finding status).
*/ -}}
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [findings]
  verbs: [get, list, watch]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [findings/status]
  verbs: [get, update, patch]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [investigations]
  verbs: [create, get, list, watch, update, patch]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [investigations/status]
  verbs: [get, update, patch]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [repositories]
  verbs: [create, get, list, watch]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [forges]
  verbs: [get, list, watch]
# Read-only: the estimate calibration rendered into the analysis prompt.
# The read is a Get, but it goes through the cached client, whose informer
# needs list/watch.
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [findingrollups]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get]
# The agent transcript each run saves: a ConfigMap owner-referenced to the
# run, so the Finding's TTL cascade removes it. No list/watch, because the
# controller only ever reads it by its own deterministic name.
- apiGroups: [""]
  resources: [configmaps]
  verbs: [create, get, update]
{{- else if eq . "remediation-controller" }}
{{- /*
Queue admission, the remediation scheduler, push/PR, and the rollup/TTL
loop. It is the only controller that deletes expired Findings (the cascade
deletes the children). It needs `update` on findings/investigations/
remediations (as well as on status) to remove the rollup finalizer.
*/ -}}
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [findings]
  verbs: [get, list, watch, update, patch, delete]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [findings/status]
  verbs: [get, update, patch]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [remediations]
  verbs: [create, get, list, watch, update, patch]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [remediations/status]
  verbs: [get, update, patch]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [investigations]
  verbs: [get, list, watch, update, patch]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [investigations/status]
  verbs: [get, update, patch]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [repositories]
  verbs: [get, list, watch]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [findingrollups]
  verbs: [create, get, list, watch, update, patch]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [findingrollups/status]
  verbs: [get, update, patch]
- apiGroups: [patchy.bitwisemedia.uk]
  resources: [forges]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get]
# The agent transcript each run saves: a ConfigMap owner-referenced to the
# run, so the Finding's TTL cascade removes it. No list/watch, because the
# controller only ever reads it by its own deterministic name.
- apiGroups: [""]
  resources: [configmaps]
  verbs: [create, get, update]
{{- end }}
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, create, update]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
{{- if has . (list "investigation-controller" "remediation-controller") }}
# The Warning event an abandoned run archive raises on the run
# (events.k8s.io/v1, the API controller-runtime's recorder writes).
- apiGroups: [events.k8s.io]
  resources: [events]
  verbs: [create, patch]
{{- end }}
{{- end }}
{{- range $c := list
    (dict "name" "integration-controller" "vals" .Values.integrationController)
    (dict "name" "source-controller" "vals" .Values.sourceController)
    (dict "name" "context-controller" "vals" .Values.contextController)
    (dict "name" "investigation-controller" "vals" .Values.investigationController)
    (dict "name" "remediation-controller" "vals" .Values.remediationController)
}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: {{ include "patchy.fullname" $ }}-{{ $c.name }}
    namespace: {{ $.Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" $ "name" $c.name) | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" $) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
rules:
    {{- include "patchy.roleRules" $c.name | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: {{ include "patchy.fullname" $ }}-{{ $c.name }}
    namespace: {{ $.Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" $ "name" $c.name) | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" $) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{ include "patchy.fullname" $ }}-{{ $c.name }}
subjects:
    - kind: ServiceAccount
      name: {{ include "patchy.serviceAccountName" (dict "root" $ "name" $c.name "vals" $c.vals) }}
      namespace: {{ $.Release.Namespace }}
{{- end }}
{{- if .Values.statusServer.enabled }}
---
# ---- integration-controller: TokenReview ------------------------------------
# TokenReview is cluster-scoped, so the one grant needs a ClusterRole. The
# integration-controller uses it on its in-cluster repository-access endpoint
# (:9792) to check the status server's projected ServiceAccount token.
# Review-only: it may ask "whose token is this?" and nothing else. Rendered
# only with the status server, its one caller.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: {{ include "patchy.fullname" . }}-integration-controller-authn
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "integration-controller") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" .) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
rules:
    - apiGroups: [authentication.k8s.io]
      resources: [tokenreviews]
      verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: {{ include "patchy.fullname" . }}-integration-controller-authn
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "integration-controller") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" .) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: {{ include "patchy.fullname" . }}-integration-controller-authn
subjects:
    - kind: ServiceAccount
      name: {{ include "patchy.serviceAccountName" (dict "root" . "name" "integration-controller" "vals" .Values.integrationController) }}
      namespace: {{ .Release.Namespace }}
{{- end }}
---
# ---- agent namespace: the two job controllers -------------------------------
# What internal/jobs uses, and nothing more:
#   jobs      create (Create), get/list/watch (status + orphan reap), delete
#   pods      get/list/watch (find the Job's pod)
#   pods/log  get (read the PATCHY-EVENT: stream at Job completion)
#   secrets   create/get/update/delete (the per-Job Secret carrying the
#             handoff markdown, which holds no credential; update sets its
#             owner reference to its Job, and delete rolls back when the Job
#             create fails)
# No secrets list/watch: each controller only ever reads its own per-Job
# Secret by name. The job-launching controllers share the namespace. The
# patchy.bitwisemedia.uk/kind Job label keeps their watches and reapers out
# of each other's way (RBAC cannot express that split).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: {{ include "patchy.fullname" . }}-agent-jobs
    namespace: {{ .Values.agent.namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "patchy-agents") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" .) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
rules:
    - apiGroups: [batch]
      resources: [jobs]
      verbs: [create, get, list, watch, delete]
    - apiGroups: [""]
      resources: [pods]
      verbs: [get, list, watch]
    - apiGroups: [""]
      resources: [pods/log]
      verbs: [get]
    - apiGroups: [""]
      resources: [secrets]
      verbs: [create, get, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: {{ include "patchy.fullname" . }}-agent-jobs
    namespace: {{ .Values.agent.namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" "patchy-agents") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" .) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{ include "patchy.fullname" . }}-agent-jobs
subjects:
    - kind: ServiceAccount
      name: {{ include "patchy.serviceAccountName" (dict "root" . "name" "investigation-controller" "vals" .Values.investigationController) }}
      namespace: {{ .Release.Namespace }}
    - kind: ServiceAccount
      name: {{ include "patchy.serviceAccountName" (dict "root" . "name" "remediation-controller" "vals" .Values.remediationController) }}
      namespace: {{ .Release.Namespace }}
