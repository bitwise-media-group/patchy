#
# Two Services, because only two components are ever called by anything else:
#
#   * <fullname>-integration-controller:8080: the single internet-facing
#     entry point (the provider webhook receivers, e.g. POST
#     /github/webhooks). `webhook.ingress` or `webhook.httpRoute` sits in
#     front of it.
#   * <fullname>-source-controller:9790: the artifact server. Agent pods
#     fetch SHA-pinned repository tarballs from it (in-cluster only; the
#     NetworkPolicies restrict it to the agent namespace).
#
# The other controllers serve only kubelet probes on :8081. The kubelet hits
# the pod directly, so they need no Service. type NodePort + nodePort covers
# the kind/dev case.
{{- range $c := list
    (dict "name" "integration-controller" "vals" .Values.integrationController "portName" "http")
    (dict "name" "source-controller" "vals" .Values.sourceController "portName" "artifact")
}}
{{- $svc := $c.vals.service }}
---
apiVersion: v1
kind: Service
metadata:
    name: {{ include "patchy.fullname" $ }}-{{ $c.name }}
    namespace: {{ $.Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" $ "name" $c.name) | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" $ "extra" $svc.annotations) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    type: {{ $svc.type }}
    selector:
        {{- include "patchy.selectorLabels" (dict "root" $ "name" $c.name) | nindent 8 }}
    ports:
        - name: {{ $c.portName }}
          port: {{ $svc.port }}
          targetPort: {{ $c.portName }}
          protocol: TCP
          {{- with $svc.nodePort }}
          nodePort: {{ . }}
          {{- end }}
        {{- if and (eq $c.name "source-controller") $.Values.evaluationController.enabled }}
        # The internal workspace-blob endpoint. Only the evaluation
        # controller calls it (a NetworkPolicy enforces this).
        - name: internal
          port: 9791
          targetPort: internal
          protocol: TCP
        {{- end }}
{{- end }}
