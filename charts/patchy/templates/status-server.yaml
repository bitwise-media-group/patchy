#
# The status server, in one file. (The controllers render from shared
# per-kind templates instead.) It is:
#
#   * optional (statusServer.enabled, on by default);
#   * labelled component=server, not controller;
#   * one of the two components with an auth mount and a human-facing
#     exposure (the evaluation controller is the other).
#
# Spreading its guards across six kind files would hide all three facts.
# Matches deploy/kustomize/base/{deployment-status-server,
# rbac,service,networkpolicy}.yaml.
{{- if .Values.statusServer.enabled }}
{{- $vals := .Values.statusServer }}
{{- $name := "status-server" }}
{{- /*
The auth Secret mounted at /etc/patchy/auth. An existing Secret takes
precedence. Inline auth.config renders a chart-managed one. With neither,
the (optional) mount is empty and the server serves nothing until one is
mounted.
*/}}
{{- $authSecret := $vals.auth.existingSecret | default (printf "%s-status-auth" (include "patchy.fullname" .)) }}
{{- if and $vals.auth.existingSecret $vals.auth.config }}
{{- fail "statusServer.auth.existingSecret and statusServer.auth.config are mutually exclusive" }}
{{- end }}
{{- if $vals.auth.config }}
---
apiVersion: v1
kind: Secret
metadata:
    name: {{ $authSecret }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" .) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
type: Opaque
stringData:
    config.yaml: |
        {{- toYaml $vals.auth.config | nindent 8 }}
{{- end }}
{{- if $vals.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: {{ include "patchy.serviceAccountName" (dict "root" . "name" $name "vals" $vals) }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" . "extra" $vals.serviceAccount.annotations) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
{{- end }}
---
{{- $data := dict
    "PATCHY_HEALTH_ADDR" ":8081"
    "PATCHY_LISTEN_ADDR" ":8080"
    "PATCHY_AUTH_CONFIG" "/etc/patchy/auth/config.yaml"
    "PATCHY_AGENT_NAMESPACE" .Values.agent.namespace
    "PATCHY_LOG_LEVEL" .Values.config.logLevel
}}
{{- /*
The "My repositories" access check calls the integration-controller's
internal endpoint. The binary's default URL assumes the kustomize Service
name (patchy-integration-controller in namespace patchy), so the chart sets
the release's own. The token file matches the projected volume below.
*/}}
{{- $_ := set $data "PATCHY_INTEGRATION_CONTROLLER_URL" (printf "http://%s-integration-controller.%s.svc.cluster.local:9792" (include "patchy.fullname" .) .Release.Namespace) }}
{{- $_ := set $data "PATCHY_INTEGRATION_CONTROLLER_TOKEN_FILE" "/var/run/secrets/patchy/integration-controller/token" }}
{{- include "patchy.archiveData" (dict "root" . "data" $data "role" "status-server") }}
{{- range $k, $v := .Values.config.extra }}
{{- $_ := set $data $k $v }}
{{- end }}
{{- range $k, $v := $vals.config.extra }}
{{- $_ := set $data $k $v }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
    name: {{ include "patchy.configMapName" (dict "root" . "name" $name) }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" .) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
data:
    {{- range $k, $v := $data }}
    {{- /* Helm parses every values.yaml number as a float64. toString
           renders a large one in scientific notation ("1.2e+06"), which the
           binaries' strconv.Atoi rejects at startup. So whole-number floats
           are rendered as integers. Real fractions (confidence thresholds)
           pass through unchanged. */ -}}
    {{- $s := $v | toString }}
    {{- if and (kindIs "float64" $v) (eq $v (floor $v)) }}
    {{- $s = int64 $v | toString }}
    {{- end }}
    {{ $k }}: {{ $s | quote }}
    {{- end }}
---
# Reads Findings/FindingRollups for the projection. Writes SPEC only:
#
#   * approve records spec.approval;
#   * retry/expedite record spec.retry / spec.expedite;
#   * suspend/resume toggle spec.suspend;
#   * replay and reset set Integration spec.replay / spec.reset;
#   * backfill creates a BackfillRequest, and an operator's approve or deny
#     records its spec.decision.
#
# NO */status, because the status server never moves a phase. No leases
# either (no reconcilers, no leader election). The delete/deletecollection
# verbs support the reset action (demo tooling), which an access review
# gates. Reset deletes the pipeline state and keeps the configuration.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: {{ include "patchy.fullname" . }}-{{ $name }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings]
      verbs: [get, list, watch, update, patch, delete, deletecollection]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findingrollups]
      verbs: [get, list, watch, delete, deletecollection]
    # Read-only plus reset. The projection reads each run's report markdown
    # from the Investigation/Remediation children (reports live only on the
    # child). repositories are listed only for reset.
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [investigations, remediations, repositories]
      verbs: [get, list, watch, delete, deletecollection]
    # Spec-only write access for the replay and reset actions (spec.replay,
    # spec.reset). The cached client's informer needs list/watch.
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [integrations]
      verbs: [get, list, watch, update, patch]
    # The backfill paths: create files a request, update records an
    # operator's spec.decision, list/watch feed the repositories page, the
    # cooldown and the approval queue. No delete: the integration-controller
    # expires them.
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [backfillrequests]
      verbs: [get, list, watch, create, update]
    # Read-only: the configuration view projects the Forges alongside the
    # Integrations.
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [forges]
      verbs: [get, list, watch]
    # The saved agent transcripts, read one at a time when a human opens a
    # finding. Get only: they are read through the uncached API reader, so
    # there is no informer and no list/watch. Caching every ConfigMap in the
    # namespace to serve these would cost more than it saves.
    - apiGroups: [""]
      resources: [configmaps]
      verbs: [get]
---
{{- if $vals.liveTranscripts }}
# Live transcripts: the status server follows a running agent's pod log
# through the API server to stream its conversation. It never connects to an
# agent pod, so the agents' default-deny ingress policy stays as it is.
# Read-only, and limited to the agents namespace: no Jobs, no Secrets, no
# writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: {{ include "patchy.fullname" . }}-{{ $name }}-agent-logs
    namespace: {{ .Values.agent.namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
rules:
    - apiGroups: [""]
      resources: [pods]
      verbs: [get, list]
    - apiGroups: [""]
      resources: [pods/log]
      verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: {{ include "patchy.fullname" . }}-{{ $name }}-agent-logs
    namespace: {{ .Values.agent.namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{ include "patchy.fullname" . }}-{{ $name }}-agent-logs
subjects:
    - kind: ServiceAccount
      name: {{ include "patchy.serviceAccountName" (dict "root" . "name" $name "vals" $vals) }}
      namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: {{ include "patchy.fullname" . }}-{{ $name }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: {{ include "patchy.fullname" . }}-{{ $name }}
subjects:
    - kind: ServiceAccount
      name: {{ include "patchy.serviceAccountName" (dict "root" . "name" $name "vals" $vals) }}
      namespace: {{ .Release.Namespace }}
---
# SubjectAccessReview is cluster-scoped, so this one grant needs a
# ClusterRole. Review-only: the server may ask "may user U approve
# findings?" but cannot act on the answer itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: {{ include "patchy.fullname" . }}-{{ $name }}-authz
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
rules:
    - apiGroups: [authorization.k8s.io]
      resources: [subjectaccessreviews]
      verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: {{ include "patchy.fullname" . }}-{{ $name }}-authz
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: {{ include "patchy.fullname" . }}-{{ $name }}-authz
subjects:
    - kind: ServiceAccount
      name: {{ include "patchy.serviceAccountName" (dict "root" . "name" $name "vals" $vals) }}
      namespace: {{ .Release.Namespace }}
{{- if $vals.rbac.userRoles }}
---
# Example user-facing grant tiers. You supply the bindings: bind Users to
# the OIDC username claim's values and Groups to the groups claim's values,
# in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: {{ include "patchy.fullname" . }}-findings-viewer
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings, findingrollups]
      verbs: [get, list]
    # Optional: file a backfill request for an operator from the CLI
    # (`patchy backfill --request`; the admission policy keeps it waiting).
    # The status page's request button needs no grant beyond get on findings.
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [backfillrequests]
      verbs: [create, get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: {{ include "patchy.fullname" . }}-findings-approver
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings, findingrollups]
      verbs: [get, list]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings]
      verbs: [approve]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [backfillrequests]
      verbs: [create, get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: {{ include "patchy.fullname" . }}-findings-operator
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings, findingrollups]
      verbs: [get, list]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings]
      verbs: [approve, retry, expedite, suspend, resume]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [backfillrequests]
      verbs: [create, get, list]
---
# Operator, plus the configuration view (native get on integrations),
# backfill (running requests at once and deciding other people's), and the
# user menu's demo tooling: replay the webhook
# delivery log, and reset (delete) all pipeline state. Grant replay/reset
# sparingly. Migration note: replay/reset moved from findings to
# integrations. That is the resource they act on, and the one the
# integrations admission policy checks.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: {{ include "patchy.fullname" . }}-findings-admin
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings, findingrollups]
      verbs: [get, list]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings]
      verbs: [approve, retry, expedite, suspend, resume]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [integrations]
      verbs: [get, list, backfill, replay, reset]
    # The CLI's backfill paths: `patchy backfill` creates a request, `patchy
    # approve|deny backfillrequest` updates its decision. The admission
    # policy checks the backfill verb above for every write.
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [backfillrequests]
      verbs: [create, get, list, watch, update]
---
# A repository maintainer: viewer, plus backfill, approve and expedite on
# the repositories where the user's linked GitHub identity ("Connect GitHub"
# on the status page) is admin or maintain, checked live on every action.
# Only the status page honours the scoped verbs; the CLI and the admission
# policy do not. Bind it to a broad SSO group (a dex groups claim value).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: {{ include "patchy.fullname" . }}-maintainer
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings, findingrollups]
      verbs: [get]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings]
      verbs: [approve-maintained, expedite-maintained]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [integrations]
      verbs: [backfill-maintained]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [backfillrequests]
      verbs: [get, list, watch]
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ include "patchy.fullname" . }}-{{ $name }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name "component" "server") | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" .) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    replicas: 1
    # Rolling, unlike the controllers: the status server runs no reconcilers
    # and holds no leader lease, and sessions live in cookies keyed by the
    # shared OIDC client secret, so either pod can serve any user. The new
    # pod becomes ready before the old one stops.
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
    selector:
        matchLabels:
            {{- include "patchy.selectorLabels" (dict "root" . "name" $name) | nindent 12 }}
    template:
        metadata:
            labels:
                {{- include "patchy.labels" (dict "root" . "name" $name "component" "server") | nindent 16 }}
                {{- with $vals.podLabels }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
            {{- with include "patchy.annotations" (dict "root" . "extra" $vals.podAnnotations) }}
            annotations:
                {{- . | nindent 16 }}
            {{- end }}
        spec:
            serviceAccountName: {{ include "patchy.serviceAccountName" (dict "root" . "name" $name "vals" $vals) }}
            {{- with .Values.image.pullSecrets }}
            imagePullSecrets:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                fsGroup: 65532
                fsGroupChangePolicy: Always
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: server
                  image: {{ include "patchy.image" (dict "root" . "binary" $name "image" $vals.image) }}
                  imagePullPolicy: {{ .Values.image.pullPolicy }}
                  args: ["serve"]
                  envFrom:
                      - configMapRef:
                            name: {{ include "patchy.configMapName" (dict "root" . "name" $name) }}
                  env:
                      - name: POD_NAMESPACE
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.namespace
                  ports:
                      - name: http
                        containerPort: 8080
                        protocol: TCP
                      - name: health
                        containerPort: 8081
                        protocol: TCP
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: health
                      initialDelaySeconds: 5
                      periodSeconds: 20
                  readinessProbe:
                      httpGet:
                          path: /readyz
                          port: health
                      initialDelaySeconds: 2
                      periodSeconds: 10
                  {{- with $vals.resources }}
                  resources:
                      {{- toYaml . | nindent 22 }}
                  {{- end }}
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: ["ALL"]
                      seccompProfile:
                          type: RuntimeDefault
                  volumeMounts:
                      - name: auth
                        mountPath: /etc/patchy/auth
                        readOnly: true
                      - name: tmp
                        mountPath: /tmp
                      - name: integration-controller-token
                        mountPath: /var/run/secrets/patchy/integration-controller
                        readOnly: true
            {{- with $vals.nodeSelector }}
            nodeSelector:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with $vals.tolerations }}
            tolerations:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- with $vals.affinity }}
            affinity:
                {{- toYaml . | nindent 16 }}
            {{- end }}
            volumes:
                # optional: with no auth Secret at all, the server starts
                # but serves no data until one is mounted.
                - name: auth
                  secret:
                      secretName: {{ $authSecret }}
                      optional: true
                - name: tmp
                  emptyDir: {}
                # The "My repositories" access check: a projected token bound
                # to the integration-controller's audience, presented to its
                # internal endpoint (:9792). It identifies this server there
                # and works nowhere else. The kubelet rotates it, and the
                # server reads it again on every call.
                - name: integration-controller-token
                  projected:
                      sources:
                          - serviceAccountToken:
                                audience: patchy-integration-controller
                                expirationSeconds: 3600
                                path: token
---
apiVersion: v1
kind: Service
metadata:
    name: {{ include "patchy.fullname" . }}-{{ $name }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" . "extra" $vals.service.annotations) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    type: {{ $vals.service.type }}
    selector:
        {{- include "patchy.selectorLabels" (dict "root" . "name" $name) | nindent 8 }}
    ports:
        - name: http
          port: {{ $vals.service.port }}
          targetPort: http
          protocol: TCP
          {{- with $vals.service.nodePort }}
          nodePort: {{ . }}
          {{- end }}
{{- if $vals.networkPolicy.create }}
---
# Ingress: 8080 from anywhere, plus 8081 probes. The ingress or gateway in
# front can live in any namespace. Session authentication provides the
# access control; with auth unconfigured the server serves no data. Egress: DNS, the
# Kubernetes API server (cache watches + access reviews), TCP 443 out (the
# OIDC issuer, an OTLP collector), and the integration-controller's
# repository-access endpoint (9792) for the "My repositories" page.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
    name: {{ include "patchy.fullname" . }}-{{ $name }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
spec:
    podSelector:
        matchLabels:
            {{- include "patchy.selectorLabels" (dict "root" . "name" $name) | nindent 12 }}
    policyTypes: [Ingress, Egress]
    ingress:
        - ports:
              - protocol: TCP
                port: 8080
              - protocol: TCP
                port: 8081
    egress:
        - to:
              - namespaceSelector:
                    matchLabels:
                        kubernetes.io/metadata.name: kube-system
          ports:
              - protocol: UDP
                port: 53
              - protocol: TCP
                port: 53
        - ports:
              - protocol: TCP
                port: 443
              - protocol: TCP
                port: 6443
        - to:
              - podSelector:
                    matchLabels:
                        {{- include "patchy.selectorLabels" (dict "root" . "name" "integration-controller") | nindent 24 }}
          ports:
              - protocol: TCP
                port: 9792
        {{- include "patchy.archiveEgress" . | nindent 8 }}
{{- end }}
{{- if $vals.ingress.enabled }}
---
# How the status page is exposed, plain Ingress version. The whole site is
# routed: the SPA shell, /api, /events, and the sign-in routes (/oauth2,
# /logout).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: {{ include "patchy.fullname" . }}-{{ $name }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" . "extra" $vals.ingress.annotations) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    {{- with $vals.ingress.className }}
    ingressClassName: {{ . }}
    {{- end }}
    {{- with $vals.ingress.tls }}
    tls:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    rules:
        - host: {{ required "statusServer.host is required when statusServer.ingress is enabled" $vals.host | quote }}
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: {{ include "patchy.fullname" . }}-{{ $name }}
                            port:
                                name: http
{{- end }}
{{- if $vals.httpRoute.enabled }}
---
# How the status page is exposed, Gateway API version.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: {{ include "patchy.fullname" . }}-{{ $name }}
    namespace: {{ .Release.Namespace }}
    labels:
        {{- include "patchy.labels" (dict "root" . "name" $name) | nindent 8 }}
    {{- with include "patchy.annotations" (dict "root" . "extra" $vals.httpRoute.annotations) }}
    annotations:
        {{- . | nindent 8 }}
    {{- end }}
spec:
    {{- with $vals.httpRoute.parentRefs }}
    parentRefs:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    hostnames:
        - {{ required "statusServer.host is required when statusServer.httpRoute is enabled" $vals.host | quote }}
    rules:
        - matches:
              - path:
                    type: PathPrefix
                    value: /
          backendRefs:
              - name: {{ include "patchy.fullname" . }}-{{ $name }}
                port: {{ $vals.service.port }}
{{- end }}
{{- end }}
