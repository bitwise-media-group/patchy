#
# Field-level authorization for human actions on Findings.
#
# WHY THIS EXISTS
#
# The custom verbs (approve, retry, expedite, suspend, resume) let a grant say
# "this developer may approve findings, and nothing else". The status server can
# honour that on its own because it writes as its own ServiceAccount and asks
# SubjectAccessReview first. The API server authorizes anything that writes as
# the *user* (the patchy CLI, kubectl, curl). RBAC has no notion of a field:
# `update` on findings grants the whole object. Without this policy, granting
# a developer the ability to suspend a finding would also let them rewrite its
# severity, forge an approval, or strip a finalizer.
#
# Admission control is the only server-side mechanism that can express the
# distinction (CRDs get only /status and /scale subresources, and CEL in a CRD
# schema has no authorizer). It runs inside the API server's admission chain,
# so it applies to every client equally. No client can bypass it by not using
# the CLI, and that is why it exists.
#
# WHAT IT ENFORCES
#
# For everyone except the patchy controllers, on UPDATE and CREATE of a Finding:
#   * each human-writable spec field may change only with its own custom verb;
#   * every other spec field must not change at all;
#   * finalizers, ownerReferences and labels must not change.
#
# Status is untouched: findings/status is a distinct resource in RBAC and is not
# matched here, so controller status writes and phase transitions are unaffected.
#
# REQUIRES Kubernetes 1.30+ (ValidatingAdmissionPolicy GA, `authorizer` binding).
# On an older cluster this resource will not apply, and enforcement silently
# falls back to "whoever holds update owns the whole CR". Verify with:
#   kubectl api-resources | grep validatingadmissionpolic
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: patchy-finding-actions
    labels:
        app.kubernetes.io/part-of: patchy
spec:
    # Fail closed: a policy that cannot compile or evaluate must not become an
    # open door.
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            # CREATE is matched alongside UPDATE on purpose. Without it, a
            # user holding create+delete could delete a finding and recreate it
            # with spec.approval already set. That would give them an approval
            # they were never granted. The example roles withhold create/delete
            # too; this is the second lock.
            - apiGroups: [patchy.bitwisemedia.uk]
              apiVersions: [v1alpha1]
              operations: [CREATE, UPDATE]
              resources: [findings]
    matchConditions:
        # The patchy controllers own spec: ingest writes it, accumulation folds
        # alerts into it, and the status server does its own SubjectAccessReview
        # before writing. They are exempt; everyone else is checked.
        - name: not-a-patchy-controller
          expression: >-
              !(request.userInfo.username in [
                'system:serviceaccount:patchy:patchy-integration-controller',
                'system:serviceaccount:patchy:patchy-source-controller',
                'system:serviceaccount:patchy:patchy-context-controller',
                'system:serviceaccount:patchy:patchy-investigation-controller',
                'system:serviceaccount:patchy:patchy-remediation-controller',
                'system:serviceaccount:patchy:patchy-status-server'
              ])
    variables:
        - name: auth
          expression: >-
              authorizer.group('patchy.bitwisemedia.uk').resource('findings')
                .namespace(request.namespace)
        # oldObject is null on CREATE, so every rule below is written as
        # "unchanged from old, OR authorized". On a create that reads as "there
        # is nothing to be unchanged from", which is what makes presetting a
        # field on a fresh object count as changing it.
        - name: old
          expression: "oldObject"
    validations:
        # --- the human-writable fields, each gated by its own verb ------------

        # suspend and resume are opposite directions of one boolean, so which
        # verb is required depends on which way it is being moved.
        - expression: >-
              (variables.old != null && variables.old.spec.?suspend.orValue(false) == object.spec.?suspend.orValue(false))
              || (object.spec.?suspend.orValue(false)
                    ? variables.auth.check('suspend').allowed()
                    : variables.auth.check('resume').allowed())
          messageExpression: >-
              "changing spec.suspend on finding " + object.metadata.name +
              " requires the 'suspend' or 'resume' verb on findings.patchy.bitwisemedia.uk"
          reason: Forbidden

        - expression: >-
              (variables.old != null && variables.old.spec.?approval == object.spec.?approval)
              || variables.auth.check('approve').allowed()
          messageExpression: >-
              "changing spec.approval on finding " + object.metadata.name +
              " requires the 'approve' verb on findings.patchy.bitwisemedia.uk"
          reason: Forbidden

        - expression: >-
              (variables.old != null && variables.old.spec.?retry == object.spec.?retry)
              || variables.auth.check('retry').allowed()
          messageExpression: >-
              "changing spec.retry on finding " + object.metadata.name +
              " requires the 'retry' verb on findings.patchy.bitwisemedia.uk"
          reason: Forbidden

        - expression: >-
              (variables.old != null && variables.old.spec.?expedite == object.spec.?expedite)
              || variables.auth.check('expedite').allowed()
          messageExpression: >-
              "changing spec.expedite on finding " + object.metadata.name +
              " requires the 'expedite' verb on findings.patchy.bitwisemedia.uk"
          reason: Forbidden

        # --- the pipeline owns everything else in spec -----------------------
        #
        # The fields are listed one by one instead of compared as a whole,
        # because users may change the four fields above and spec.related, and
        # CEL cannot subtract keys from a struct. A field added to FindingSpec
        # must be added here too. The codegen drift check will not catch that,
        # so docs/operate/cli.md calls it out.
        #
        # spec.related is left out on purpose. Relationship edges are
        # documented as human-writable (api/v1alpha1/finding_types.go), and
        # carry no authority.
        - expression: >-
              variables.old == null || (
                variables.old.spec.integrationRef == object.spec.integrationRef
                && variables.old.spec.?trackingRef == object.spec.?trackingRef
                && variables.old.spec.source == object.spec.source
                && variables.old.spec.?category == object.spec.?category
                && variables.old.spec.?repository == object.spec.?repository
                && variables.old.spec.?cloudResource == object.spec.?cloudResource
                && variables.old.spec.advisories == object.spec.advisories
                && variables.old.spec.?ruleID == object.spec.?ruleID
                && variables.old.spec.?title == object.spec.?title
                && variables.old.spec.?description == object.spec.?description
                && variables.old.spec.?severity == object.spec.?severity
                && variables.old.spec.?alerts == object.spec.?alerts
                && variables.old.spec.?overflowAlerts == object.spec.?overflowAlerts
              )
          messageExpression: >-
              "finding " + object.metadata.name + " is written by the patchy pipeline; " +
              "only spec.suspend, spec.approval, spec.retry, spec.expedite and spec.related " +
              "may be changed by a user, and each needs its own verb"
          reason: Forbidden

        # --- metadata that carries meaning -----------------------------------
        #
        # These fields matter. The rollup finalizers make sure a finding's
        # spend is aggregated before it is deleted. Accumulation and child
        # lookup key on the selector labels (key-hash, severity, finding).
        # Without this rule, `update` on findings would let a user quietly
        # break either one.
        - expression: >-
              variables.old == null || (
                variables.old.metadata.?finalizers == object.metadata.?finalizers
                && variables.old.metadata.?ownerReferences == object.metadata.?ownerReferences
                && variables.old.metadata.?labels == object.metadata.?labels
              )
          messageExpression: >-
              "finding " + object.metadata.name +
              " has pipeline-owned finalizers, ownerReferences and labels; they may not be edited by hand"
          reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: patchy-finding-actions
    labels:
        app.kubernetes.io/part-of: patchy
spec:
    policyName: patchy-finding-actions
    validationActions: [Deny]
    matchResources:
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: patchy
---
# Field-level authorization for the request stamps on Integrations: the
# replay and reset triggers each need their own custom verb on
# integrations.patchy.bitwisemedia.uk, so `update` on integrations (the
# operator's configuration grant) does not quietly include the ability to
# fire pipeline actions.
#
# This policy differs from the findings policy above in two intended ways:
#   * No frozen-fields rule. IntegrationSpec is operator configuration
#     (provider blocks, secretRef, interval, suspend), and plain `update`
#     must keep working for the GitOps flow. Only the two request fields
#     need a verb.
#   * Clearing a request field needs no verb. A GitOps apply that prunes a
#     stamped spec.replay must not be denied, and cancelling a pending
#     request carries no authority of its own.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: patchy-integration-actions
    labels:
        app.kubernetes.io/part-of: patchy
spec:
    # Fail closed: a policy that cannot compile or evaluate must not become an
    # open door.
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            # CREATE is matched alongside UPDATE for the same reason as
            # findings. Recreating an Integration with a request field preset
            # must not get the action past the verb check.
            - apiGroups: [patchy.bitwisemedia.uk]
              apiVersions: [v1alpha1]
              operations: [CREATE, UPDATE]
              resources: [integrations]
    matchConditions:
        # Same exemption as the findings policy. The status server does its
        # own SubjectAccessReview before stamping a request. The controllers
        # never write Integration spec at all. Exempting them is a safeguard
        # in case a future controller must.
        - name: not-a-patchy-controller
          expression: >-
              !(request.userInfo.username in [
                'system:serviceaccount:patchy:patchy-integration-controller',
                'system:serviceaccount:patchy:patchy-source-controller',
                'system:serviceaccount:patchy:patchy-context-controller',
                'system:serviceaccount:patchy:patchy-investigation-controller',
                'system:serviceaccount:patchy:patchy-remediation-controller',
                'system:serviceaccount:patchy:patchy-status-server'
              ])
    variables:
        - name: auth
          expression: >-
              authorizer.group('patchy.bitwisemedia.uk').resource('integrations')
                .namespace(request.namespace)
        # oldObject is null on CREATE, so each rule reads "absent, OR
        # unchanged from old, OR authorized": presetting a request on a
        # fresh object counts as setting it, while omitting it stays free.
        - name: old
          expression: "oldObject"
    validations:
        - expression: >-
              !has(object.spec.replay)
              || (variables.old != null && variables.old.spec.?replay == object.spec.?replay)
              || variables.auth.check('replay').allowed()
          messageExpression: >-
              "setting spec.replay on integration " + object.metadata.name +
              " requires the 'replay' verb on integrations.patchy.bitwisemedia.uk"
          reason: Forbidden

        - expression: >-
              !has(object.spec.reset)
              || (variables.old != null && variables.old.spec.?reset == object.spec.?reset)
              || variables.auth.check('reset').allowed()
          messageExpression: >-
              "setting spec.reset on integration " + object.metadata.name +
              " requires the 'reset' verb on integrations.patchy.bitwisemedia.uk"
          reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: patchy-integration-actions
    labels:
        app.kubernetes.io/part-of: patchy
spec:
    policyName: patchy-integration-actions
    validationActions: [Deny]
    matchResources:
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: patchy
---
# Authorization for BackfillRequests. A request that runs at once needs the
# backfill verb on integrations. A request filed with spec.via "requested"
# needs no verb: it waits in AwaitingApproval until an operator holding the
# backfill verb sets spec.decision. A "maintained" request can come only from
# the status server, which checked the requester's GitHub role first.
# spec.requestedBy must name the creating user, so the audit trail holds.
# The CRD's own CEL rules keep the request immutable and the decision
# one-time.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
    name: patchy-backfill-requests
    labels:
        app.kubernetes.io/part-of: patchy
spec:
    # Fail closed: a policy that cannot compile or evaluate must not become an
    # open door.
    failurePolicy: Fail
    matchConstraints:
        resourceRules:
            - apiGroups: [patchy.bitwisemedia.uk]
              apiVersions: [v1alpha1]
              operations: [CREATE, UPDATE]
              resources: [backfillrequests]
    matchConditions:
        # The status server runs its own SubjectAccessReviews (and, for a
        # maintained request, the GitHub role check) and records the
        # signed-in user it acted for, so it is exempt like the controllers.
        - name: not-a-patchy-controller
          expression: >-
              !(request.userInfo.username in [
                'system:serviceaccount:patchy:patchy-integration-controller',
                'system:serviceaccount:patchy:patchy-source-controller',
                'system:serviceaccount:patchy:patchy-context-controller',
                'system:serviceaccount:patchy:patchy-investigation-controller',
                'system:serviceaccount:patchy:patchy-remediation-controller',
                'system:serviceaccount:patchy:patchy-status-server'
              ])
    variables:
        # The backfill verb lives on integrations, like every
        # integration-scoped verb, so one grant covers the status page, the
        # CLI and direct writes alike.
        - name: auth
          expression: >-
              authorizer.group('patchy.bitwisemedia.uk').resource('integrations')
                .namespace(request.namespace)
        - name: via
          expression: "object.spec.?via.orValue('backfill')"
        - name: old
          expression: "oldObject"
    validations:
        # The audit field names the real requester.
        - expression: >-
              request.operation != 'CREATE' || object.spec.requestedBy == request.userInfo.username
          messageExpression: >-
              "spec.requestedBy must be your own username (" + request.userInfo.username + ")"
          reason: Forbidden

        # A maintained request rests on a GitHub role check only the status
        # server can make.
        - expression: >-
              request.operation != 'CREATE' || variables.via != 'maintained'
          message: >-
              only the status server can create a maintained backfill request
          reason: Forbidden

        # Filing a request that runs at once needs the backfill verb; a
        # requested one waits for an operator, so anyone allowed to create
        # it may file it.
        - expression: >-
              request.operation != 'CREATE' || variables.via == 'requested'
              || variables.auth.check('backfill').allowed()
          messageExpression: >-
              "creating a backfill request on integration " + object.spec.integrationRef.name +
              " requires the 'backfill' verb on integrations.patchy.bitwisemedia.uk; " +
              "set spec.via to 'requested' to ask an operator instead"
          reason: Forbidden

        # Deciding a requested backfill is an operator's call.
        - expression: >-
              !has(object.spec.decision)
              || (variables.old != null && variables.old.spec.?decision == object.spec.?decision)
              || variables.auth.check('backfill').allowed()
          messageExpression: >-
              "deciding backfill request " + object.metadata.name +
              " requires the 'backfill' verb on integrations.patchy.bitwisemedia.uk"
          reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
    name: patchy-backfill-requests
    labels:
        app.kubernetes.io/part-of: patchy
spec:
    policyName: patchy-backfill-requests
    validationActions: [Deny]
    matchResources:
        namespaceSelector:
            matchLabels:
                kubernetes.io/metadata.name: patchy
