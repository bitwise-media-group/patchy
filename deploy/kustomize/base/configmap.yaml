#
# The one settings surface for every patchy binary, consumed with envFrom.
#
# Every key is a PATCHY_* environment variable, which internal/cli/options.go
# maps back onto a cobra flag: prefix PATCHY, dashes become underscores
# (--claude-agent-image -> PATCHY_CLAUDE_AGENT_IMAGE). Precedence is flag > env > default,
# and the Deployments pass no flags other than the `serve` subcommand, so what
# is here is what runs.
#
# A binary ignores any key it does not bind, which is why one ConfigMap can
# serve them all (PATCHY_ACCUMULATION_WINDOW has no effect in the
# remediation-controller, and so on).
#
# NOT here: GitHub credentials and webhook secrets. Provider and forge
# credentials live in Secrets referenced by the Integration and Forge custom
# resources (spec.secretRef). See crs.example.yaml and secrets.example.yaml.
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: patchy-config
    namespace: patchy
    labels:
        app.kubernetes.io/name: patchy
        app.kubernetes.io/part-of: patchy
data:
    # ---- shared (internal/cli.Options, every binary) ------------------------
    PATCHY_LISTEN_ADDR: ":8080"
    PATCHY_HEALTH_ADDR: ":8081"

    # ---- integration-controller ---------------------------------------------
    # DESIGN.md requirement 2: alerts of one advisory type accumulate into a
    # single finding for an hour.
    PATCHY_ACCUMULATION_WINDOW: 1h
    # Findings projected to tracking issues in parallel; conservative because
    # every projection may spend GitHub API requests.
    PATCHY_PROJECTION_CONCURRENCY: "2"
    # The in-cluster repository-access endpoint (POST
    # /internal/v1/repository-access) the status server's "My repositories"
    # page calls, and the GitHub-user endpoints (/internal/v1/github-user/*)
    # behind its "Connect GitHub" link. It is a second listener, kept off the
    # internet-facing webhook port, and a NetworkPolicy opens it to the
    # status server only.
    # It accepts only a projected token (audience patchy-integration-controller)
    # of the ServiceAccount named by PATCHY_STATUS_SERVER_SERVICE_ACCOUNT
    # (default patchy-status-server), checked with a TokenReview. Unset
    # disables it, so remove this key when the status server is not deployed.
    PATCHY_INTERNAL_ADDR: ":9792"
    # How long a finished (or never-decided) BackfillRequest is kept before
    # the controller deletes it. It must outlast the status server's
    # PATCHY_REPOSITORY_BACKFILL_COOLDOWN, which reads the finished ones.
    # PATCHY_BACKFILL_REQUEST_TTL: 168h

    # ---- status-server ------------------------------------------------------
    # The repository-access check on the "My repositories" page calls the
    # integration-controller's internal endpoint above.
    # PATCHY_INTEGRATION_CONTROLLER_URL defaults to
    # http://patchy-integration-controller.patchy.svc.cluster.local:9792, so it
    # only needs setting when the Service name differs; set it to "" to turn
    # the check off. PATCHY_INTEGRATION_CONTROLLER_TOKEN_FILE defaults to the
    # projected token mounted in deployment-status-server.yaml.
    # How long after a repository's backfill ran that the repositories page
    # refuses another for it (keep it below PATCHY_BACKFILL_REQUEST_TTL).
    # PATCHY_REPOSITORY_BACKFILL_COOLDOWN: 24h

    # ---- source-controller --------------------------------------------------
    # The artifact server: SHA-pinned repository tarballs the agent pods fetch
    # (credential-less; the URL carries a random 128-bit id and the Job pins
    # the sha256 digest). PATCHY_ARTIFACT_BASE_URL defaults to the in-cluster
    # Service address, so it only needs setting when the Service name differs.
    PATCHY_ARTIFACT_ADDR: ":9790"
    PATCHY_ARTIFACT_DIR: /data/artifacts
    # The internal workspace-blob endpoint evaluation-controller streams
    # uploads to (a NetworkPolicy opens it to that one client only). Unset
    # disables it, so remove this key when the evaluation controller is not
    # deployed.
    PATCHY_ARTIFACT_INTERNAL_ADDR: ":9791"
    # Workspace bundles unused for this long are deleted. If a deleted bundle
    # is needed later, it shows up as WorkspaceLost and the client uploads it
    # again.
    PATCHY_WORKSPACE_RETENTION: 168h

    # ---- context-controller -------------------------------------------------
    # PATCHY_STATIC_CONTEXT_FILE: unset in base -> the Noop enhancer (the CMDB
    # placeholder). The dev overlay points it at a mounted YAML file.
    # Findings enhanced in parallel (each finding's chain still runs serially).
    PATCHY_ENHANCE_CONCURRENCY: "4"
    # Concurrent outbound generic enhancer calls across ALL findings ("0"
    # means unbounded).
    PATCHY_ENHANCE_MAX_OUTBOUND: "8"
    # How long the generic enhancer endpoint list and signing secrets are
    # cached; a rotated webhook secret takes effect within this window.
    PATCHY_ENHANCER_CONFIG_TTL: 10s

    # ---- investigation-controller -------------------------------------------
    # DESIGN.md requirement 5: only findings older than an hour are picked up.
    PATCHY_FINDING_MIN_AGE: 1h
    # Findings admitted through the investigation gate in parallel.
    PATCHY_GATE_CONCURRENCY: "4"
    PATCHY_MAX_ATTEMPTS: "2"
    PATCHY_MAX_CONCURRENT_INVESTIGATIONS: "3"
    # DESIGN.md requirement 6: below this, remediation waits for approval.
    PATCHY_CONFIDENCE_THRESHOLD: "0.75"

    # ---- remediation-controller ---------------------------------------------
    PATCHY_MAX_CONCURRENT_REMEDIATIONS: "1"
    # Completed findings are kept this long, then deleted; the FindingRollup
    # objects retain the all-time statistics. "0" keeps findings forever.
    PATCHY_FINDING_TTL: 336h
    # Long-waiting remediations gain +1 effective priority per interval, up to
    # the cap. This stops low-priority findings from waiting forever.
    PATCHY_PRIORITY_AGING_INTERVAL: 24h
    PATCHY_PRIORITY_AGING_CAP: "25"

    # ---- the agent Jobs (both job controllers) ------------------------------
    # The status server reads AGENT_NAMESPACE too, to follow a running agent's
    # pod log for the live transcript.
    PATCHY_AGENT_NAMESPACE: patchy-agents
    PATCHY_AGENT_SERVICE_ACCOUNT: patchy-agent
    # The per-harness runner fleet. A harness is enabled when it is in
    # PATCHY_HARNESSES and its runner image is set. claude and codex go
    # through the egress broker, so no credential Secret is involved (the
    # broker holds the model credential). The model chosen for a stage decides
    # which runner (image + broker route + egress policy) the Job uses. Each
    # runner image is ALSO pinned by the `images:` block in kustomization.yaml
    # for provenance, so overlays must keep the two in step (the `images:`
    # block does not rewrite these ConfigMap values).
    PATCHY_HARNESSES: claude
    PATCHY_CLAUDE_AGENT_IMAGE: ghcr.io/bitwise-media-group/patchy/claude-agent-runner:latest
    # The claude runner is BROKERED. All of its model traffic goes through
    # the egress credential broker (deployment-egress-broker.yaml), and no
    # credential of any kind enters a claude agent pod. The Anthropic key
    # lives with the broker in the patchy namespace (see
    # secrets.example.yaml), never in patchy-agents. So there are no
    # PATCHY_CLAUDE_SECRET* keys anymore; the broker URL and provider
    # selection replace them. The provider is one of
    # anthropic|bedrock|vertex|foundry:
    #   * bedrock needs PATCHY_CLAUDE_PROVIDER_REGION;
    #   * vertex needs that plus PATCHY_CLAUDE_PROVIDER_PROJECT_ID;
    #   * foundry needs a PATCHY_CLAUDE_MODEL_MAP of
    #     canonical-id=deployment-name pairs.
    PATCHY_BROKER_URL: http://patchy-egress-broker.patchy.svc.cluster.local:8080
    PATCHY_CLAUDE_PROVIDER: anthropic
    # Only egress-broker reads these two keys. The first is the mounted
    # Anthropic credential file (it matches the Secret volume in
    # deployment-egress-broker.yaml). The second sets how it authenticates:
    # `key` injects x-api-key (an API key), and `token` sends an
    # Authorization bearer, for a `claude setup-token` OAuth token. A
    # bedrock/vertex/foundry overlay replaces these with the broker's own
    # PATCHY_BEDROCK_REGION / PATCHY_VERTEX_REGION / PATCHY_FOUNDRY_RESOURCE
    # (+ PATCHY_FOUNDRY_AUTH / PATCHY_FOUNDRY_API_KEY_FILE) keys.
    PATCHY_ANTHROPIC_API_KEY_FILE: /etc/patchy/anthropic/api-key
    PATCHY_ANTHROPIC_AUTH: key
    # The codex runner is BROKERED in the same way as claude. No credential
    # enters a codex pod, and its rendered config.toml points the CLI at the
    # broker. The provider is one of openai|azure; azure needs a
    # PATCHY_CODEX_MODEL_MAP of canonical-id=deployment-name pairs. To enable
    # it, make three changes in an overlay:
    #   1. add `codex` to PATCHY_HARNESSES;
    #   2. uncomment PATCHY_OPENAI_API_KEY_FILE below (the broker's openai
    #      route);
    #   3. create the patchy-openai Secret in the patchy namespace (see
    #      secrets.example.yaml).
    # For azure, set PATCHY_AZURE_RESOURCE plus PATCHY_AZURE_AUTH instead
    # (key → PATCHY_AZURE_API_KEY_FILE and a mounted Secret; entra → the
    # broker's workload identity).
    PATCHY_CODEX_AGENT_IMAGE: ghcr.io/bitwise-media-group/patchy/codex-agent-runner:latest
    PATCHY_CODEX_PROVIDER: openai
    # Only egress-broker reads this. It matches the optional patchy-openai
    # volume in deployment-egress-broker.yaml. It stays commented out until
    # codex is enabled, because a configured route whose key file is missing
    # fails the broker's /readyz.
    # PATCHY_OPENAI_API_KEY_FILE: /etc/patchy/openai/api-key
    PATCHY_JOB_DEADLINE: 1h
    PATCHY_JOB_TTL: 1h

    # ---- the agent stages ---------------------------------------------------
    # The job controllers pass these through to every agent pod, where
    # agentrun.FromEnv reads them. Models are canonical, provider-qualified ids
    # (e.g. anthropic/claude-sonnet-5-5); the harness that runs a model is
    # derived from it, so an OpenAI model routes to the codex runner and an
    # Anthropic model to the claude runner.
    #
    # A family alias (anthropic/claude-sonnet, anthropic/claude-opus, ...)
    # resolves at controller startup to the newest version patchy registers.
    # Only that concrete id reaches the pods, the CRDs and the rollups. Pin a
    # concrete id to keep a version across upgrades. A well-formed but
    # unregistered version (anthropic/claude-opus-6) also runs, but only on
    # the claude harness, and with no price until patchy registers it.
    #
    # The INVESTIGATE_* limits are absolute. That stage always runs on these
    # values.
    #
    # The remediation budget is split by who authorized the run:
    #
    #   REMEDIATE_AUTO_* is what patchy will spend on a fix nobody is
    #   watching. Every remediation gets it whatever the investigation
    #   predicted (including when it predicted nothing). It is also the line
    #   past which a fix stops being automatic. An estimate above it holds
    #   the finding in AwaitingApproval instead of queueing it.
    #
    #   REMEDIATE_MANUAL_* is the most a human-approved run may spend.
    #   Approving an estimate above the AUTO values GRANTS that estimate, so
    #   these values cap what one approval can authorize. They must be at or
    #   above the AUTO values, because approving a fix must never buy less
    #   than leaving it alone. The runner refuses to start otherwise.
    #
    # The investigation's own max_turns / token_budget are an ESTIMATE at
    # every level and never a limit, so a low estimate cannot starve a fix.
    # The model suggestion IS still clamped to the allowlist. Every
    # allowlisted model must have an enabled harness that supports it, or the
    # controllers refuse to start.
    #
    # The runner enforces the token budgets. It watches the harness's
    # streamed usage events and kills the process group when the cumulative
    # output-token count is exceeded. The CLI has no such flag itself.
    PATCHY_MODEL_ALLOWLIST: anthropic/claude-sonnet,anthropic/claude-opus

    PATCHY_INVESTIGATE_MODEL: anthropic/claude-sonnet
    PATCHY_INVESTIGATE_TIMEOUT: 15m
    PATCHY_INVESTIGATE_MAX_TURNS: "25"
    PATCHY_INVESTIGATE_TOKEN_BUDGET: "150000"

    PATCHY_REMEDIATE_MODEL: anthropic/claude-sonnet
    PATCHY_REMEDIATE_TIMEOUT: 45m
    PATCHY_REMEDIATE_AUTO_MAX_TURNS: "80"
    PATCHY_REMEDIATE_AUTO_TOKEN_BUDGET: "400000"
    PATCHY_REMEDIATE_MANUAL_MAX_TURNS: "240"
    PATCHY_REMEDIATE_MANUAL_TOKEN_BUDGET: "1200000"

    # ---- run archive (optional; investigation, remediation, status) --------
    # Long-term archival of every agent run (full transcript, full report,
    # the remediation patch and changeset, a sha256 manifest) to an S3 or GCS
    # bucket, one immutable prefix per run attempt. Patchy only creates
    # objects; retention, Object Lock and keys are the bucket's policy. Leave
    # PATCHY_ARCHIVE_PROVIDER unset to keep transcripts in ConfigMaps only.
    # See docs/deployment/archival.md for IAM, CORS, Terraform examples and
    # the NetworkPolicy egress the credential chain needs.
    # PATCHY_ARCHIVE_PROVIDER: s3            # s3 or gcs
    # PATCHY_ARCHIVE_BUCKET: my-audit-bucket
    # PATCHY_ARCHIVE_PREFIX: patchy
    # PATCHY_ARCHIVE_REGION: eu-west-2       # S3 only
    # PATCHY_ARCHIVE_ENDPOINT: ""            # S3-compatible stores
    # PATCHY_ARCHIVE_KMS_KEY: ""             # default: the bucket's encryption
    # PATCHY_ARCHIVE_REQUIRED: "false"       # true fails runs that cannot be archived
    # PATCHY_ARCHIVE_RETRY_WINDOW: 45m       # below PATCHY_JOB_TTL
    # PATCHY_ARCHIVE_PRESIGN_TTL: 5m         # status server's browser URLs

    # ---- evaluation-controller ----------------------------------------------
    # The remote-evaluation engine (optional; only read by
    # evaluation-controller). The evolve-runner images are the counterpart of
    # the agent-runner images above: evolve + the harness CLI, shipped from
    # the evolve repository and pinned by the operator. Both go through the
    # broker and reuse the PATCHY_<HARNESS>_PROVIDER* keys above. There is
    # one broker route per model vendor, whichever fleet uses it.
    PATCHY_MAX_CONCURRENT_UNITS: "4"
    PATCHY_EVALUATION_TTL: 72h
    PATCHY_EVOLVE_CLAUDE_IMAGE: ghcr.io/bitwise-media-group/evolve-runner-claude:latest
    PATCHY_EVOLVE_CODEX_IMAGE: ghcr.io/bitwise-media-group/evolve-runner-codex:latest
    # PATCHY_ARTIFACT_UPLOAD_URL / PATCHY_ARTIFACT_BASE_URL default to the
    # source-controller Service (:9791 / :9790), so they only need setting
    # when the Service name differs.
