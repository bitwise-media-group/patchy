---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: evaluations.patchy.bitwisemedia.uk
spec:
  group: patchy.bitwisemedia.uk
  names:
    categories:
    - patchy
    kind: Evaluation
    listKind: EvaluationList
    plural: evaluations
    shortNames:
    - eval
    singular: evaluation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.submitter
      name: Submitter
      type: string
    - jsonPath: .status.units
      name: Units
      type: integer
    - jsonPath: .status.unitsComplete
      name: Complete
      type: integer
    - jsonPath: .status.unitsFailed
      name: Failed
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Evaluation is one remote evaluation submission: a batch of skill × model ×
          tier units an external client (evolve) uploaded for sandboxed execution.
          One immutable object per submission, owning one EvaluationUnit per unit;
          finished evaluations expire on a TTL.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EvaluationSpec is one submission. It is immutable — resubmission is a new
              Evaluation (CEL-enforced).
            properties:
              submitter:
                description: |-
                  Submitter is the authenticated username the API mapped from the
                  bearer token, recorded for display and audit.
                maxLength: 256
                minLength: 1
                type: string
              ttlSecondsAfterFinished:
                description: |-
                  TTLSecondsAfterFinished overrides the controller's default retention
                  of the finished Evaluation and everything it owns.
                format: int32
                minimum: 0
                type: integer
              units:
                description: Units to run, one child EvaluationUnit each.
                items:
                  description: |-
                    UnitPlan is one evaluation unit: a skill evaluated on one model at one
                    tier. The fields patchy schedules on (harness selection, workspace,
                    timeout) are typed; everything else the in-pod client needs travels opaquely
                    in ExecJSON — patchy never learns evaluation semantics.
                  properties:
                    execJSON:
                      description: |-
                        ExecJSON is the serialized remainder of the client's unit spec (cases
                        allowlist, prior results entry, client version, …), handed to the pod
                        verbatim. Opaque to patchy.
                      maxLength: 131072
                      type: string
                    harnesses:
                      description: |-
                        Harnesses that can run the model, in preference order. A unit whose
                        options are all disabled in the fleet settles as
                        Failed/HarnessUnavailable.
                      items:
                        description: |-
                          HarnessOption is one acceptable harness for a unit, in preference order:
                          the scheduler launches the first option whose harness is enabled in the
                          runner fleet.
                        properties:
                          harness:
                            description: Harness id (e.g. "claude", "codex").
                            maxLength: 64
                            minLength: 1
                            type: string
                          modelID:
                            description: |-
                              ModelID is the harness-native model identifier the unit's model maps to
                              on this harness.
                            maxLength: 256
                            type: string
                        required:
                        - harness
                        type: object
                      maxItems: 8
                      minItems: 1
                      type: array
                    judgeModel:
                      description: |-
                        JudgeModel is the provider-qualified model the in-pod LLM judge runs
                        on; empty for no judge.
                      maxLength: 256
                      type: string
                    maxTurns:
                      description: MaxTurns granted per agent run inside the unit.
                      format: int32
                      minimum: 0
                      type: integer
                    model:
                      description: |-
                        Model is the canonical provider-qualified model id the unit evaluates
                        (e.g. "anthropic/claude-sonnet-5").
                      maxLength: 256
                      minLength: 1
                      type: string
                    runsPerQuery:
                      description: RunsPerQuery repeats each case this many times
                        (tier 1).
                      format: int32
                      minimum: 0
                      type: integer
                    skill:
                      description: Skill under evaluation.
                      maxLength: 256
                      minLength: 1
                      type: string
                    tier:
                      description: 'Tier of the run: 1 = triggers, 2 = evals.'
                      format: int32
                      maximum: 2
                      minimum: 1
                      type: integer
                    timeoutMilliseconds:
                      description: |-
                        TimeoutMilliseconds bounds the unit's wall clock (the Job deadline
                        clamps it controller-side).
                      format: int64
                      minimum: 0
                      type: integer
                    workspace:
                      description: Workspace bundle the unit runs against.
                      properties:
                        digest:
                          description: Digest is the hex sha256 of the gzip tarball.
                          pattern: ^[0-9a-f]{64}$
                          type: string
                        sizeBytes:
                          description: SizeBytes of the tarball, as uploaded.
                          format: int64
                          minimum: 0
                          type: integer
                      required:
                      - digest
                      type: object
                  required:
                  - harnesses
                  - model
                  - skill
                  - tier
                  - workspace
                  type: object
                maxItems: 200
                minItems: 1
                type: array
            required:
            - submitter
            - units
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; submit a new Evaluation
              rule: self == oldSelf
          status:
            description: |-
              EvaluationStatus aggregates the children. Written only by
              evaluation-controller; the phase is derived from unit counts.
            properties:
              completedAt:
                description: CompletedAt is when the last unit settled; the TTL clock
                  starts here.
                format: date-time
                type: string
              conditions:
                description: Conditions of the submission (UnitsCreated, Complete).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the last spec generation acted
                  on.
                format: int64
                type: integer
              phase:
                description: Phase of the submission.
                enum:
                - Pending
                - Running
                - Complete
                - Failed
                type: string
              startedAt:
                description: StartedAt is when the children were created.
                format: date-time
                type: string
              units:
                description: Units is the number of child EvaluationUnits created.
                format: int32
                type: integer
              unitsComplete:
                description: UnitsComplete counts children that settled Complete.
                format: int32
                type: integer
              unitsFailed:
                description: UnitsFailed counts children that settled Failed.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}