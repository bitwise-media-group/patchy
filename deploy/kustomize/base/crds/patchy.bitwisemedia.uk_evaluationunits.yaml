---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: evaluationunits.patchy.bitwisemedia.uk
spec:
  group: patchy.bitwisemedia.uk
  names:
    categories:
    - patchy
    kind: EvaluationUnit
    listKind: EvaluationUnitList
    plural: evaluationunits
    shortNames:
    - evu
    singular: evaluationunit
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.evaluationRef.name
      name: Evaluation
      type: string
    - jsonPath: .spec.unit.skill
      name: Skill
      type: string
    - jsonPath: .spec.unit.tier
      name: Tier
      type: integer
    - jsonPath: .spec.unit.model
      name: Model
      type: string
    - jsonPath: .status.harness
      name: Harness
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.casesPassed
      name: Passed
      priority: 1
      type: integer
    - jsonPath: .status.casesFailed
      name: Failed
      priority: 1
      type: integer
    - jsonPath: .status.usage.costUSD
      name: Cost
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EvaluationUnit is one unit of an Evaluation: a skill evaluated on one
          model at one tier inside a sandboxed agent Job. One immutable object per
          unit, owned by the Evaluation; bounded summaries live here, the full
          result in a per-unit ConfigMap.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EvaluationUnitSpec identifies one unit of its parent Evaluation. It is
              immutable and self-contained — launch never re-reads the parent
              (CEL-enforced).
            properties:
              evaluationRef:
                description: EvaluationRef is the owning Evaluation (UID-pinned).
                properties:
                  name:
                    description: Name of the referent.
                    minLength: 1
                    type: string
                  uid:
                    description: UID of the referent at the time the reference was
                      written.
                    type: string
                required:
                - name
                type: object
              index:
                description: Index of the unit within the submission, 0-based.
                format: int32
                minimum: 0
                type: integer
              unit:
                description: Unit is the plan, copied down from the parent spec.
                properties:
                  execJSON:
                    description: |-
                      ExecJSON is the serialized remainder of the client's unit spec (cases
                      allowlist, prior results entry, client version, …), handed to the pod
                      verbatim. Opaque to patchy.
                    maxLength: 131072
                    type: string
                  harnesses:
                    description: |-
                      Harnesses that can run the model, in preference order. A unit whose
                      options are all disabled in the fleet settles as
                      Failed/HarnessUnavailable.
                    items:
                      description: |-
                        HarnessOption is one acceptable harness for a unit, in preference order:
                        the scheduler launches the first option whose harness is enabled in the
                        runner fleet.
                      properties:
                        harness:
                          description: Harness id (e.g. "claude", "codex").
                          maxLength: 64
                          minLength: 1
                          type: string
                        modelID:
                          description: |-
                            ModelID is the harness-native model identifier the unit's model maps to
                            on this harness.
                          maxLength: 256
                          type: string
                      required:
                      - harness
                      type: object
                    maxItems: 8
                    minItems: 1
                    type: array
                  judgeModel:
                    description: |-
                      JudgeModel is the provider-qualified model the in-pod LLM judge runs
                      on; empty for no judge.
                    maxLength: 256
                    type: string
                  maxTurns:
                    description: MaxTurns granted per agent run inside the unit.
                    format: int32
                    minimum: 0
                    type: integer
                  model:
                    description: |-
                      Model is the canonical provider-qualified model id the unit evaluates
                      (e.g. "anthropic/claude-sonnet-5").
                    maxLength: 256
                    minLength: 1
                    type: string
                  runsPerQuery:
                    description: RunsPerQuery repeats each case this many times (tier
                      1).
                    format: int32
                    minimum: 0
                    type: integer
                  skill:
                    description: Skill under evaluation.
                    maxLength: 256
                    minLength: 1
                    type: string
                  tier:
                    description: 'Tier of the run: 1 = triggers, 2 = evals.'
                    format: int32
                    maximum: 2
                    minimum: 1
                    type: integer
                  timeoutMilliseconds:
                    description: |-
                      TimeoutMilliseconds bounds the unit's wall clock (the Job deadline
                      clamps it controller-side).
                    format: int64
                    minimum: 0
                    type: integer
                  workspace:
                    description: Workspace bundle the unit runs against.
                    properties:
                      digest:
                        description: Digest is the hex sha256 of the gzip tarball.
                        pattern: ^[0-9a-f]{64}$
                        type: string
                      sizeBytes:
                        description: SizeBytes of the tarball, as uploaded.
                        format: int64
                        minimum: 0
                        type: integer
                    required:
                    - digest
                    type: object
                required:
                - harnesses
                - model
                - skill
                - tier
                - workspace
                type: object
            required:
            - evaluationRef
            - index
            - unit
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: |-
              EvaluationUnitStatus records how the unit ran. Written only by
              evaluation-controller.
            properties:
              cases:
                description: |-
                  Cases are the per-case outcomes, bounded; the results ConfigMap holds
                  the full record.
                items:
                  description: |-
                    CaseSummary is one case's pass/fail, compact enough for a status list. The
                    full-fidelity result lives in the results ConfigMap.
                  properties:
                    id:
                      description: ID of the case.
                      maxLength: 128
                      minLength: 1
                      type: string
                    passed:
                      description: Passed reports the graded outcome.
                      type: boolean
                  required:
                  - id
                  - passed
                  type: object
                maxItems: 256
                type: array
              casesErrored:
                description: CasesErrored counts cases that errored before grading.
                format: int32
                type: integer
              casesFailed:
                description: CasesFailed counts cases that failed.
                format: int32
                type: integer
              casesPassed:
                description: CasesPassed counts cases that passed.
                format: int32
                type: integer
              conditions:
                description: Conditions of the run (Complete).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              detail:
                description: Detail explains a failure for humans.
                maxLength: 4096
                type: string
              elapsedMilliseconds:
                description: |-
                  ElapsedMilliseconds is the unit's wall-clock duration as reported by
                  the pod.
                format: int64
                type: integer
              finishedAt:
                description: FinishedAt is when the unit settled.
                format: date-time
                type: string
              harness:
                description: |-
                  Harness the scheduler resolved at launch: the first enabled option
                  from the unit's preference list.
                type: string
              jobRef:
                description: JobRef locates the agent Job in the agents namespace.
                properties:
                  name:
                    description: Name of the Job.
                    type: string
                  namespace:
                    description: Namespace the Job runs in.
                    type: string
                  uid:
                    description: UID of the Job.
                    type: string
                required:
                - name
                - namespace
                type: object
              observedGeneration:
                description: ObservedGeneration is the last spec generation acted
                  on.
                format: int64
                type: integer
              phase:
                description: Phase of the run.
                enum:
                - Pending
                - Running
                - Complete
                - Failed
                type: string
              reason:
                description: Reason a Failed unit failed.
                enum:
                - WorkspaceLost
                - HarnessUnavailable
                - JobFailed
                - Aborted
                - ResultTooLarge
                type: string
              resultsRef:
                description: |-
                  ResultsRef locates the results ConfigMap holding the full-fidelity
                  result entry the client reassembles locally.
                properties:
                  name:
                    description: Name of the ConfigMap holding the turns, in the run's
                      own namespace.
                    type: string
                  truncated:
                    description: |-
                      Truncated reports that recording bounds cut the conversation short, so
                      readers know the record is partial rather than complete.
                    type: boolean
                  turns:
                    description: Turns is how many the transcript holds.
                    format: int32
                    type: integer
                required:
                - name
                type: object
              startedAt:
                description: StartedAt is when the Job launched.
                format: date-time
                type: string
              usage:
                description: Usage accounting for the unit, summed over its agent
                  runs.
                properties:
                  cacheCreationTokens:
                    description: CacheCreationTokens written to prompt cache.
                    format: int64
                    type: integer
                  cacheReadTokens:
                    description: CacheReadTokens read from prompt cache.
                    format: int64
                    type: integer
                  costUSD:
                    description: |-
                      CostUSD is the harness-reported cost as a decimal string (structural
                      schemas forbid floats).
                    pattern: ^[0-9]+(\.[0-9]{1,6})?$
                    type: string
                  inputTokens:
                    description: InputTokens consumed.
                    format: int64
                    type: integer
                  outputTokens:
                    description: OutputTokens produced.
                    format: int64
                    type: integer
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}