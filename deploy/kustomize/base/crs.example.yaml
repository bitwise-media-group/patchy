# EXAMPLE ONLY. Commented out and NOT in kustomization.yaml's resources list.
# After the controllers are running, you switch the pipeline on by applying
# two custom resources:
#   * an Integration (where findings come from and where the tracking issues
#     go);
#   * a Forge (how repositories are cloned and pushed).
# Put your real ones in an environment overlay.
#
# ---------------------------------------------------------------------------
# 1. Integration: the external system patchy exchanges events with.
#
# The integration-controller validates each webhook delivery against this
# object's secret, ingests code- and secret-scanning alerts into Findings, projects
# Findings out as tracking issues, and applies the human signals (the
# approve comment, issue close, PR merge) back onto the Findings.
#
# apiVersion: patchy.bitwisemedia.uk/v1alpha1
# kind: Integration
# metadata:
#     name: github
#     namespace: patchy
# spec:
#     provider: github
#     secretRef:
#         name: patchy-github        # keys: appID+privateKey (or token) + webhookSecret (+ clientSecret)
#     interval: 10m                  # credential revalidation
#     github:
#         # baseURL: https://ghes.example.com/api/v3   # GHES only
#         issues:
#             enabled: true          # tracking projection + human signals
#             approveComment: /approve
#         codeScanningAlerts:
#             enabled: true          # scanner ingestion + alert dismissal
#         # secretScanningAlerts:      # leaked credentials; never carries the
#         #     enabled: true          # value; cleanup PRs only after /approve
#         # userAuthorization:         # the status page's "Connect GitHub" link;
#         #     clientID: Iv23liEXAMPLE  # the App's client ID; clientSecret key in the Secret
#
# ---------------------------------------------------------------------------
# 2. Forge: repository access for clone (source-controller, read) and
#    push + pull request (remediation-controller, write).
#
# Matching: host equality, then the optional orgs allowlist, then the
# optional repository-name regexes; the most-constrained matching Forge wins.
#
# apiVersion: patchy.bitwisemedia.uk/v1alpha1
# kind: Forge
# metadata:
#     name: github
#     namespace: patchy
# spec:
#     provider: github
#     # baseURL: https://ghes.example.com/api/v3       # GHES only
#     secretRef:
#         name: patchy-github        # appID+privateKey or token
#     # orgs: [acme]                 # optional org allowlist
#     # repositories: ["^acme/payments-.*$"]           # optional regexes
#     interval: 10m
#
# ---------------------------------------------------------------------------
# 3. BackfillRequest: one bounded walk of an Integration's open alerts,
#    ingesting the ones that predate webhook coverage. Not configuration:
#    people file these (the status page, or `patchy backfill`), the
#    integration-controller walks them one at a time and deletes finished
#    ones after --backfill-request-ttl (default 168h). Shown here for the
#    shape only; do not keep them in an overlay.
#
# apiVersion: patchy.bitwisemedia.uk/v1alpha1
# kind: BackfillRequest
# metadata:
#     generateName: backfill-
#     namespace: patchy
# spec:
#     integrationRef:
#         name: github
#     requestedBy: dev@example.com   # must be your own username (admission policy)
#     repositories: ["acme/"]        # optional: "owner/" prefixes or exact owner/name
#     # via: requested               # no backfill verb: wait for an operator's spec.decision
