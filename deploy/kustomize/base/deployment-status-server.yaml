---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: patchy-status-server
    namespace: patchy
    labels:
        app: status-server
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: patchy
        # `server`, not `controller`, on purpose: the status server runs no
        # reconcilers and serves humans. The NetworkPolicies select on this.
        app.kubernetes.io/component: server
spec:
    replicas: 1
    # Rolling, unlike the controllers: the status server runs no reconcilers
    # and holds no leader lease, and sessions live in cookies keyed by the
    # shared OIDC client secret, so either pod can serve any user. The new
    # pod becomes ready before the old one stops.
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: status-server
            app.kubernetes.io/part-of: patchy
    template:
        metadata:
            labels:
                app: status-server
                app.kubernetes.io/name: status-server
                app.kubernetes.io/part-of: patchy
                app.kubernetes.io/component: server
        spec:
            serviceAccountName: patchy-status-server
            securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                fsGroup: 65532
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: server
                  # Built from Dockerfile.controller (repo root)
                  # (TARGET=status-server in .goreleaser.yaml).
                  image: ghcr.io/bitwise-media-group/patchy/status-server:latest
                  args: ["serve"]
                  envFrom:
                      - configMapRef:
                            name: patchy-config
                  env:
                      - name: POD_NAMESPACE
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.namespace
                      # The mounted auth configuration. The Secret volume
                      # below is optional. With no Secret the file is absent
                      # and the server serves no data: no findings, no
                      # metrics, no sign-in. Mount a real config (see
                      # secrets.example.yaml) to turn the page on.
                      - name: PATCHY_AUTH_CONFIG
                        value: /etc/patchy/auth/config.yaml
                  ports:
                      - name: http
                        containerPort: 8080
                        protocol: TCP
                      - name: health
                        containerPort: 8081
                        protocol: TCP
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: health
                      initialDelaySeconds: 5
                      periodSeconds: 20
                  readinessProbe:
                      httpGet:
                          path: /readyz
                          port: health
                      initialDelaySeconds: 2
                      periodSeconds: 10
                  resources:
                      requests:
                          cpu: 50m
                          memory: 64Mi
                      limits:
                          cpu: 500m
                          memory: 256Mi
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                          drop: ["ALL"]
                      seccompProfile:
                          type: RuntimeDefault
                  volumeMounts:
                      - name: auth
                        mountPath: /etc/patchy/auth
                        readOnly: true
                      - name: tmp
                        mountPath: /tmp
                      - name: integration-controller-token
                        mountPath: /var/run/secrets/patchy/integration-controller
                        readOnly: true
            volumes:
                # Auth configuration (see secrets.example.yaml). Optional:
                # when absent, the server serves no data.
                - name: auth
                  secret:
                      secretName: patchy-status-auth
                      optional: true
                # The root filesystem is read-only; Go's os.CreateTemp and
                # the HTTP stack want a writable /tmp.
                - name: tmp
                  emptyDir: {}
                # The "My repositories" access check: a projected token bound
                # to the integration-controller's audience, presented to its
                # internal endpoint (:9792). It identifies this server there
                # and works nowhere else. The kubelet rotates it; the server
                # reads it again on every call
                # (PATCHY_INTEGRATION_CONTROLLER_TOKEN_FILE).
                - name: integration-controller-token
                  projected:
                      sources:
                          - serviceAccountToken:
                                audience: patchy-integration-controller
                                expirationSeconds: 3600
                                path: token
