#
# RBAC, in full. One Role (+ RoleBinding) per controller in the patchy
# namespace, verb-by-verb what its reconcilers use, plus one Role in
# patchy-agents shared by the three job-launching controllers
# (investigation, remediation, evaluation).
#
# Conventions the rules encode:
#
#   * The CRs are the state machine. Each field has exactly one writer. The
#     transition table in DESIGN.md says which controller writes which edge.
#     The verbs here enforce that split at the API layer as far as RBAC can.
#     RBAC is per-resource, not per-field, so the reviewable writer table is
#     the finer-grained control.
#   * secrets get (never list/watch): controllers read provider/forge
#     credentials by name, when needed, through the API reader
#     (internal/kube disables the Secret cache). So no controller can
#     enumerate Secrets.
#   * leases + events: controller-runtime leader election. Deployments stay
#     replicas:1 + Recreate. The lease guards against two replicas racing
#     during a bad rollout.
#   * The agent pods (patchy-agents) have NO role at all. See
#     serviceaccount.yaml.
---
# ---- integration-controller ------------------------------------------------
# Ingests scanner webhooks into Findings (create/fold/duplicate-merge; it is
# the only controller that deletes duplicate Findings). Projects Findings to
# tracking issues (reads the children's reports). Applies human signals
# (approve/close/PR-merge) to Finding spec + status. Answers the status
# server's repository-access check (reads Forges; the TokenReview grant is a
# ClusterRole at the end of this file).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: patchy-integration-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: integration-controller
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings]
      verbs: [create, get, list, watch, update, patch, delete, deletecollection]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [integrations]
      verbs: [get, list, watch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [integrations/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [investigations, remediations]
      verbs: [get, list, watch, deletecollection]
    # Read-only: the repository-access check reports whether a Forge covers
    # a repository and can push to it.
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [forges]
      verbs: [get, list, watch]
    # the demo reset (Integration spec.reset) wipes every pipeline resource
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [repositories, findingrollups]
      verbs: [deletecollection]
    - apiGroups: [""]
      resources: [secrets]
      verbs: [get]
    - apiGroups: [coordination.k8s.io]
      resources: [leases]
      verbs: [get, create, update]
    - apiGroups: [""]
      resources: [events]
      verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: patchy-integration-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: integration-controller
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: patchy-integration-controller
subjects:
    - kind: ServiceAccount
      name: patchy-integration-controller
      namespace: patchy
---
# ---- source-controller -----------------------------------------------------
# Validates Forge credentials, resolves + pins Repositories, serves the
# artifact tarballs. Writes only Forge/Repository status.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: patchy-source-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: source-controller
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [forges, repositories]
      verbs: [get, list, watch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [forges/status, repositories/status]
      verbs: [get, update, patch]
    - apiGroups: [""]
      resources: [secrets]
      verbs: [get]
    - apiGroups: [coordination.k8s.io]
      resources: [leases]
      verbs: [get, create, update]
    - apiGroups: [""]
      resources: [events]
      verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: patchy-source-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: source-controller
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: patchy-source-controller
subjects:
    - kind: ServiceAccount
      name: patchy-source-controller
      namespace: patchy
---
# ---- context-controller ----------------------------------------------------
# The enhancer chain. It reads Opened findings and writes enrichments/owners
# and the Opened→Enhanced edge to status. It also sets spec.repository once
# for a cloud finding that arrived without one (resolved from the resource's
# ownership labels). That is why it holds update on findings, not status
# alone. Integrations are read-only, because the dynamic enhancers take
# their configuration from their Integrations. secrets get (by name, through
# the API reader): the generic enhancer signs its outbound calls with its
# Integration's webhook secret. The cloud enhancers still use workload
# identity and hold no secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: patchy-context-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: context-controller
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings]
      verbs: [get, list, watch, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [integrations]
      verbs: [get, list, watch]
    - apiGroups: [""]
      resources: [secrets]
      verbs: [get]
    - apiGroups: [coordination.k8s.io]
      resources: [leases]
      verbs: [get, create, update]
    - apiGroups: [""]
      resources: [events]
      verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: patchy-context-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: context-controller
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: patchy-context-controller
subjects:
    - kind: ServiceAccount
      name: patchy-context-controller
      namespace: patchy
---
# ---- investigation-controller ----------------------------------------------
# The gate (creates Repository + Investigation, parks repo-less findings) and
# the analysis scheduler (launches agent Jobs, stamps results, routes the
# verdict edges on Finding status).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: patchy-investigation-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: investigation-controller
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings]
      verbs: [get, list, watch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [investigations]
      verbs: [create, get, list, watch, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [investigations/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [repositories]
      verbs: [create, get, list, watch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [forges]
      verbs: [get, list, watch]
    # Read-only: the estimate calibration rendered into the analysis prompt.
    # The read is a Get, but it goes through the cached client, whose informer
    # needs list/watch.
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findingrollups]
      verbs: [get, list, watch]
    - apiGroups: [""]
      resources: [secrets]
      verbs: [get]
    # The agent transcript each run persists. It is a ConfigMap
    # owner-referenced to the run, so the Finding's TTL cascade removes it.
    # No list/watch, because it is only ever addressed by its own
    # deterministic name.
    - apiGroups: [""]
      resources: [configmaps]
      verbs: [create, get, update]
    - apiGroups: [coordination.k8s.io]
      resources: [leases]
      verbs: [get, create, update]
    - apiGroups: [""]
      resources: [events]
      verbs: [create, patch]
    # The Warning event an abandoned run archive raises on the run
    # (events.k8s.io/v1, the API controller-runtime's recorder writes).
    - apiGroups: [events.k8s.io]
      resources: [events]
      verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: patchy-investigation-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: investigation-controller
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: patchy-investigation-controller
subjects:
    - kind: ServiceAccount
      name: patchy-investigation-controller
      namespace: patchy
---
# ---- remediation-controller ------------------------------------------------
# Queue admission + the remediation scheduler + push/PR, and the rollup/TTL
# loop. It is the only controller that deletes expired Findings (the cascade
# deletes the children). It needs `update` on
# findings/investigations/remediations (not only status) to remove the rollup
# finalizer.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: patchy-remediation-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: remediation-controller
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings]
      verbs: [get, list, watch, update, patch, delete]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [remediations]
      verbs: [create, get, list, watch, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [remediations/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [investigations]
      verbs: [get, list, watch, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [investigations/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [repositories]
      verbs: [get, list, watch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findingrollups]
      verbs: [create, get, list, watch, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findingrollups/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [forges]
      verbs: [get, list, watch]
    - apiGroups: [""]
      resources: [secrets]
      verbs: [get]
    # The agent transcript each run persists. It is a ConfigMap
    # owner-referenced to the run, so the Finding's TTL cascade removes it.
    # No list/watch, because it is only ever addressed by its own
    # deterministic name.
    - apiGroups: [""]
      resources: [configmaps]
      verbs: [create, get, update]
    - apiGroups: [coordination.k8s.io]
      resources: [leases]
      verbs: [get, create, update]
    - apiGroups: [""]
      resources: [events]
      verbs: [create, patch]
    # The Warning event an abandoned run archive raises on the run
    # (events.k8s.io/v1, the API controller-runtime's recorder writes).
    - apiGroups: [events.k8s.io]
      resources: [events]
      verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: patchy-remediation-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: remediation-controller
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: patchy-remediation-controller
subjects:
    - kind: ServiceAccount
      name: patchy-remediation-controller
      namespace: patchy
---
# ---- status-server ----------------------------------------------------------
# The status page backend. It reads Findings/FindingRollups for the
# projection and writes SPEC only: spec.approval, spec.retry, spec.expedite
# and spec.suspend on Findings, and spec.backfill, spec.replay and spec.reset
# on Integrations. It has no */status access. The status server never moves a phase (each edge
# in the transition table keeps a single writer), and RBAC enforces that at
# the API layer. The delete/deletecollection verbs support the
# access-review-gated reset action (demo tooling). Reset wipes the pipeline
# state and keeps the configuration (Integrations, Forges). No leases (no
# reconcilers, no leader election), no secrets (the auth config is a mounted
# volume).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: patchy-status-server
    namespace: patchy
    labels:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings]
      verbs: [get, list, watch, update, patch, delete, deletecollection]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findingrollups]
      verbs: [get, list, watch, delete, deletecollection]
    # Read-only plus reset: the projection lifts each run's report markdown
    # from the Investigation/Remediation children (reports live on the child
    # only); repositories exist for reset alone.
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [investigations, remediations, repositories]
      verbs: [get, list, watch, delete, deletecollection]
    # Spec-only write path for the replay and backfill actions (spec.replay,
    # spec.backfill). The cached client's informer needs list/watch.
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [integrations]
      verbs: [get, list, watch, update, patch]
    # Read-only: the configuration view projects the Forges alongside the
    # Integrations.
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [forges]
      verbs: [get, list, watch]
    # The persisted agent transcripts, read one at a time when a human opens a
    # finding. Get only: they go through the uncached API reader, so there is
    # no informer and no list/watch. Caching every ConfigMap in the namespace
    # to serve these would cost more than it saves.
    - apiGroups: [""]
      resources: [configmaps]
      verbs: [get]
---
# Live transcripts: the status server follows a running agent's pod log to
# stream its conversation into the investigation/remediation tabs. The read
# goes through the API server. It never dials an agent pod, so the agents'
# default-deny ingress policy is untouched. Read-only and scoped to the agents
# namespace: no Jobs, no Secrets, no writes. Drop this Role and its binding to
# serve only the transcripts of completed runs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: patchy-status-server-agent-logs
    namespace: patchy-agents
    labels:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [""]
      resources: [pods]
      verbs: [get, list]
    - apiGroups: [""]
      resources: [pods/log]
      verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: patchy-status-server-agent-logs
    namespace: patchy-agents
    labels:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: patchy-status-server-agent-logs
subjects:
    - kind: ServiceAccount
      name: patchy-status-server
      namespace: patchy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: patchy-status-server
    namespace: patchy
    labels:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: patchy-status-server
subjects:
    - kind: ServiceAccount
      name: patchy-status-server
      namespace: patchy
---
# SubjectAccessReview is a cluster-scoped, create-only API, so a namespaced
# Role cannot grant it. The status server uses it to answer "may user U
# <verb> <resource> in patchy?" for the signed-in user. That covers the
# custom verbs on findings (approve, retry, expedite, suspend, resume) and on
# integrations (backfill, replay, reset), and the native get that gates
# viewing (see rbac.users.example.yaml for the grant grammar). Review-only: this grants no power to act, only to
# ask.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: patchy-status-server-authz
    labels:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [authorization.k8s.io]
      resources: [subjectaccessreviews]
      verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: patchy-status-server-authz
    labels:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: patchy-status-server-authz
subjects:
    - kind: ServiceAccount
      name: patchy-status-server
      namespace: patchy
---
# ---- evaluation-controller ---------------------------------------------------
# The remote-evaluation engine:
#   * the HTTP API creates Evaluations (submissions) and deletes them
#     (cancel);
#   * the gate creates EvaluationUnit children;
#   * the scheduler stamps unit statuses and rolls the parent up;
#   * the TTL loop deletes expired Evaluations (cascade).
# It needs `update` on evaluationunits (not only status) to remove the jobs
# finalizer. configmaps create/get/update: the per-unit results objects,
# owner-referenced to their unit, only ever addressed by deterministic name
# (plus get for the API's snapshot lift). No secrets in this namespace,
# because the auth config is a mounted volume.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: patchy-evaluation-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: evaluation-controller
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [evaluations]
      verbs: [create, get, list, watch, delete]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [evaluations/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [evaluationunits]
      verbs: [create, get, list, watch, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [evaluationunits/status]
      verbs: [get, update, patch]
    - apiGroups: [""]
      resources: [configmaps]
      verbs: [create, get, update]
    - apiGroups: [coordination.k8s.io]
      resources: [leases]
      verbs: [get, create, update]
    - apiGroups: [""]
      resources: [events]
      verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: patchy-evaluation-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: evaluation-controller
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: patchy-evaluation-controller
subjects:
    - kind: ServiceAccount
      name: patchy-evaluation-controller
      namespace: patchy
---
# SubjectAccessReview for the evaluation API: "may user U create/get/delete
# evaluations in patchy?" RBAC bindings on the evaluations resource authorize
# the bearer-authenticated submitters (see rbac.users.example.yaml), with
# native verbs only. Review-only, same as the status server's.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: patchy-evaluation-controller-authz
    labels:
        app.kubernetes.io/name: evaluation-controller
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [authorization.k8s.io]
      resources: [subjectaccessreviews]
      verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: patchy-evaluation-controller-authz
    labels:
        app.kubernetes.io/name: evaluation-controller
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: patchy-evaluation-controller-authz
subjects:
    - kind: ServiceAccount
      name: patchy-evaluation-controller
      namespace: patchy
---
# ---- patchy-agents: the job-launching controllers ---------------------------
# What internal/jobs uses, and nothing more:
#   jobs      create (Create), get/list/watch (status + orphan reap), delete
#   pods      get/list/watch (find the Job's pod)
#   pods/log  get (read the PATCHY-EVENT: stream at Job completion)
#   secrets   create/get/update/delete (the per-Job Secret carrying the
#             handoff markdown, with no credentials in it; update
#             owner-references it to its Job, delete rolls it back when
#             creating the Job fails)
# No secrets list/watch: each controller only ever addresses its own per-Job
# Secret by name. The investigation, remediation and evaluation controllers
# share the namespace; the
# patchy.bitwisemedia.uk/kind Job label keeps their watches and reapers out
# of each other's way (RBAC cannot express that split).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: patchy-agent-jobs
    namespace: patchy-agents
    labels:
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [batch]
      resources: [jobs]
      verbs: [create, get, list, watch, delete]
    - apiGroups: [""]
      resources: [pods]
      verbs: [get, list, watch]
    - apiGroups: [""]
      resources: [pods/log]
      verbs: [get]
    - apiGroups: [""]
      resources: [secrets]
      verbs: [create, get, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: patchy-agent-jobs
    namespace: patchy-agents
    labels:
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: patchy-agent-jobs
subjects:
    - kind: ServiceAccount
      name: patchy-investigation-controller
      namespace: patchy
    - kind: ServiceAccount
      name: patchy-remediation-controller
      namespace: patchy
    # The evaluation scheduler launches its Jobs through the same machinery;
    # the kind label keeps its watches and reapers off the finding runs.
    - kind: ServiceAccount
      name: patchy-evaluation-controller
      namespace: patchy
---
# ---- egress-broker ----------------------------------------------------------
# TokenReview is a cluster-scoped, create-only API, so a namespaced Role
# cannot grant it. The broker uses it to validate each caller's projected
# ServiceAccount token before any byte is proxied. Review-only. This is the
# broker's ONLY Kubernetes access of any kind: no Secret reads, no writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: patchy-egress-broker-authn
    labels:
        app.kubernetes.io/name: egress-broker
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [authentication.k8s.io]
      resources: [tokenreviews]
      verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: patchy-egress-broker-authn
    labels:
        app.kubernetes.io/name: egress-broker
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: patchy-egress-broker-authn
subjects:
    - kind: ServiceAccount
      name: patchy-egress-broker
      namespace: patchy
---
# ---- integration-controller: TokenReview ------------------------------------
# TokenReview is cluster-scoped and create-only, so a namespaced Role cannot
# grant it. The integration-controller uses it on its in-cluster
# repository-access endpoint (:9792) to check the status server's projected
# ServiceAccount token. Review-only: it can ask "whose token is this?" and
# nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: patchy-integration-controller-authn
    labels:
        app.kubernetes.io/name: integration-controller
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [authentication.k8s.io]
      resources: [tokenreviews]
      verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: patchy-integration-controller-authn
    labels:
        app.kubernetes.io/name: integration-controller
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: patchy-integration-controller-authn
subjects:
    - kind: ServiceAccount
      name: patchy-integration-controller
      namespace: patchy
