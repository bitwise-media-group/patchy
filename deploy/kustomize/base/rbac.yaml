#
# RBAC, in full. One Role (+ RoleBinding) per controller in the patchy
# namespace, verb-by-verb what its reconcilers use, plus one Role in
# patchy-agents for each of the two job controllers.
#
# Conventions the rules encode:
#
#   * The CRs are the state machine. Writers are exclusive per field — the
#     transition table in DESIGN.md says which controller writes which edge —
#     and the verbs here enforce the split at the API layer as far as RBAC
#     can (RBAC is per-resource, not per-field; the reviewable writer table
#     is the finer-grained control).
#   * secrets get (never list/watch): provider/forge credentials are read on
#     demand by name through the API reader (internal/kube disables the
#     Secret cache), so no controller can enumerate Secrets.
#   * leases + events: controller-runtime leader election. Deployments stay
#     replicas:1 + Recreate; the lease is insurance against two replicas
#     racing during a botched rollout.
#   * The agent pods (patchy-agents) have NO role at all — see
#     serviceaccount.yaml.
---
# ---- integration-controller ------------------------------------------------
# Ingests scanner webhooks into Findings (create/fold/duplicate-merge —
# the one deleter of duplicate Findings), projects Findings to tracking
# issues (reads the children's reports), and applies human signals
# (approve/close/PR-merge) to Finding spec + status.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: patchy-integration-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: integration-controller
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings]
      verbs: [create, get, list, watch, update, patch, delete, deletecollection]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [integrations]
      verbs: [get, list, watch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [integrations/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [investigations, remediations]
      verbs: [get, list, watch, deletecollection]
    # the demo reset (Integration spec.reset) wipes every pipeline resource
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [repositories, findingrollups]
      verbs: [deletecollection]
    - apiGroups: [""]
      resources: [secrets]
      verbs: [get]
    - apiGroups: [coordination.k8s.io]
      resources: [leases]
      verbs: [get, create, update]
    - apiGroups: [""]
      resources: [events]
      verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: patchy-integration-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: integration-controller
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: patchy-integration-controller
subjects:
    - kind: ServiceAccount
      name: patchy-integration-controller
      namespace: patchy
---
# ---- source-controller -----------------------------------------------------
# Validates Forge credentials, resolves + pins Repositories, serves the
# artifact tarballs. Writes only Forge/Repository status.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: patchy-source-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: source-controller
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [forges, repositories]
      verbs: [get, list, watch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [forges/status, repositories/status]
      verbs: [get, update, patch]
    - apiGroups: [""]
      resources: [secrets]
      verbs: [get]
    - apiGroups: [coordination.k8s.io]
      resources: [leases]
      verbs: [get, create, update]
    - apiGroups: [""]
      resources: [events]
      verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: patchy-source-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: source-controller
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: patchy-source-controller
subjects:
    - kind: ServiceAccount
      name: patchy-source-controller
      namespace: patchy
---
# ---- context-controller ----------------------------------------------------
# The enhancer chain: reads Opened findings, writes enrichments/owners and the
# Opened→Enhanced edge to status, and sets spec.repository once for a cloud
# finding that arrived without one (resolved from the resource's ownership
# labels) — which is why it holds update on findings, not status alone.
# Integrations are read-only: the dynamic enhancers take their configuration
# from their Integrations. secrets get (by name, through the API reader): the
# generic enhancer signs its outbound calls with its Integration's webhook
# secret; the cloud enhancers still use workload identity and hold none.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: patchy-context-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: context-controller
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings]
      verbs: [get, list, watch, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [integrations]
      verbs: [get, list, watch]
    - apiGroups: [""]
      resources: [secrets]
      verbs: [get]
    - apiGroups: [coordination.k8s.io]
      resources: [leases]
      verbs: [get, create, update]
    - apiGroups: [""]
      resources: [events]
      verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: patchy-context-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: context-controller
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: patchy-context-controller
subjects:
    - kind: ServiceAccount
      name: patchy-context-controller
      namespace: patchy
---
# ---- investigation-controller ----------------------------------------------
# The gate (creates Repository + Investigation, parks repo-less findings) and
# the analysis scheduler (launches agent Jobs, stamps results, routes the
# verdict edges on Finding status).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: patchy-investigation-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: investigation-controller
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings]
      verbs: [get, list, watch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [investigations]
      verbs: [create, get, list, watch, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [investigations/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [repositories]
      verbs: [create, get, list, watch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [forges]
      verbs: [get, list, watch]
    # Read-only: the estimate calibration rendered into the analysis prompt.
    # The read is a Get, but it goes through the cached client, whose informer
    # needs list/watch.
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findingrollups]
      verbs: [get, list, watch]
    - apiGroups: [""]
      resources: [secrets]
      verbs: [get]
    # The agent transcript each run persists: a ConfigMap owner-referenced to
    # the run, so the Finding's TTL cascade removes it. No list/watch — it is
    # only ever addressed by its own deterministic name.
    - apiGroups: [""]
      resources: [configmaps]
      verbs: [create, get, update]
    - apiGroups: [coordination.k8s.io]
      resources: [leases]
      verbs: [get, create, update]
    - apiGroups: [""]
      resources: [events]
      verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: patchy-investigation-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: investigation-controller
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: patchy-investigation-controller
subjects:
    - kind: ServiceAccount
      name: patchy-investigation-controller
      namespace: patchy
---
# ---- remediation-controller ------------------------------------------------
# Queue admission + the remediation scheduler + push/PR, and the rollup/TTL
# loop. The one deleter of expired Findings (cascade deletes the children);
# `update` on findings/investigations/remediations (not just status) is the
# rollup finalizer removal.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: patchy-remediation-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: remediation-controller
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings]
      verbs: [get, list, watch, update, patch, delete]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [remediations]
      verbs: [create, get, list, watch, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [remediations/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [investigations]
      verbs: [get, list, watch, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [investigations/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [repositories]
      verbs: [get, list, watch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findingrollups]
      verbs: [create, get, list, watch, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findingrollups/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [forges]
      verbs: [get, list, watch]
    - apiGroups: [""]
      resources: [secrets]
      verbs: [get]
    # The agent transcript each run persists: a ConfigMap owner-referenced to
    # the run, so the Finding's TTL cascade removes it. No list/watch — it is
    # only ever addressed by its own deterministic name.
    - apiGroups: [""]
      resources: [configmaps]
      verbs: [create, get, update]
    - apiGroups: [coordination.k8s.io]
      resources: [leases]
      verbs: [get, create, update]
    - apiGroups: [""]
      resources: [events]
      verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: patchy-remediation-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: remediation-controller
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: patchy-remediation-controller
subjects:
    - kind: ServiceAccount
      name: patchy-remediation-controller
      namespace: patchy
---
# ---- status-server ----------------------------------------------------------
# The status page backend: reads Findings/FindingRollups for the projection
# and writes SPEC only — approve records spec.approval, suspend and resume
# toggle spec.suspend, replay stamps Integration spec.replay. Deliberately NO
# */status: the status server never moves a phase (the transition table's
# writers stay exclusive), and RBAC enforces that at the API layer. The
# delete/deletecollection verbs back the access-review-gated reset action
# (demo tooling): wipe the pipeline state, keep the configuration
# (Integrations, Forges). No leases (no reconcilers, no leader election), no
# secrets (the auth config is a mounted volume).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: patchy-status-server
    namespace: patchy
    labels:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findings]
      verbs: [get, list, watch, update, patch, delete, deletecollection]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [findingrollups]
      verbs: [get, list, watch, delete, deletecollection]
    # Read-only plus reset: the projection lifts each run's report markdown
    # from the Investigation/Remediation children (reports live on the child
    # only); repositories exist for reset alone.
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [investigations, remediations, repositories]
      verbs: [get, list, watch, delete, deletecollection]
    # Spec-only write seam for the replay action (spec.replay); the cached
    # client's informer needs list/watch.
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [integrations]
      verbs: [get, list, watch, update, patch]
    # The persisted agent transcripts, read one at a time when a human opens a
    # finding. Get only: they go through the uncached API reader, so no
    # informer and no list/watch — caching every ConfigMap in the namespace to
    # serve these would be a poor trade.
    - apiGroups: [""]
      resources: [configmaps]
      verbs: [get]
---
# Live transcripts: the status server follows a running agent's pod log to
# stream its conversation into the investigation/remediation tabs. The read
# goes through the API server — it never dials an agent pod, so the agents'
# default-deny ingress policy is untouched. Read-only and scoped to the agents
# namespace: no Jobs, no Secrets, no writes. Drop this Role and its binding to
# serve only the transcripts of completed runs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: patchy-status-server-agent-logs
    namespace: patchy-agents
    labels:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [""]
      resources: [pods]
      verbs: [get, list]
    - apiGroups: [""]
      resources: [pods/log]
      verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: patchy-status-server-agent-logs
    namespace: patchy-agents
    labels:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: patchy-status-server-agent-logs
subjects:
    - kind: ServiceAccount
      name: patchy-status-server
      namespace: patchy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: patchy-status-server
    namespace: patchy
    labels:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: patchy-status-server
subjects:
    - kind: ServiceAccount
      name: patchy-status-server
      namespace: patchy
---
# The one ClusterRole in the base: SubjectAccessReview is a cluster-scoped,
# non-namespaced create-only API, so a namespaced Role cannot grant it. The
# status server uses it to answer "may user U <verb> findings in patchy?"
# for the signed-in user — the custom verbs (approve, suspend, resume) and
# the native get that gates viewing (see rbac.users.example.yaml for the
# grant grammar). Review-only: this confers no power to act, only to ask.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: patchy-status-server-authz
    labels:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [authorization.k8s.io]
      resources: [subjectaccessreviews]
      verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: patchy-status-server-authz
    labels:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: patchy-status-server-authz
subjects:
    - kind: ServiceAccount
      name: patchy-status-server
      namespace: patchy
---
# ---- evaluation-controller ---------------------------------------------------
# The remote-evaluation engine: the HTTP API creates Evaluations (submissions)
# and deletes them (cancel); the gate creates EvaluationUnit children; the
# scheduler stamps unit statuses and rolls the parent up; the TTL loop deletes
# expired Evaluations (cascade). `update` on evaluationunits (not just status)
# is the jobs-finalizer removal. configmaps create/get/update: the per-unit
# results objects, owner-referenced to their unit, only ever addressed by
# deterministic name (plus get for the API's snapshot lift). No secrets in
# this namespace — the auth config is a mounted volume.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: patchy-evaluation-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: evaluation-controller
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [evaluations]
      verbs: [create, get, list, watch, delete]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [evaluations/status]
      verbs: [get, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [evaluationunits]
      verbs: [create, get, list, watch, update, patch]
    - apiGroups: [patchy.bitwisemedia.uk]
      resources: [evaluationunits/status]
      verbs: [get, update, patch]
    - apiGroups: [""]
      resources: [configmaps]
      verbs: [create, get, update]
    - apiGroups: [coordination.k8s.io]
      resources: [leases]
      verbs: [get, create, update]
    - apiGroups: [""]
      resources: [events]
      verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: patchy-evaluation-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: evaluation-controller
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: patchy-evaluation-controller
subjects:
    - kind: ServiceAccount
      name: patchy-evaluation-controller
      namespace: patchy
---
# SubjectAccessReview for the evaluation API: "may user U create/get/delete
# evaluations in patchy?" — the bearer-authenticated submitters are authorized
# by RBAC bindings on the evaluations resource (see rbac.users.example.yaml),
# native verbs only. Review-only, same as the status server's.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: patchy-evaluation-controller-authz
    labels:
        app.kubernetes.io/name: evaluation-controller
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [authorization.k8s.io]
      resources: [subjectaccessreviews]
      verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: patchy-evaluation-controller-authz
    labels:
        app.kubernetes.io/name: evaluation-controller
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: patchy-evaluation-controller-authz
subjects:
    - kind: ServiceAccount
      name: patchy-evaluation-controller
      namespace: patchy
---
# ---- patchy-agents: the two job controllers --------------------------------
# What internal/jobs uses, and nothing more:
#   jobs      create (Create), get/list/watch (status + orphan reap), delete
#   pods      get/list/watch (find the Job's pod)
#   pods/log  get (read the PATCHY-EVENT: stream at Job completion)
#   secrets   create/get/update/delete (the per-Job Secret carrying the
#             handoff markdown — credential-less; update owner-references it
#             to its Job, delete is the create-Job-failed rollback)
# No secrets list/watch: each controller only ever addresses its own per-Job
# Secret by name. The two controllers share the namespace; the
# patchy.bitwisemedia.uk/kind Job label keeps their watches and reapers out
# of each other's way (RBAC cannot express that split).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: patchy-agent-jobs
    namespace: patchy-agents
    labels:
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [batch]
      resources: [jobs]
      verbs: [create, get, list, watch, delete]
    - apiGroups: [""]
      resources: [pods]
      verbs: [get, list, watch]
    - apiGroups: [""]
      resources: [pods/log]
      verbs: [get]
    - apiGroups: [""]
      resources: [secrets]
      verbs: [create, get, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: patchy-agent-jobs
    namespace: patchy-agents
    labels:
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: patchy-agent-jobs
subjects:
    - kind: ServiceAccount
      name: patchy-investigation-controller
      namespace: patchy
    - kind: ServiceAccount
      name: patchy-remediation-controller
      namespace: patchy
    # The evaluation scheduler launches its Jobs through the same machinery;
    # the kind label keeps its watches and reapers off the finding runs.
    - kind: ServiceAccount
      name: patchy-evaluation-controller
      namespace: patchy
---
# ---- egress-broker ----------------------------------------------------------
# TokenReview is a cluster-scoped, create-only API, so a namespaced Role
# cannot grant it. The broker uses it to validate each caller's projected
# ServiceAccount token before any byte is proxied. Review-only, and the
# broker's ONLY Kubernetes access of any kind — no Secret reads, no writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: patchy-egress-broker-authn
    labels:
        app.kubernetes.io/name: egress-broker
        app.kubernetes.io/part-of: patchy
rules:
    - apiGroups: [authentication.k8s.io]
      resources: [tokenreviews]
      verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: patchy-egress-broker-authn
    labels:
        app.kubernetes.io/name: egress-broker
        app.kubernetes.io/part-of: patchy
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: patchy-egress-broker-authn
subjects:
    - kind: ServiceAccount
      name: patchy-egress-broker
      namespace: patchy
