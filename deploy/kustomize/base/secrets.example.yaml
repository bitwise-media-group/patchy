#
# EXAMPLE ONLY. Every resource here is commented out, and this file is NOT in
# kustomization.yaml's resources list. It documents the Secrets patchy
# expects; it does not create them.
#
# Do not put real values in git. Use SOPS (age/KMS-encrypted, decrypted by
# your GitOps tooling or `sops -d | kubectl apply -f -`) or
# external-secrets.io with your own vault as the backing store, and reference
# them from an overlay. Plain `kubectl create secret` is fine for kind/dev.
#
# ---------------------------------------------------------------------------
# 1. patchy-github  (namespace: patchy)
#
# The GitHub credential. CUSTOM RESOURCES reference it, not Deployments:
#   * an Integration's spec.secretRef names it for webhook validation + issue
#     projection + alert ingestion;
#   * a Forge's spec.secretRef names it (or a separate one) for repository
#     clone/push access.
# One Secret may serve both, or you may split read and write identities
# across two GitHub Apps.
#
# Keys (internal/ghsecret):
#   appID + privateKey   GitHub App auth, the production mode. Tokens are
#                        minted per-installation, scoped per-repository.
#   token                a personal-access-token fallback (dev only; wins
#                        over App auth when set).
#   webhookSecret        the HMAC secret configured on the App's webhook
#                        (Integration secrets only; Forge ignores it).
#   proxyUsername +      OPTIONAL. Basic-auth credentials for the forward
#   proxyPassword        proxy named by the referencing resource's spec.proxy
#                        (never embed them in the proxy URL itself).
#   clientSecret         OPTIONAL. The GitHub App's OAuth client secret, for
#                        the status page's "Connect GitHub" link
#                        (Integration spec.github.userAuthorization; App
#                        credentials only). Only the integration-controller
#                        reads it; the status server never sees it.
#
# kubectl -n patchy create secret generic patchy-github \
#   --from-literal=appID=123456 \
#   --from-file=privateKey=./patchy.2026-01-01.private-key.pem \
#   --from-literal=webhookSecret="$(openssl rand -hex 32)"
#
# apiVersion: v1
# kind: Secret
# metadata:
#     name: patchy-github
#     namespace: patchy
# type: Opaque
# stringData:
#     appID: "123456"
#     privateKey: |
#         -----BEGIN RSA PRIVATE KEY-----
#         ...the App's private key, downloaded once at App creation...
#         -----END RSA PRIVATE KEY-----
#     webhookSecret: "0123456789abcdef...  # openssl rand -hex 32"
#     # clientSecret: "..."      # App settings > Client secrets; "Connect GitHub" only
#
# ---------------------------------------------------------------------------
# 2. the model credentials
#
# 2a. patchy-anthropic: the claude runner's Anthropic credential (namespace:
# patchy, NOT patchy-agents). Claude is brokered: its model traffic goes
# through the egress credential broker. The broker is the Secret's ONLY
# consumer, so the credential lives in the controllers' namespace and never
# enters an agent pod. You only need it when the claude provider is
# `anthropic` (bedrock/vertex/foundry-entra use the broker's cloud workload
# identity instead). The api-key key holds one of:
#   * an API key (PATCHY_ANTHROPIC_AUTH=key, the default);
#   * a `claude setup-token` OAuth token (PATCHY_ANTHROPIC_AUTH=token). This
#     replaces the old CLAUDE_CODE_OAUTH_TOKEN secretEnv now that claude is
#     brokered.
#
# MIGRATION from releases before the broker: this Secret used to live in
# patchy-agents. Create it in patchy, upgrade (the broker lands), then
# delete the old copy from patchy-agents.
#
# kubectl -n patchy create secret generic patchy-anthropic \
#   --from-literal=api-key="sk-ant-..."
#
# apiVersion: v1
# kind: Secret
# metadata:
#     name: patchy-anthropic
#     namespace: patchy
# type: Opaque
# stringData:
#     api-key: "sk-ant-..."
#
# 2b. patchy-openai: the codex runner's OpenAI platform API key (namespace:
# patchy, because the broker is its only consumer). You only need it when
# `codex` is in PATCHY_HARNESSES with PATCHY_CODEX_PROVIDER=openai. The
# broker side is enabled by PATCHY_OPENAI_API_KEY_FILE (configmap.yaml).
# Like claude, codex is brokered: no credential enters the agent namespace,
# and the broker injects this key as a bearer. The broker cannot carry a
# ChatGPT-plan workspace token (CODEX_ACCESS_TOKEN). Use a platform API key,
# or Azure OpenAI (PATCHY_CODEX_PROVIDER=azure: an api-key Secret mounted for
# PATCHY_AZURE_API_KEY_FILE, or Entra via the broker's workload identity).
#
# MIGRATION from releases before codex was brokered: this Secret used to live
# in patchy-agents. Create it in patchy, upgrade, then delete the old copy
# from patchy-agents.
#
# kubectl -n patchy create secret generic patchy-openai \
#   --from-literal=api-key="sk-..."
#
# apiVersion: v1
# kind: Secret
# metadata:
#     name: patchy-openai
#     namespace: patchy
# type: Opaque
# stringData:
#     api-key: "sk-..."
#
# ---------------------------------------------------------------------------
# 3. patchy-status-auth  (namespace: patchy)
#
# The status server's authentication configuration, mounted at
# /etc/patchy/auth (deployment-status-server.yaml; the volume is optional).
# WITHOUT this Secret the status page serves nothing: no findings, no
# metrics, no actions, no sign-in. With it, each view opens to
# authenticated users whose RBAC grants it (rbac.users.example.yaml).
#
# Key: config.yaml. Modes:
#   none       full access, no sign-in. Development only (the dev overlay
#              ships this).
#   anonymous  one fixed identity for every visitor; RBAC still applies.
#   oidc       the real SSO flow (below). The clientSecret also keys the
#              session-cookie encryption: rotating it signs everyone out.
#
# The "Connect GitHub" link cookies are sealed with a key derived from the
# OIDC clientSecret in mode oidc. Modes anonymous and none have no client
# secret, so linking stays off there unless linkKeyFile names a file of at
# least 32 random bytes. Every key of this Secret is mounted under
# /etc/patchy/auth, so the simplest home for it is a second key here:
#
# kubectl -n patchy create secret generic patchy-status-auth \
#   --from-file=config.yaml=./status-auth.yaml \
#   --from-literal=linkKey="$(openssl rand -hex 32)"
#
# with `linkKeyFile: /etc/patchy/auth/linkKey` in config.yaml. Rotating it
# drops every link (users connect GitHub again); sign-in is unaffected.
#
# kubectl -n patchy create secret generic patchy-status-auth \
#   --from-file=config.yaml=./status-auth.yaml
#
# apiVersion: v1
# kind: Secret
# metadata:
#     name: patchy-status-auth
#     namespace: patchy
# type: Opaque
# stringData:
#     config.yaml: |
#         mode: oidc
#         sessionDuration: 168h
#         oidc:
#             issuerURL: https://sso.example.com
#             clientID: patchy-status
#             clientSecret: "..."
#             # scopes: [openid, offline_access, profile, email, groups]
#             # autoLogin: true
#             # redirectURL: https://patchy-status.example.com/oauth2/callback
#             # claims: {username: email, groups: groups, displayName: name}
#     # mode anonymous/none only; mode oidc derives the key from clientSecret:
#     # linkKey: "0123456789abcdef...  # openssl rand -hex 32"
#
# ---------------------------------------------------------------------------
# The evaluation API's auth configuration (evaluation-controller mounts it at
# /etc/patchy/auth/config.yaml). It is a smaller version of the status
# server's: no sessions and NO client secret, because evolve is a public PKCE
# client. The API only verifies bearer tokens against the issuer. Use
# `mode: none` for dev/e2e (fixed identity, authorization bypassed).
#
# kubectl -n patchy create secret generic patchy-evaluation-auth \
#   --from-file=config.yaml=./evaluation-auth.yaml
#
# apiVersion: v1
# kind: Secret
# metadata:
#     name: patchy-evaluation-auth
#     namespace: patchy
# type: Opaque
# stringData:
#     config.yaml: |
#         mode: oidc
#         oidc:
#             issuerURL: https://sso.example.com
#             clientID: evolve
#             # scopes: [openid, offline_access, profile, email, groups]
#             # claims: {username: email, groups: groups, displayName: name}
#
# ---------------------------------------------------------------------------
# On purpose, there is NO GitHub credential in the patchy-agents namespace,
# not even a per-Job one. The agent's init container fetches the repository
# as a digest-verified tarball from source-controller's artifact server. The
# per-Job Secret carries only handoff markdown. That absence is the isolation
# model. See networkpolicy.yaml.
