#
# Five Services, because only five things are dialled by anything:
#
#   * patchy-integration-controller:8080 — the machine-facing entry point
#     (the provider webhook receivers, e.g. POST /github/webhooks).
#     Put an Ingress / Gateway in front of it in your environment overlay.
#   * patchy-source-controller:9790 — the artifact server the agent pods
#     fetch SHA-pinned repository tarballs (and workspace bundles) from
#     (in-cluster only; the NetworkPolicies restrict it to the patchy-agents
#     namespace) — plus :9791, the internal blob-upload endpoint only
#     evaluation-controller may reach.
#   * patchy-status-server:8080 — the human-facing status page. Front it
#     with your Ingress / Gateway too (a separate hostname from the webhook
#     endpoint keeps authn concerns apart).
#   * patchy-evaluation-controller:8080 — the evolve-facing evaluation API.
#     Front it with your Ingress / Gateway (bearer-authenticated; its own
#     hostname keeps it apart from the human surfaces).
#   * patchy-egress-broker:8080 — the egress credential broker all claude
#     model traffic goes through (in-cluster only; caller tokens validated
#     via TokenReview, ingress restricted to the patchy-agents namespace).
#
# The other controllers serve nothing but kubelet probes on :8081, which hit
# the pod directly — no Service needed.
---
apiVersion: v1
kind: Service
metadata:
    name: patchy-integration-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: integration-controller
        app.kubernetes.io/part-of: patchy
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: integration-controller
        app.kubernetes.io/part-of: patchy
    ports:
        - name: http
          port: 8080
          targetPort: http
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
    name: patchy-source-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: source-controller
        app.kubernetes.io/part-of: patchy
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: source-controller
        app.kubernetes.io/part-of: patchy
    ports:
        - name: artifact
          port: 9790
          targetPort: artifact
          protocol: TCP
        - name: internal
          port: 9791
          targetPort: internal
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
    name: patchy-evaluation-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: evaluation-controller
        app.kubernetes.io/part-of: patchy
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: evaluation-controller
        app.kubernetes.io/part-of: patchy
    ports:
        - name: http
          port: 8080
          targetPort: http
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
    name: patchy-status-server
    namespace: patchy
    labels:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: patchy
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: patchy
    ports:
        - name: http
          port: 8080
          targetPort: http
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
    name: patchy-egress-broker
    namespace: patchy
    labels:
        app.kubernetes.io/name: egress-broker
        app.kubernetes.io/part-of: patchy
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: egress-broker
        app.kubernetes.io/part-of: patchy
    ports:
        - name: http
          port: 8080
          targetPort: http
          protocol: TCP
