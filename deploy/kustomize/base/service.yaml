#
# Five Services, because only five things receive connections:
#
#   * patchy-integration-controller:8080: the machine-facing entry point
#     (the provider webhook receivers, e.g. POST /github/webhooks).
#     Put an Ingress / Gateway in front of it in your environment overlay.
#   * patchy-source-controller:9790: the artifact server. Agent pods fetch
#     SHA-pinned repository tarballs (and workspace bundles) from it. It is
#     in-cluster only, and the NetworkPolicies restrict it to the
#     patchy-agents namespace. Port :9791 is the internal blob-upload
#     endpoint, and only evaluation-controller may reach it.
#   * patchy-status-server:8080: the human-facing status page. Put your
#     Ingress / Gateway in front of it too. A separate hostname from the
#     webhook endpoint keeps authn concerns apart.
#   * patchy-evaluation-controller:8080: the evaluation API that evolve
#     calls. Put your Ingress / Gateway in front of it. It uses bearer auth,
#     and its own hostname keeps it apart from the human-facing pages.
#   * patchy-egress-broker:8080: the egress credential broker all claude and
#     codex model traffic goes through. It is in-cluster only. It validates caller
#     tokens via TokenReview, and ingress is restricted to the patchy-agents
#     namespace.
#
# The other controllers serve only kubelet probes on :8081. Those hit the pod
# directly, so they need no Service.
---
apiVersion: v1
kind: Service
metadata:
    name: patchy-integration-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: integration-controller
        app.kubernetes.io/part-of: patchy
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: integration-controller
        app.kubernetes.io/part-of: patchy
    ports:
        - name: http
          port: 8080
          targetPort: http
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
    name: patchy-source-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: source-controller
        app.kubernetes.io/part-of: patchy
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: source-controller
        app.kubernetes.io/part-of: patchy
    ports:
        - name: artifact
          port: 9790
          targetPort: artifact
          protocol: TCP
        - name: internal
          port: 9791
          targetPort: internal
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
    name: patchy-evaluation-controller
    namespace: patchy
    labels:
        app.kubernetes.io/name: evaluation-controller
        app.kubernetes.io/part-of: patchy
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: evaluation-controller
        app.kubernetes.io/part-of: patchy
    ports:
        - name: http
          port: 8080
          targetPort: http
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
    name: patchy-status-server
    namespace: patchy
    labels:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: patchy
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: status-server
        app.kubernetes.io/part-of: patchy
    ports:
        - name: http
          port: 8080
          targetPort: http
          protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
    name: patchy-egress-broker
    namespace: patchy
    labels:
        app.kubernetes.io/name: egress-broker
        app.kubernetes.io/part-of: patchy
spec:
    type: ClusterIP
    selector:
        app.kubernetes.io/name: egress-broker
        app.kubernetes.io/part-of: patchy
    ports:
        - name: http
          port: 8080
          targetPort: http
          protocol: TCP
