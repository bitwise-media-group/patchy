#
# An extra layer of protection for the agent sandbox, for clusters whose CNI
# is Cilium.
#
# What this adds over base/networkpolicy.yaml: FQDN matching. A plain
# NetworkPolicy can only say "TCP 443 to the internet". Cilium's DNS proxy
# lets it say "this name, and nothing else". For the brokered runners it
# says "no external name at all". Everything else is dropped, such as a
# package registry the agent tries to reach, or an exfil endpoint a
# prompt-injected agent is talked into.
#
# There is one policy per harness. Each selects that harness's pods by their
# patchy.bitwisemedia.uk/harness label. Both runners are brokered, so each
# policy is cluster-only, with no toFQDNs and no resolvable external names:
#
#   * source-controller's artifact server (in-cluster, port 9790): the init
#     container's credential-less, digest-verified tarball fetch. No forge
#     host appears in this policy at all, because the pod never talks to
#     GitHub.
#   * the egress broker (in-cluster, port 8080): the agent container's
#     harness CLI. The broker adds the credential to its model traffic and
#     forwards it.
#
# A non-brokered runner added later would instead get a toFQDNs rule for its
# own model API on 443 (and that host in its DNS matchPatterns).
#
# The codex policy has no effect until that runner is enabled (no pod
# carries the label otherwise). Requires: Cilium with DNS-based policy
# enabled (the DNS proxy). If your CNI is not Cilium, drop this component.
# base/networkpolicy.yaml still applies and is the minimum.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
    name: patchy-agent-egress-claude
    namespace: patchy-agents
    labels:
        app.kubernetes.io/part-of: patchy
spec:
    endpointSelector:
        matchLabels:
            app.kubernetes.io/name: patchy-agent
            app.kubernetes.io/managed-by: patchy
            patchy.bitwisemedia.uk/harness: claude
    egress:
        # DNS, via Cilium's proxy. Brokered claude resolves only
        # cluster-local names. No external name resolves from its pods.
        - toEndpoints:
              - matchLabels:
                    io.kubernetes.pod.namespace: kube-system
                    k8s-app: kube-dns
          toPorts:
              - ports:
                    - port: "53"
                      protocol: ANY
                rules:
                    dns:
                        - matchPattern: "*.patchy.svc.cluster.local"
                        - matchPattern: "*.svc.cluster.local"

        # The INIT container's artifact fetch: source-controller's tarball
        # server, in-cluster, credential-less, digest-verified.
        - toEndpoints:
              - matchLabels:
                    io.kubernetes.pod.namespace: patchy
                    app.kubernetes.io/name: source-controller
          toPorts:
              - ports:
                    - port: "9790"
                      protocol: TCP

        # The agent container: the egress credential broker, which fronts
        # whichever model API is configured, and nothing else. No toFQDNs.
        - toEndpoints:
              - matchLabels:
                    io.kubernetes.pod.namespace: patchy
                    app.kubernetes.io/name: egress-broker
          toPorts:
              - ports:
                    - port: "8080"
                      protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
    name: patchy-agent-egress-codex
    namespace: patchy-agents
    labels:
        app.kubernetes.io/part-of: patchy
spec:
    endpointSelector:
        matchLabels:
            app.kubernetes.io/name: patchy-agent
            app.kubernetes.io/managed-by: patchy
            patchy.bitwisemedia.uk/harness: codex
    egress:
        # DNS, via Cilium's proxy. Brokered codex, like claude, resolves only
        # cluster-local names. No external name resolves from its pods.
        - toEndpoints:
              - matchLabels:
                    io.kubernetes.pod.namespace: kube-system
                    k8s-app: kube-dns
          toPorts:
              - ports:
                    - port: "53"
                      protocol: ANY
                rules:
                    dns:
                        - matchPattern: "*.patchy.svc.cluster.local"
                        - matchPattern: "*.svc.cluster.local"

        # The INIT container's artifact fetch: source-controller's tarball
        # server, in-cluster, credential-less, digest-verified.
        - toEndpoints:
              - matchLabels:
                    io.kubernetes.pod.namespace: patchy
                    app.kubernetes.io/name: source-controller
          toPorts:
              - ports:
                    - port: "9790"
                      protocol: TCP

        # The agent container: the egress credential broker, which fronts
        # whichever model API is configured, and nothing else. No toFQDNs.
        - toEndpoints:
              - matchLabels:
                    io.kubernetes.pod.namespace: patchy
                    app.kubernetes.io/name: egress-broker
          toPorts:
              - ports:
                    - port: "8080"
                      protocol: TCP
