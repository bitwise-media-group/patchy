#
# Defence in depth for the agent sandbox, for GKE Dataplane V2 clusters — the
# same allowlist as ../cilium, in the dialect GKE actually enforces.
#
# Dataplane V2 IS Cilium, but it has not honoured the CiliumNetworkPolicy CRD
# since 1.21.5-gke.1300 and rejects every L7 rule, which is what ../cilium's
# toFQDNs and rules.dns blocks are. Applying that component to a GKE cluster
# gets you an object that enforces nothing while reading as protection.
# FQDNNetworkPolicy is the supported equivalent: anetd snoops the pod's DNS
# answers and programs the resolved addresses, the same trick Cilium's DNS
# proxy plays.
#
# REQUIRES the cluster to be created or updated with
# `--enable-fqdn-network-policy` (Dataplane V2, plus kube-dns or Cloud DNS; on
# Standard clusters restart the anetd DaemonSet afterwards). Without the flag
# the CRD does not exist and this component fails to apply — loudly, which is
# the failure mode you want.
#
# What this covers, and what it does NOT:
#
#   * The agent container's own model API on 443 — one policy per
#     NON-BROKERED harness, selecting that harness's pods by their
#     patchy.bitwisemedia.uk/harness label, so a codex pod reaches only
#     api.openai.com. No forge host appears; the pod never talks to GitHub.
#     There is NO claude policy: claude is brokered and has no external
#     hosts at all — its whole egress (DNS, the artifact server, the egress
#     broker) comes from base/networkpolicy.yaml.
#   * NOT DNS and NOT the artifact server. FQDN policies are egress-only and
#     cannot name a resolver or select a ClusterIP Service, so both still come
#     from base/networkpolicy.yaml — which kustomization.yaml keeps, minus its
#     broad 443 rule.
#
# The codex and copilot policies are inert until those runners are enabled (no
# pod carries the label otherwise).
---
apiVersion: networking.gke.io/v1alpha1
kind: FQDNNetworkPolicy
metadata:
    name: patchy-agent-egress-codex
    namespace: patchy-agents
    labels:
        app.kubernetes.io/part-of: patchy
spec:
    podSelector:
        matchLabels:
            app.kubernetes.io/name: patchy-agent
            app.kubernetes.io/managed-by: patchy
            patchy.bitwisemedia.uk/harness: codex
    egress:
        # The agent container: the codex harness's model API and nothing else.
        - matches:
              - name: api.openai.com
          ports:
              - protocol: TCP
                port: 443
---
# The copilot harness needs api.github.com because the CLI validates and
# exchanges its token there before it will talk to a model; denying it does not
# harden the pod, it stops the harness working. The agent still cannot use it as
# a forge — the runner passes --disable-builtin-mcps, so no tool in the session
# speaks the GitHub API.
#
# Inference then goes to a *.githubcopilot.com endpoint chosen at token-exchange
# time, and WHICH one depends on the plan behind the token (individual,
# business, enterprise). FQDNNetworkPolicy takes exact names only, so all three
# are listed rather than a pattern; if your plan resolves somewhere else the
# agent container will fail to reach the model with this component applied, and
# the fix is to add that name here. The Cilium component expresses the same
# allowlist as a *.githubcopilot.com pattern instead.
apiVersion: networking.gke.io/v1alpha1
kind: FQDNNetworkPolicy
metadata:
    name: patchy-agent-egress-copilot
    namespace: patchy-agents
    labels:
        app.kubernetes.io/part-of: patchy
spec:
    podSelector:
        matchLabels:
            app.kubernetes.io/name: patchy-agent
            app.kubernetes.io/managed-by: patchy
            patchy.bitwisemedia.uk/harness: copilot
    egress:
        - matches:
              - name: api.github.com
              - name: api.githubcopilot.com
              - name: api.business.githubcopilot.com
              - name: api.enterprise.githubcopilot.com
          ports:
              - protocol: TCP
                port: 443
