#
# Optional component: hostname-mode egress for the agent sandbox, for GKE
# Dataplane V2 clusters. Enable it from an overlay with
#
#     components:
#         - ../../components/gke-fqdn
#
# On a self-managed Cilium use ../cilium instead, and on an Istio mesh use
# ../istio. Both give the same allowlist, enforced in a different place.
# Never combine two of them.
#
# Every runner patchy ships is brokered (claude, codex). Their pods reach no
# external host at all. They reach only DNS, source-controller's artifact
# server and the egress broker, and base/networkpolicy.yaml grants all of
# those. So this component renders NO FQDNNetworkPolicy. A non-brokered
# runner added later would get one here (networking.gke.io/v1alpha1,
# selecting its pods by the patchy.bitwisemedia.uk/harness label, listing
# only its model API on 443). Only once such a policy exists does it REQUIRE
# the cluster to be created or updated with `--enable-fqdn-network-policy`.
#
# What it does do is DROP the base policy's "TCP 443 to anywhere outside the
# cluster" egress rule. Network policies are ADDITIVE. A packet matching ANY
# policy that selects the pod is allowed, and no policy can subtract from
# another. So with the broad rule removed, a brokered pod's egress is only
# DNS + the artifact server + the broker. The `test` op pins the rule's
# position. If base/networkpolicy.yaml reorders its egress rules, the build
# fails instead of silently removing the wrong one. (An earlier revision
# removed index 2, the broker rule, after the broker rule was inserted ahead
# of it. That left the broad rule in place.)
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
    - target:
          kind: NetworkPolicy
          name: patchy-agents-egress
      patch: |
          - op: test
            path: /spec/egress/3/ports/0/port
            value: 443
          - op: remove
            path: /spec/egress/3
