#
# The credential-less end-to-end overlay. It is everything from dev, with two
# replacements: the e2e suite's fake API, running in-cluster, replaces
# GitHub, and a scripted agent replaces the model. The full CRD pipeline runs
# with zero real credentials and nothing on the host.
#
#     PATCHY_OVERLAY=dev-fake make dev-colima      # deploy (builds the fake images too)
#     mise run replay -- -dev-secret \
#         fixtures/webhooks/code_scanning_alert.created.json
#     kubectl get patchy -n patchy -w              # watch the pipeline
#
# The fake's API is reachable from the host at http://localhost:30990 (its
# Service NodePort). See docs/deployment/colima.md for the full walkthrough.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
    - ../dev
    - fakegithub.yaml
    - networkpolicy-fakegithub.yaml

patches:
    # The scripted agent image (hack/fake-agent) as the fake runner instead of
    # the real agent-runner. It prints canned PATCHY-EVENT lines and needs no
    # model key. The dev overlay already limits the enabled set to the fake
    # harness (PATCHY_HARNESSES: fake); this only swaps its image.
    - patch: |
          apiVersion: v1
          kind: ConfigMap
          metadata:
              name: patchy-config
              namespace: patchy
          data:
              PATCHY_FAKE_AGENT_IMAGE: patchy/fake-agent:dev
    # Point the Integration and Forge at the in-cluster fake GitHub.
    - target:
          group: patchy.bitwisemedia.uk
          kind: Integration
          name: github
      patch: |
          - op: add
            path: /spec/github/baseURL
            value: http://patchy-fakegithub.patchy.svc.cluster.local:9990
    - target:
          group: patchy.bitwisemedia.uk
          kind: Forge
          name: github
      patch: |
          - op: add
            path: /spec/baseURL
            value: http://patchy-fakegithub.patchy.svc.cluster.local:9990
