#
# Host-less, class-less Ingress in front of the integration-controller. It
# gives a dev cluster the production shape (only the provider webhook paths
# exposed). It has no ingressClassName on purpose. A dev cluster has exactly
# one ingress controller, and the cluster's default IngressClass is assigned
# on admission (k3s marks its bundled traefik as default; `mise run
# dev-colima` starts colima with traefik enabled). On stock kind this object
# does nothing, because no controller serves it. The NodePort (30079) keeps
# working either way. No TLS: GitHub's HTTPS leg terminates at the tunnel
# (see docs/deployment/colima.md).
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: patchy-integration
    namespace: patchy
    labels:
        app.kubernetes.io/part-of: patchy
spec:
    rules:
        - http:
              paths:
                  - path: /github/webhooks
                    pathType: Prefix
                    backend:
                        service:
                            name: patchy-integration-controller
                            port:
                                number: 8080
                  - path: /google-cloud/webhooks
                    pathType: Prefix
                    backend:
                        service:
                            name: patchy-integration-controller
                            port:
                                number: 8080
                  - path: /wiz/webhooks
                    pathType: Prefix
                    backend:
                        service:
                            name: patchy-integration-controller
                            port:
                                number: 8080
                  - path: /generic/
                    pathType: Prefix
                    backend:
                        service:
                            name: patchy-integration-controller
                            port:
                                number: 8080
