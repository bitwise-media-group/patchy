#
# The fake CMDB. internal/enhancers.StaticFile parses this shape strictly
# (KnownFields is on, so an unknown key is a startup error). The
# context-controller records the matching entry on the Finding. Attributes
# project as security-context labels, and the optional markdown as a sticky
# issue comment.
#
# In a real deployment a CMDB/service-catalogue enhancer would plug in here
# instead (pkg/enhance is the plugin interface).
---
apiVersion: v1
kind: ConfigMap
metadata:
    name: patchy-static-context
    namespace: patchy
    labels:
        app.kubernetes.io/name: context-controller
        app.kubernetes.io/part-of: patchy
data:
    cmdb.yaml: |
        repos:
            bitwise-media-group/patchy:
                owners: [dmccaffery]
                attributes:
                    system: patchy
                    tier: "2"
                    environment: dev
                markdown: |
                    Dev deployment of patchy itself. Findings here are dogfood.
            acme/shop:
                owners: [octocat, hubot]
                attributes:
                    system: storefront
                    tier: "1"
