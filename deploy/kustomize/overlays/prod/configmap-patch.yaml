---
apiVersion: v1
kind: ConfigMap
metadata:
    name: patchy-config
    namespace: patchy
data:
    # DESIGN.md requirements 2 and 5, as written: accumulate for an hour, and
    # pick up only what is older than an hour.
    PATCHY_ACCUMULATION_WINDOW: 1h
    PATCHY_FINDING_MIN_AGE: 1h

    # The real models the investigation may choose between (canonical,
    # provider-qualified; the harness is derived from the model). Only the
    # claude runner is enabled here. To let the investigation choose OpenAI
    # models, add `codex` to PATCHY_HARNESSES and the models to the
    # allowlist. Also set PATCHY_OPENAI_API_KEY_FILE and create the
    # patchy-openai Secret in the patchy namespace, for the broker's openai
    # route (codex is brokered like claude; see base/configmap.yaml).
    PATCHY_HARNESSES: claude
    PATCHY_INVESTIGATE_MODEL: anthropic/claude-sonnet
    PATCHY_REMEDIATE_MODEL: anthropic/claude-sonnet
    PATCHY_MODEL_ALLOWLIST: anthropic/claude-sonnet,anthropic/claude-opus
    PATCHY_CONFIDENCE_THRESHOLD: "0.75"
    PATCHY_MAX_ATTEMPTS: "2"

    # Completed findings live two weeks; the FindingRollups keep the all-time
    # statistics after deletion.
    PATCHY_FINDING_TTL: 336h

    # An agent Job that has not finished in 90 minutes is not going to.
    PATCHY_JOB_DEADLINE: 90m
    # Keep finished Jobs around long enough to debug a bad run.
    PATCHY_JOB_TTL: 6h

    # Optional run archive (docs/deployment/archival.md). Uncomment to keep
    # every run's full record in a locked bucket after its finding expires.
    # The investigation-controller, remediation-controller and status-server
    # ServiceAccounts then need cloud identities (IRSA / workload identity
    # annotations), and, for EKS Pod Identity or GKE workload identity, a
    # NetworkPolicy egress rule to the node-local metadata endpoint
    # (169.254.170.23:80, or 169.254.169.254:80 + 169.254.169.252:988).
    # PATCHY_ARCHIVE_PROVIDER: s3
    # PATCHY_ARCHIVE_BUCKET: acme-patchy-audit
    # PATCHY_ARCHIVE_PREFIX: prod
    # PATCHY_ARCHIVE_REGION: eu-west-2
    # PATCHY_ARCHIVE_KMS_KEY: arn:aws:kms:eu-west-2:111122223333:key/0000-example
    # PATCHY_ARCHIVE_REQUIRED: "true"
    # PATCHY_ARCHIVE_RETRY_WINDOW: 5h   # below PATCHY_JOB_TTL (6h here)

    # Must be the same tag as the claude-agent-runner entry in
    # kustomization.yaml's `images:` block. The controllers copy this string
    # unchanged into every claude Job they create, and kustomize does not
    # rewrite ConfigMap values. release-please bumps both. (Pin
    # PATCHY_CODEX_AGENT_IMAGE too when that runner is enabled.)
    PATCHY_CLAUDE_AGENT_IMAGE: ghcr.io/bitwise-media-group/patchy/claude-agent-runner:v0.16.1 # x-release-please-version
