---
apiVersion: v1
kind: ConfigMap
metadata:
    name: patchy-config
    namespace: patchy
data:
    # DESIGN.md requirements 2 and 5, literally: accumulate for an hour, pick
    # up only what is older than an hour.
    PATCHY_ACCUMULATION_WINDOW: 1h
    PATCHY_FINDING_MIN_AGE: 1h

    # The real models (canonical, provider-qualified; the harness is derived
    # from the model) the investigation may choose between. Only the claude
    # runner is enabled here; add `codex` to
    # PATCHY_HARNESSES and OpenAI models to the allowlist to let the
    # investigation choose them — plus PATCHY_OPENAI_API_KEY_FILE and the
    # patchy-openai Secret in the patchy namespace, for the broker's openai
    # route (codex is brokered like claude; see base/configmap.yaml).
    PATCHY_HARNESSES: claude
    PATCHY_INVESTIGATE_MODEL: anthropic/claude-sonnet
    PATCHY_REMEDIATE_MODEL: anthropic/claude-sonnet
    PATCHY_MODEL_ALLOWLIST: anthropic/claude-sonnet,anthropic/claude-opus
    PATCHY_CONFIDENCE_THRESHOLD: "0.75"
    PATCHY_MAX_ATTEMPTS: "2"

    # Completed findings live two weeks; the FindingRollups keep the all-time
    # statistics after deletion.
    PATCHY_FINDING_TTL: 336h

    # An agent Job that has not finished in 90 minutes is not going to.
    PATCHY_JOB_DEADLINE: 90m
    # Keep finished Jobs around long enough to debug a bad run.
    PATCHY_JOB_TTL: 6h

    # Must be the same tag as the claude-agent-runner entry in
    # kustomization.yaml's `images:` block — this string is copied verbatim
    # into every claude Job the controllers create, and kustomize does not
    # rewrite ConfigMap values. release-please bumps both. (Pin
    # PATCHY_CODEX_AGENT_IMAGE too when that runner is enabled.)
    PATCHY_CLAUDE_AGENT_IMAGE: ghcr.io/bitwise-media-group/patchy/claude-agent-runner:v0.13.0 # x-release-please-version
