#
# Production overlay: DESIGN.md's real intervals, the claude harness, release-
# pinned images, and the Cilium FQDN policy on top of the base NetworkPolicies.
#
# The Secrets (patchy-github and patchy-anthropic, both in `patchy` — the
# claude credential belongs to the egress broker and never enters an agent pod)
# and your real Integration/Forge custom resources are NOT created here — see
# base/secrets.example.yaml and base/crs.example.yaml. Bring them with SOPS or
# external-secrets and add the resources to this list.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
    - ../../base

components:
    # FQDN egress for the agent sandbox. Requires Cilium with DNS policy. On
    # an Istio mesh swap this for ../../components/istio (never both); with
    # neither, drop the line (base/networkpolicy.yaml still applies, and is
    # then the whole of the L3/L4 story).
    - ../../components/cilium

# Release pinning: every image at the release tag goreleaser published
# (v<version>, never moved once pushed). release-please bumps the block below
# in each release PR, so the overlay at a release tag always names that
# release's images — and Renovate leaves these alone (.github/renovate.json5):
# they are this repo's own output, not a dependency. For immutable pins, add a
# `digest:` (`crane digest ghcr.io/...:vX.Y.Z`) in your own overlay; a digest
# beats the tag. Keep PATCHY_CLAUDE_AGENT_IMAGE (and PATCHY_CODEX_AGENT_IMAGE /
# PATCHY_COPILOT_AGENT_IMAGE when enabled) in configmap-patch.yaml in step:
# kustomize rewrites container images, not ConfigMap values.
images:
    # x-release-please-start-version
    - name: ghcr.io/bitwise-media-group/patchy/integration-controller
      newTag: v0.12.1
    - name: ghcr.io/bitwise-media-group/patchy/source-controller
      newTag: v0.12.1
    - name: ghcr.io/bitwise-media-group/patchy/context-controller
      newTag: v0.12.1
    - name: ghcr.io/bitwise-media-group/patchy/investigation-controller
      newTag: v0.12.1
    - name: ghcr.io/bitwise-media-group/patchy/remediation-controller
      newTag: v0.12.1
    - name: ghcr.io/bitwise-media-group/patchy/evaluation-controller
      newTag: v0.12.1
    - name: ghcr.io/bitwise-media-group/patchy/claude-agent-runner
      newTag: v0.12.1
    - name: ghcr.io/bitwise-media-group/patchy/codex-agent-runner
      newTag: v0.12.1
    - name: ghcr.io/bitwise-media-group/patchy/copilot-agent-runner
      newTag: v0.12.1
    - name: ghcr.io/bitwise-media-group/patchy/status-server
      newTag: v0.12.1
    - name: ghcr.io/bitwise-media-group/patchy/egress-broker
      newTag: v0.12.1
    # x-release-please-end

patches:
    - path: configmap-patch.yaml
