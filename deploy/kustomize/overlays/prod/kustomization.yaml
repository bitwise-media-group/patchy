    - name: ghcr.io/bitwise-media-group/patchy/status-server
      digest: sha256:f862e8b1eac84ac407cfa36137ed1fa3d8f839849debacbdb11c5a11b0bb6af0

patches:
    - path: configmap-patch.yaml
