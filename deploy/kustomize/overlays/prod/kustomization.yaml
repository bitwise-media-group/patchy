#
# Production overlay: DESIGN.md's real intervals, the claude harness, digest-
# pinned images, and the Cilium FQDN policy on top of the base NetworkPolicies.
#
# The Secrets (patchy-github and patchy-anthropic, both in `patchy` — the
# claude credential belongs to the egress broker and never enters an agent pod)
# and your real Integration/Forge custom resources are NOT created here — see
# base/secrets.example.yaml and base/crs.example.yaml. Bring them with SOPS or
# external-secrets and add the resources to this list.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
    - ../../base

components:
    # FQDN egress for the agent sandbox. Requires Cilium with DNS policy. On
    # an Istio mesh swap this for ../../components/istio (never both); with
    # neither, drop the line (base/networkpolicy.yaml still applies, and is
    # then the whole of the L3/L4 story).
    - ../../components/cilium

# Digest pinning. PLACEHOLDERS — replace every sha256 below with the digest
# the release pipeline published (`crane digest ghcr.io/...:vX.Y.Z`), and keep
# PATCHY_CLAUDE_AGENT_IMAGE (and PATCHY_CODEX_AGENT_IMAGE when enabled) in
# configmap-patch.yaml in step with the runner digests: kustomize rewrites
# container images, not ConfigMap values.
images:
    - name: ghcr.io/bitwise-media-group/patchy/integration-controller
      digest: sha256:72a9d6a9ff8e67ab60076795bcff8b1265fd742856208f5e2e8f2eb0cd546dd1
    - name: ghcr.io/bitwise-media-group/patchy/source-controller
      digest: sha256:8e054e6b81e8265161f55b684769047be6fae67283bdfedcce226c39e2f21913
    - name: ghcr.io/bitwise-media-group/patchy/context-controller
      digest: sha256:ce8ccc834df064efe5f6c6103186b659e510b00b122f53ea6f77be51f0e99a79
    - name: ghcr.io/bitwise-media-group/patchy/investigation-controller
      digest: sha256:90aa9202ddbd2ec32590bb9c634d481ebb013536c055af63d73d7988d15e3983
    - name: ghcr.io/bitwise-media-group/patchy/remediation-controller
      digest: sha256:c811c5093250ae244a43a852a4d9cb4943aa1cc880cf33f848c154fc8dad819d
    - name: ghcr.io/bitwise-media-group/patchy/claude-agent-runner
      digest: sha256:0a4d8ce217a2fa57a05dbfb9fbc7321d223c4b65863dd373e68f2571c50d452a
    - name: ghcr.io/bitwise-media-group/patchy/codex-agent-runner
