<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="title desc">
  <title id="title">Patchy</title>
  <desc id="desc">A two-by-two grid of work units, with one tile, the patch, landing into its empty slot.</desc>
  <g fill="none" stroke="#7f8b85" stroke-width="1.6">
    <rect x="2.8" y="2.8" width="8.4" height="8.4" rx="2.2" />
    <rect x="2.8" y="12.8" width="8.4" height="8.4" rx="2.2" />
    <rect x="12.8" y="12.8" width="8.4" height="8.4" rx="2.2" />
  </g>
  <rect x="12.8" y="2.8" width="8.4" height="8.4" rx="2.2" fill="none" stroke="#7f8b85" stroke-width="1.2" stroke-dasharray="2 2" />
  <rect x="14" y="1.6" width="9.2" height="9.2" rx="2.4" fill="#1a9a7c" transform="rotate(-6 18.6 6.2)" />
</svg>
