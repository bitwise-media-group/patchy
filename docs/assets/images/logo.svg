      <rect x="62" y="73" width="50" height="32" rx="5" fill="#172219" opacity="0.16"/>
      <rect x="58" y="69" width="50" height="32" rx="5" fill="url(#pt-logo-sod)"/>
      <rect x="58" y="62" width="50" height="32" rx="5" fill="url(#pt-logo-turf)" stroke="#172219" stroke-width="2.1"/>
      <path d="M71 66C69.6 57.5 68.2 51 70.8 44.2c.9 1.8 1.8 5.4 2.3 9.4.5 4.8.8 8.6.9 12.4z" fill="#1e5c24"/>
      <path d="M76.2 65.5C75 53.5 74.2 45 77.8 35.8c1.1 2.4 2.3 7.4 2.9 13.2.6 6.6 1 11.6 1.1 16.5z" fill="#25672c"/>
      <path d="M82.4 65C85 54 88.6 46.2 94.6 38.4c-.6 2-1.5 6.2-2.2 10.8-.9 6.2-1.6 11-2 15.8z" fill="#1e5c24"/>
