<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Patchy</title>
  <desc id="desc">A square of new turf sliding over a soil hole, filling the gap.</desc>
  <defs>
    <linearGradient id="pt-logo-lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef5ea"/>
      <stop offset="100%" stop-color="#dce8d6"/>
    </linearGradient>
    <radialGradient id="pt-logo-hole" cx="46%" cy="32%" r="74%">
      <stop offset="0%" stop-color="#5c4030"/>
      <stop offset="55%" stop-color="#77583e"/>
      <stop offset="100%" stop-color="#4a3426"/>
    </radialGradient>
    <linearGradient id="pt-logo-turf" x1="0.18" y1="0" x2="0.82" y2="1">
      <stop offset="0%" stop-color="#3d9144"/>
      <stop offset="55%" stop-color="#2f7d36"/>
      <stop offset="100%" stop-color="#25682c"/>
    </linearGradient>
    <linearGradient id="pt-logo-sod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b6847"/>
      <stop offset="100%" stop-color="#5c4030"/>
    </linearGradient>
    <clipPath id="pt-logo-tile">
      <rect x="5" y="5" width="118" height="118" rx="26"/>
    </clipPath>
  </defs>

  <rect x="5" y="5" width="118" height="118" rx="26" fill="url(#pt-logo-lawn)" stroke="#afc2b0" stroke-width="2"/>

  <g clip-path="url(#pt-logo-tile)">
