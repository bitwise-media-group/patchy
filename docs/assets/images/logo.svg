    <ellipse cx="48" cy="88.4" rx="30.5" ry="13.8" fill="url(#pt-logo-hole)"/>
    <ellipse cx="48" cy="86.6" rx="20" ry="7.4" fill="#3d2a1e" opacity="0.4"/>
    <path d="M22 88.8c5.6 7.2 15.8 11.6 26 11.6s20.4-4.4 26-11.6" fill="none" stroke="#c4b09a" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

