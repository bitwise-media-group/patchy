apiVersion: mirror.patchy.bitwisemedia.uk/v1alpha1
kind: MirrorConfig
registries:
  - name: primary
    url: registry.example.com/org/platform
    chartNamespace: charts
    imageNamespace: images
  - name: ghcr
    url: ghcr.io/org/platform
    signing:
      provider: kms
      kms:
        key: gcpkms://projects/p/locations/l/keyRings/r/cryptoKeys/k
signing:
  provider: keyless
  keyless:
    certificateIdentity: https://github.com/org/repo/.github/workflows/publish.yaml@refs/heads/main
    certificateOidcIssuer: https://token.actions.githubusercontent.com
    tlogUpload: true
update:
  cooldownDays: 3
scan:
  scanners:
    osv: {enabled: true}
    grype: {enabled: false}
    kubescape: {enabled: true, mode: warn}
  failOn: [CRITICAL, HIGH]
  ignoreUnfixed: true
  allowlistMaxDays: 90
  allowlistNewDays: 90
sourceRegistryRewrites:
  docker.io: mirror.example.com/dockerhub
