<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>patchy</title>
    <meta name="description" content="Patchy pipeline status: findings, their progress, and all-time metrics." />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='none' stroke='%237f8b85' stroke-width='1.8'%3E%3Crect x='2.8' y='2.8' width='8.4' height='8.4' rx='2.2'/%3E%3Crect x='2.8' y='12.8' width='8.4' height='8.4' rx='2.2'/%3E%3Crect x='12.8' y='12.8' width='8.4' height='8.4' rx='2.2'/%3E%3C/g%3E%3Crect x='14' y='1.6' width='9.2' height='9.2' rx='2.4' fill='%231a9a7c' transform='rotate(-6 18.6 6.2)'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400..700&family=Atkinson+Hyperlegible+Next:ital,wght@0,400..700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="theme-patchy">
    <script>
      // Pre-paint theme restore — same class pair and storage key as the other
      // patchy surfaces, so the chosen mode follows the visitor across kits.
      // With no stored choice, the operating system's preference decides.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("patchy-theme");
        } catch (e) {}
        var light =
          stored === "light" ||
          (stored === null && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
        if (light) document.body.classList.replace("theme-patchy", "theme-patchy-light");
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
