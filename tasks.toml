# ---- repo-local tasks (the long tail the library intentionally omits) -------

# Overrides the archetype's go-lint (.mise/archetypes/go/scripts/lint.sh:
# golangci-lint plus a bare `govulncheck ./...`, once per GOOS in vars.goos,
# patchy sets none, so the host's only). The golangci-lint pass is the same;
# the override exists for govulncheck, which runs through hack/govulncheck.sh
# so it can carry a reviewed acceptance list for advisories with no fix
# (currently empty; see the script for how to accept one with a rationale
# and a re-review trigger). A bare govulncheck has no ignore mechanism.
[go-lint]
hide = true
dir = "{{cwd}}"
run = ["golangci-lint run", "hack/govulncheck.sh"]

# The e2e suite is a separate module: it boots an envtest kube-apiserver
# (the CRD state machine), builds the real controller binaries, and drives
# them with recorded webhook fixtures against an in-memory GitHub. No real
# cluster, no credentials, no network beyond the envtest asset download.
[e2e]
description = "run the end-to-end suite (envtest, real binaries, fake GitHub)"
dir = "{{cwd}}"
run = "./hack/e2e.sh"

# Deliver a recorded webhook fixture to a locally-running
# integration-controller, signed with its secret. It is the local stand-in for
# GitHub's webhook leg. -dev-secret signs with the dev overlay's placeholder
# webhook secret; -secret-file <file> supplies a real one. The task runs in
# e2e/, so relative fixture paths resolve from there.
# Example: mise run replay -- -dev-secret fixtures/webhooks/code_scanning_alert.created.json
[replay]
description = "sign and deliver a webhook fixture to a running controller"
dir = "{{cwd}}/e2e"
run = "go run ./replay"

# The e2e suite's in-memory GitHub API as a standalone dev server. The
# dev-fake overlay runs the same server in-cluster (nothing on the host
# needed); this task is for running it directly: poking at the API,
# developing the fake itself. See docs/deployment/colima.md.
[fakegithub]
description = "run the fake GitHub API standalone on the host"
dir = "{{cwd}}/e2e"
run = "go run ./fakegithub/cmd"

# Everything derived from api/v1alpha1: deepcopy methods (controller-gen
# object) and the CRD manifests for both kustomize and helm (hack/codegen.sh).
# CI treats a dirty tree after this task as drift and fails.
[codegen]
description = "regenerate deepcopy + CRD manifests from api/v1alpha1"
dir = "{{cwd}}"
run = "./hack/codegen.sh"

# The Tier-1 microbenchmark suite for the 2M-findings scale work: per-package
# benchmarks over synthetic datasets (internal/loadgen) plus the env-gated
# complexity-ratio assertions. Opt-in: never part of `make pr` or CI; the
# numbers are recorded under coverage/bench/ for benchstat comparison.
[bench]
description = "run the tier-1 microbenchmarks with complexity assertions"
dir = "{{cwd}}"
run = "./hack/bench.sh"

# The Tier-2 load suite: envtest + the real binaries at 50-100k findings
# (PATCHY_LOAD_N sizes it). Opt-in for the same reason: a full run takes
# tens of minutes and is meant for before/after measurement, not the gate.
[load]
description = "run the opt-in load tests (envtest, real binaries, 50k+ findings)"
dir = "{{cwd}}"
run = "./hack/load.sh"

# Tests that need a real API server (CRD schema validation, controller
# integration): setup-envtest provisions kube-apiserver/etcd, then the suites
# that skip without KUBEBUILDER_ASSETS run for real.
[envtest]
description = "run envtest-backed tests (real kube-apiserver)"
dir = "{{cwd}}"
run = "./hack/envtest.sh"

# Status page SPA: built into internal/web/ui/dist and embedded into the
# status-server binary via -tags withui (hack/build.sh). dist/ is git-ignored
# (a built bundle); sources/outputs rerun bun only when the UI sources change.
# The UI is bun end to end on the shared toolchain's bun (the repo pins no
# node): `bun check` type-checks, and build.ts bundles it through Bun.build
# (compile + browser target, with the Tailwind plugin) into one inlined
# dist/index.html.
[ui]
description = "build the embedded status page SPA (internal/web/ui/dist)"
dir = "{{cwd}}"
sources = [
  "internal/web/ui/package.json",
  "internal/web/ui/bun.lock",
  "internal/web/ui/index.html",
  "internal/web/ui/build.ts",
  "internal/web/ui/bunfig.toml",
  "internal/web/ui/tsconfig.json",
  "internal/web/ui/src/**/*",
]
outputs = ["internal/web/ui/dist/index.html"]
run = [
  "bun install --cwd internal/web/ui --frozen-lockfile --ignore-scripts",
  "bun run --cwd internal/web/ui build",
]

# The status page SPA on Bun's dev server (internal/web/ui/dev.ts), with hot
# reload, run from the UI's own directory wherever mise is invoked. /api,
# /events, /oauth2 and /logout are forwarded to a status server at
# PATCHY_API_TARGET (default http://127.0.0.1:8080), so run one alongside.
# --port picks the listen port (default 5173). --demo needs no server at all:
# the page runs on its built-in mock data (src/mock) and nothing is forwarded.
# Example: PATCHY_API_TARGET=http://127.0.0.1:9090 mise run ui-dev -- --port 5174
# Example: mise run ui-dev -- --demo
[ui-dev]
description = "run the status page SPA on the Bun dev server (hot reload)"
dir = "{{config_root}}/internal/web/ui"
raw = true
run = [
  "bun install --frozen-lockfile --ignore-scripts",
  "bun run dev",
]

# Screenshots of the status page for the docs (docs/assets/images/status-*.jpg,
# dark and light): internal/web/ui/screenshot.ts runs the dev server in
# --demo mode and drives headless Chrome over the DevTools protocol at
# 1440×900. Needs Chrome (or CHROME_PATH); run it outside the Claude Code
# sandbox, which blocks headless Chrome.
# Example: mise run ui-screenshots -- --chrome /usr/bin/chromium
[ui-screenshots]
description = "re-shoot the status page screenshots used by the docs"
dir = "{{config_root}}/internal/web/ui"
run = [
  "bun install --frozen-lockfile --ignore-scripts",
  "bun screenshot.ts",
]

# Redefines the archetype's build task (whole-task replacement): patchy is
# multi-binary (one controller per concern plus the agent runtime), so the
# single-app go-build is replaced by a loop over cmd/ (hack/build.sh; the
# multiline tasks live in hack/ so shellcheck lints them). The ui task runs
# first so the withui build can embed internal/web/ui/dist.
[build]
description = "build all patchy binaries into bin/"
dir = "{{cwd}}"
run = [{ task = "ui" }, "./hack/build.sh"]

# Canned status-page data for dev: apply the demo Findings/FindingRollups
# and seed their statuses (a subresource `kubectl apply -k` cannot write).
# The data is inert: every finding is suspended, with no trackingRef and
# no completedAt. See the manifest header.
[status-demo]
description = "seed canned findings/rollups for the status page (dev cluster)"
dir = "{{cwd}}"
run = "./hack/status-demo.sh"

# One-command local dev loop on Colima: cluster up, snapshot images, retag,
# apply the dev overlay, restart so a re-run redeploys. The interesting parts
# (traefik enablement, GITHUB_TOKEN secret, the ingress probe) are documented
# in the script and docs/deployment/colima.md.
[dev-colima]
description = "start colima, build snapshot images, deploy the dev overlay"
dir = "{{cwd}}"
run = "./hack/dev-colima.sh"

# The helm charts (charts/patchy = the stack, charts/patchy-config = the
# Integration/Forge CRs) render the same stack as deploy/kustomize and are
# published to oci://ghcr.io/bitwise-media-group/patchy/charts by
# .github/workflows/helm.yaml on release. This is the local gate: lint plus a
# render of every component combination the templates branch on.
[helm-lint]
description = "lint and render the helm charts"
dir = "{{cwd}}"
run = "./hack/helm-lint.sh"

# Everything derived from the CLI's cobra command tree: the per-command
# reference under docs/cli (nav'd from docs/operate/cli.md) and the shell completions.
# Kept repo-local because the archetype leaves `docs` to the app; see the
# comment at the head of .mise/archetypes/go/tasks.toml.
#
# Both are committed rather than generated at release time: the Homebrew cask
# installs the completions as static files, so the install is deterministic
# and never executes the binary at install time (see homebrew_casks in
# .goreleaser.yaml).

#
# `go run` rather than bin/patchy: the CLI is the one binary the multi-binary
# build task is not needed for, and nothing here depends on the status page
# SPA that `build` compiles first.
[docs]
description = "regenerate the CLI reference (docs/cli) and shell completions"
dir = "{{cwd}}"
run = [
  "go run ./cmd/patchy/internal/tools/docgen --out docs/cli --format markdown",
  "mkdir -p completions",
  "go run ./cmd/patchy completion bash > completions/patchy.bash",
  "go run ./cmd/patchy completion zsh > completions/patchy.zsh",
  "go run ./cmd/patchy completion fish > completions/patchy.fish",
]

# Size report: the bin/ binaries the build task produced, plus the top-10
# symbols and packages per binary from an unstripped link's symbol table
# (hack/size.sh: it never rebuilds the stripped binaries, it reads bin/
# and fails with a hint when build has not run). Part of the pr gate,
# after build, so dependency-graph growth stays visible per run. The CLI
# reached 135 MB before anyone re-measured.
[size]
description = "report binary sizes with top symbols/packages per binary"
dir = "{{cwd}}"
run = "./hack/size.sh"

# Redefined gates: the archetype's ci/pr plus the zensical docs build, so a
# broken site fails CI instead of surfacing at release time (the reusable
# release workflow's docs job publishes the site, keyed off zensical.toml).
[ci]
description = "the gates the reusable CI workflow runs"
run = [
  { task = "lint" },
  { task = "test" },
  { task = "build" },
  { task = "docs-build" },
]

[pr]
description = "full local gate before a pull request"
run = [
  { task = "tidy" },
  { task = "fmt" },
  { task = "lint" },
  { task = "test" },
  { task = "build" },
  { task = "docs" },
  { task = "docs-build" },
  { task = "size" },
  { task = "commit" },
]
